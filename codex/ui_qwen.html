/* ================= app: calculator ================= */
const getAccent=()=>Settings.data.accent||'#6fa8ff';
function calcFmt(v){
  if(!isFinite(v))return '\u221e';
  if(Number.isInteger(v)&&Math.abs(v)<1e15)return String(v);
  return String(parseFloat(v.toPrecision(12)));
}
function calcParse(src){
  src=String(src==null?'':src).replace(/\s+/g,'');
  if(!src)return 0;
  if(!/^[-+*/%().0-9]+$/.test(src))throw new Error('Invalid characters');
  let i=0;
  const peek=()=>src[i];
  const err=()=>{throw new Error('Invalid expression')};
  function factor(){
    let v;
    const c=peek();
    if(c==='+'){i++;v=factor()}
    else if(c==='-'){i++;v=-factor()}
    else if(c==='('){
      i++;
      v=expr();
      if(peek()!==')')err();
      i++;
    }
    else if(c>='0'&&c<='9'){
      let n='';
      while(i<src.length&&/[0-9.]/.test(src[i]))n+=src[i++];
      if(n==='.'||(n.split('.').length-1)>1)err();
      v=parseFloat(n);
    }
    else err();
    while(peek()==='%'){i++;v=v/100}
    return v;
  }
  function term(){
    let v=factor();
    for(;;){
      const c=peek();
      if(c==='*'){i++;v=v*factor()}
      else if(c==='/'){
        i++;
        const r=factor();
        if(r===0)throw new Error('Division by zero');
        v=v/r;
      }
      else break;
    }
    return v;
  }
  function expr(){
    let v=term();
    for(;;){
      const c=peek();
      if(c==='+'){i++;v=v+term()}
      else if(c==='-'){i++;v=v-term()}
      else break;
    }
    return v;
  }
  const r=expr();
  if(i<src.length)throw new Error('Invalid expression');
  if(!isFinite(r))throw new Error('Invalid expression');
  return r;
}
const AppCalc={
  KEYS:[
    ['C','warn'],['\u232B','warn'],['(','op'],[')','op'],
    ['7','n'],['8','n'],['9','n'],['\u00F7','op'],
    ['4','n'],['5','n'],['6','n'],['\u00D7','op'],
    ['1','n'],['2','n'],['3','n'],['\u2212','op'],
    ['%','op'],['0','n'],['.','n'],['+','op'],
    ['=','eq']
  ],
  MAP:{'\u00F7':'/','\u00D7':'*','\u2212':'-'},
  open(w){
    w.calc={expr:'',last:'',fresh:false,errT:0};
    w.body.classList.add('ac');
    w.body.innerHTML='';
    const disp=el('div','ac-disp');
    disp.innerHTML='<div class="ac-expr"></div><div class="ac-res">0</div><div class="ac-last"></div>';
    w.body.appendChild(disp);
    const grid=el('div','ac-grid');
    this.KEYS.forEach(kd=>{
      const b=el('button','ac-key '+kd[1]);
      b.textContent=kd[0];
      b.setAttribute('aria-label',kd[0]);
      b.addEventListener('click',()=>this._press(w,kd[0]));
      grid.appendChild(b);
    });
    w.body.appendChild(grid);
    this._refresh(w);
  },
  _press(w,label){
    const c=w.calc;
    const ch=this.MAP[label]||label;
    if(c.errT){clearTimeout(c.errT);c.errT=0}
    if(label==='C'){
      c.expr='';c.last='';c.fresh=false;
      this._refresh(w);
      return;
    }
    if(label==='\u232B'){
      if(c.fresh){c.expr='';c.last='';c.fresh=false}
      else c.expr=c.expr.slice(0,-1);
      this._refresh(w);
      return;
    }
    if(label==='='){
      if(!c.expr)return;
      const res=w.body.querySelector('.ac-res');
      try{
        const v=calcParse(c.expr);
        c.last=c.expr+' = '+calcFmt(v);
        c.expr=calcFmt(v);
        c.fresh=true;
        this._refresh(w);
      }catch(err){
        c.expr='';c.last='';c.fresh=true;
        this._refresh(w);
        if(res){
          res.textContent=String(err.message||'Error');
          res.style.color='var(--danger)';
          c.errT=setTimeout(()=>{
            c.errT=0;
            if(res.isConnected){res.style.color='';this._refresh(w)}
          },1600);
        }
      }
      return;
    }
    if(ch==='+'||ch==='-'||ch==='*'||ch==='/'||ch==='%'){
      if(c.fresh){c.last='';c.fresh=false}
      if(!c.expr){
        if(ch==='-')c.expr='-';
        else return;
      }else{
        const lastCh=c.expr.slice(-1);
        if((ch==='*'||ch==='/')&&(lastCh==='+'||lastCh==='-'))c.expr=c.expr.slice(0,-1);
        c.expr+=ch;
      }
      this._refresh(w);
      return;
    }
    if(ch==='('||ch===')'){
      if(c.fresh){c.last='';c.fresh=false}
      c.expr+=ch;
      this._refresh(w);
      return;
    }
    if(c.fresh){c.expr='';c.last='';c.fresh=false}
    if(label==='.'){
      if(!c.expr)c.expr='0.';
      else if(c.expr.indexOf('.')<0)c.expr+='.';
    }else{
      c.expr+=label;
    }
    this._refresh(w);
  },
  _refresh(w){
    const c=w.calc;
    if(!c)return;
    const ex=w.body.querySelector('.ac-expr');
    const res=w.body.querySelector('.ac-res');
    const last=w.body.querySelector('.ac-last');
    if(ex)ex.textContent=c.expr;
    if(last)last.textContent=c.last;
    if(res){
      if(c.errT)return;
      let t='0';
      if(c.fresh)t=c.expr;
      else if(c.expr){
        try{t=calcFmt(calcParse(c.expr))}catch(e2){t='\u2026'}
      }
      res.textContent=t;
    }
  },
  onKey(e,w){
    const k=e.key;
    let label=null;
    if(k==='Enter'||k==='=')label='=';
    else if(k==='Backspace')label='\u232B';
    else if(k==='Escape')label='C';
    else if(k==='*')label='\u00D7';
    else if(k==='/')label='\u00F7';
    else if(k==='-')label='\u2212';
    else if(k==='+')label='+';
    else if(k==='.')label='.';
    else if(k==='(')label='(';
    else if(k===')')label=')';
    else if(k==='%')label='%';
    else if(k.length===1&&/[0-9]/.test(k))label=k;
    if(!label)return;
    e.preventDefault();
    this._press(w,label);
  },
  onClose(w){
    if(w.calc&&w.calc.errT)clearTimeout(w.calc.errT);
  }
};

function drawSpark(cv,samples,color,maxV){
  if(!cv)return;
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||100,H=cv.clientHeight||40;
  const pw=Math.round(W*dpr),ph=Math.round(H*dpr);
  if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph}
  const ctx=cv._ctx||(cv._ctx=cv.getContext('2d'));
  if(!ctx)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(!samples||samples.length<2)return;
  const max=maxV||100;
  const n=samples.length;
  const step=W/47;
  const pts=[];
  for(let i=0;i<n;i++){
    const x=W-(n-1-i)*step;
    const y=H-2-(clamp(samples[i],0,max)/max)*(H-8);
    pts.push([x,y]);
  }
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    if(i)ctx.lineTo(pts[i][0],pts[i][1]);
    else ctx.moveTo(pts[i][0],pts[i][1]);
  }
  ctx.lineWidth=1.4;
  ctx.lineJoin='round';
  ctx.lineCap='round';
  ctx.strokeStyle=color;
  ctx.stroke();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,hexToRgba(color,0.22));
  g.addColorStop(1,hexToRgba(color,0));
  ctx.lineTo(pts[pts.length-1][0],H);
  ctx.lineTo(pts[0][0],H);
  ctx.closePath();
  ctx.fillStyle=g;
  ctx.fill();
}

    const t={
      cpu:clamp(30+22*Math.sin(e*0.11+m.ph.c)+2*vis,4,96),
      mem:clamp(52+8*Math.sin(e*0.05+m.ph.m),8,92),
      gpu:clamp(12+10*Math.abs(Math.sin(e*0.13+m.ph.g)),2,80),
      netd:clamp(60+38*Math.sin(e*0.09+m.ph.d),2,120),
      netu:clamp(22+14*Math.sin(e*0.07+m.ph.u),1,90)
    };
    const v=m.vals;
    v.cpu+=(t.cpu-v.cpu)*0.25;
    v.mem+=(t.mem-v.mem)*0.25;
    v.gpu+=(t.gpu-v.gpu)*0.25;
    v.netd+=(t.netd-v.netd)*0.25;
    v.netu+=(t.netu-v.netu)*0.25;
    v.disk=clamp(v.disk+Math.sin(e*0.03+m.ph.k)*0.12,40,86);
    const push=(k,val)=>{
      const a=m.samples[k];
      a.push(val);
      if(a.length>48)a.shift();
    };
    push('cpu',v.cpu);
    push('mem',v.mem);
    push('gpu',v.gpu);
    push('netd',v.netd);

    u.gpuC.v.textContent=Math.round(v.gpu)+'%';

      const r=m.rows[name];
      if(!r||r.el.classList.contains('gone'))return;
      r.c.textContent=Math.round(clamp(m.procVals[idx]+4*Math.sin(e*0.13+idx*1.7),1,26))+'%';
      r.m.textContent=Math.round(clamp(m.procVals[idx]+3*Math.sin(e*0.05+idx*2.3),1,30))+'%';
    });

    u.wins.textContent=WM.windows.filter(x=>!x._closing).length+' WINDOWS OPEN';
  },
  _kill(w,row,idx,name){

    },3500);
  },

    if(w.mon){

      w.mon=null;
    }
  }

    }

  _render(w){
    if(!w.set||!w.set.panel)return;
    const s=Settings.data;
    const panel=w.set.panel;
    panel.innerHTML='';
    const tt=this.TITLES[w.set.section]||['Settings',''];
    const head=el('div');
    head.innerHTML='<div class="as-p-title">'+esc(tt[0])+'</div><div class="as-p-sub">'+esc(tt[1])+'</div>';
    panel.appendChild(head);
    const block=(bt,build)=>{
      const b=el('div','as-block');
      b.innerHTML='<div class="as-b-t">'+esc(bt)+'</div>';
      const c=el('div');
      b.appendChild(c);
      panel.appendChild(b);
      build(c);
      return c;
    };
    const row=(label,rsub,control)=>{
      const r=el('div','mrow');
      r.innerHTML='<div class="mr-tx"><span class="mr-l">'+esc(label)+'</span><span class="mr-s">'+esc(rsub||'')+'</span></div>';
      if(control)r.appendChild(control);
      panel.appendChild(r);
      return r;
    };
    const seg=(values,cur,cb)=>{
      const g=el('span','seg');
      values.forEach(vd=>{
        const b=el('button',vd.value===cur?'on':'');
        b.textContent=vd.label;
        b.addEventListener('click',()=>{
          if(vd.value!==cur){
            cb(vd.value);
            g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
            b.classList.add('on');
          }
        });
        g.appendChild(b);
      });
      return g;
    };
    const sw=(on,cb)=>{
      const b=el('button','sw'+(on?' on':''));
      b.setAttribute('role','switch');
      b.setAttribute('aria-checked',on?'true':'false');
      b.setAttribute('aria-label','Toggle');
      b.addEventListener('click',()=>{
        const nv=!b.classList.contains('on');
        b.classList.toggle('on',nv);
        b.setAttribute('aria-checked',nv?'true':'false');
        cb(nv);
      });
      return b;
    };
    const range=(val,min,max,step,cb)=>{
      const r=el('input','range');
      r.type='range';
      r.min=min;r.max=max;r.step=step;r.value=val;
      r.setAttribute('aria-label','Adjust');
      const fill=()=>{
        const p=((+r.value-min)/(max-min))*100;
        r.style.setProperty('--p',p+'%');
      };
      r.addEventListener('input',()=>{
        fill();
        cb(+r.value);
      });
      fill();
      return r;
    };
    const togRow=(label,rsub,get,setfn)=>{
      row(label,rsub,sw(get(),v=>setfn(v)));
    };

      block('Theme',c=>{
        row('Variation','System-wide colour palette',seg(

const AppKB={
  open(w){
    w.kb={hist:['home'],hi:0};
    w.body.classList.add('akb');
    w.body.innerHTML='';
    const bar=el('div','kb-bar');
    const bk=el('button','ibtn kb-bk');
    bk.innerHTML=Icon('chevL',15);
    bk.setAttribute('aria-label','Back');
    const fw=el('button','ibtn kb-fw');
    fw.innerHTML=Icon('chevR',15);
    fw.setAttribute('aria-label','Forward');
    const addr=el('div','kb-addr');
    const inp=el('input','inp kb-addr-in');
    inp.type='text';
    inp.placeholder='nova://home';
    inp.spellcheck=false;
    inp.autocomplete='off';
    inp.setAttribute('aria-label','Address');
    addr.appendChild(inp);
    bar.appendChild(bk);
    bar.appendChild(fw);
    bar.appendChild(addr);
    w.body.appendChild(bar);
    const body=el('div','kb-body md');
    w.body.appendChild(body);
    bk.addEventListener('click',()=>{
      if(w.kb.hi>0){w.kb.hi--;this._render(w)}
    });
    fw.addEventListener('click',()=>{
      if(w.kb.hi<w.kb.hist.length-1){w.kb.hi++;this._render(w)}
    });
    inp.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      e.preventDefault();
      let v=String(inp.value||'').trim().toLowerCase();
      v=v.replace(/^nova:\/\//,'');
      if(!v)return;
      let hit=null;
      if(KB_PAGES[v])hit=v;
      else{
        let best=-1;
        Object.keys(KB_PAGES).forEach(k=>{
          const sc=fuzzy(v,k+' '+KB_TITLES[k]);
          if(sc>best){best=sc;hit=k}
        });
      }
      if(hit)this._go(w,hit);
      else Notify.toast('Page not found','nova://'+v+' does not exist in the knowledge base.','close');
    });
    body.addEventListener('click',e=>{
      const c=e.target.closest('.kb-card');
      if(c&&c.dataset.nav)this._go(w,c.dataset.nav);
    });
    this._render(w);
  },
  _go(w,page){
    if(!KB_PAGES[page])return;
    const h=w.kb.hist;
    h.splice(w.kb.hi+1);
    h.push(page);
    w.kb.hi=h.length-1;
    this._render(w);
  },
  _render(w){
    if(!w.kb)return;
    const page=KB_PAGES[w.kb.hist[w.kb.hi]];
    if(!page)return;
    const body=w.body.querySelector('.kb-body');
    if(body)body.innerHTML=page.render();
    const inp=w.body.querySelector('.kb-addr-in');
    if(inp)inp.value='nova://'+w.kb.hist[w.kb.hi];
    const bk=w.body.querySelector('.kb-bk');
    const fw=w.body.querySelector('.kb-fw');
    if(bk)bk.disabled=w.kb.hi===0;
    if(fw)fw.disabled=w.kb.hi>=w.kb.hist.length-1;
    if(body)body.scrollTop=0;
  }
};

function lcg(seed){
  let s=seed>>>0;
  return function(){
    s=(s*1103515245+12345)&0x7fffffff;
    return s/0x7fffffff;
  };

    }
  },
  {
    id:'orbital',name:'Orbital Dawn',
    draw(x){
      const rnd=lcg(77);
      x.fillStyle='#04060f';
      x.fillRect(0,0,960,600);
      for(let i=0;i<180;i++){
        const sz=rnd()<0.9?1:2;
        x.fillStyle='rgba(255,255,255,'+(0.2+rnd()*0.65).toFixed(2)+')';
        x.fillRect(rnd()*960,rnd()*600,sz,sz);
      }
      const glow=x.createLinearGradient(0,380,0,600);
      glow.addColorStop(0,'rgba(255,140,90,0)');
      glow.addColorStop(1,'rgba(255,140,90,0.35)');
      x.fillStyle=glow;
      x.fillRect(0,380,960,220);
      const pg=x.createRadialGradient(400,260,20,480,300,190);
      pg.addColorStop(0,'#9fd8ff');
      pg.addColorStop(0.45,'#3f7fc4');
      pg.addColorStop(0.8,'#1c3c66');
      pg.addColorStop(1,'#101f38');
      x.beginPath();
      x.arc(450,280,170,0,Math.PI*2);
      x.fillStyle=pg;
      x.fill();
      x.save();
      x.translate(450,280);
      x.rotate(-0.35);
      x.scale(1,0.32);
      for(let r=190;r<=250;r+=12){
        x.beginPath();
        x.arc(0,0,r,0,Math.PI*2);
        x.strokeStyle='rgba(160,200,255,'+Math.max(0.08,0.5-(r-190)/160*0.4).toFixed(2)+')';
        x.lineWidth=r===250?1.5:3;
        x.stroke();
      }
      x.restore();
    }
  },
  {
    id:'horizon',name:'Dark Horizon',
    draw(x){
      const rnd=lcg(42);
      const sky=x.createLinearGradient(0,0,0,420);
      sky.addColorStop(0,'#020308');
      sky.addColorStop(1,'#0a0f1e');
      x.fillStyle=sky;
      x.fillRect(0,0,960,420);
      for(let i=0;i<90;i++){
        x.fillStyle='rgba(255,255,255,'+(0.15+rnd()*0.5).toFixed(2)+')';
        x.fillRect(rnd()*960,rnd()*400,1,1);
      }
      const dg=x.createRadialGradient(560,300,4,560,300,60);
      dg.addColorStop(0,'#e8ecff');
      dg.addColorStop(0.18,'#8fa8d8');
      dg.addColorStop(1,'rgba(30,40,80,0)');
      x.beginPath();
      x.arc(560,300,46,0,Math.PI*2);
      x.fillStyle=dg;
      x.fill();
      x.fillStyle='#05070d';
      x.fillRect(0,420,960,180);
      const hg=x.createLinearGradient(0,416,0,426);
      hg.addColorStop(0,'rgba(120,160,255,0)');
      hg.addColorStop(0.5,'rgba(140,180,255,0.5)');
      hg.addColorStop(1,'rgba(120,160,255,0)');
      x.fillStyle=hg;
      x.fillRect(0,416,960,10);
      const vg=x.createRadialGradient(480,300,200,480,300,700);
      vg.addColorStop(0,'rgba(0,0,0,0)');
      vg.addColorStop(1,'rgba(0,0,0,0.5)');
      x.fillStyle=vg;
      x.fillRect(0,0,960,600);
    }
  },
  {
    id:'aurora2',name:'Glass Aurora',
    draw(x){
      const g=x.createLinearGradient(0,0,0,600);
      g.addColorStop(0,'#04070f');
      g.addColorStop(1,'#081226');
      x.fillStyle=g;
      x.fillRect(0,0,960,600);
      const hues=[168,190,210,260,300];
      for(let i=0;i<960;i+=6){
        const h=hues[Math.floor(i/192)%hues.length];
        const a=0.05+0.10*Math.abs(Math.sin(i/960*Math.PI*3));
        const gr=x.createLinearGradient(i,0,i,600);
        gr.addColorStop(0,'hsla('+h+',80%,60%,0)');
        gr.addColorStop(0.5,'hsla('+h+',80%,62%,'+a.toFixed(3)+')');
        gr.addColorStop(1,'hsla('+h+',80%,60%,0)');
        x.fillStyle=gr;
        x.fillRect(i,0,6,600);
      }
      const vg=x.createRadialGradient(480,300,220,480,300,640);
      vg.addColorStop(0,'rgba(0,0,0,0)');
      vg.addColorStop(1,'rgba(2,4,10,0.55)');
      x.fillStyle=vg;
      x.fillRect(0,0,960,600);
    }
  },
  {
    id:'ion',name:'Ion Fields',
    draw(x){
      x.fillStyle='#030509';
      x.fillRect(0,0,960,600);
      const cx=480,cy=300;
      for(let i=0;i<26;i++){
        const r=18+i*16;
        const off=(i%2?1:-1)*(6+i*2);
        const hue=(200+i*9)%360;
        x.beginPath();
        x.arc(cx+off*0.6,cy+off*0.3,r,0,Math.PI*2);
        x.strokeStyle='hsla('+hue+',75%,58%,'+Math.max(0.04,0.5-i*0.016).toFixed(3)+')';
        x.lineWidth=1.6;
        x.stroke();
      }
      const cg=x.createRadialGradient(cx,cy,0,cx,cy,140);
      cg.addColorStop(0,'rgba(140,220,255,0.55)');
      cg.addColorStop(1,'rgba(140,220,255,0)');
      x.fillStyle=cg;
      x.fillRect(0,0,960,600);
    }
  }
];
const AppGal={
  cache:{},
  _gen(g){
    if(!this.cache[g.id]){
      const c=makeCanvas();
      g.draw(c.getContext('2d'));
      this.cache[g.id]=c.toDataURL('image/jpeg',0.82);
    }
    return this.cache[g.id];
  },
  open(w,opts){
    let i=0;
    if(opts&&opts.file){
      const nm=opts.file.join('/').toLowerCase();
      for(let k=0;k<GALLERY.length;k++){
        if(nm.indexOf(GALLERY[k].id)>=0||nm.indexOf(GALLERY[k].name.toLowerCase())>=0){i=k;break}
      }
    }
    w.gal={i:i};
    w.body.classList.add('ag');
    w.body.innerHTML='';
    const grid=el('div','ag-grid');
    GALLERY.forEach((g,idx)=>{
      const t=el('button','ag-thumb');
      t.setAttribute('aria-label','View '+g.name);
      const im=el('img');
      im.src=this._gen(g);
      im.alt=g.name;
      const tt=el('span','ag-tt');
      tt.textContent=g.name;
      t.appendChild(im);
      t.appendChild(tt);
      t.addEventListener('click',()=>this._go(w,idx));
      grid.appendChild(t);
    });
    w.body.appendChild(grid);
    const view=el('div','ag-view');
    const stage=el('div','ag-stage');
    const img=el('img','ag-img');
    img.alt='Gallery image';
    stage.appendChild(img);
    view.appendChild(stage);
    const nav=el('div','ag-nav');
    const pv=el('button','ibtn');
    pv.innerHTML=Icon('chevL',15);
    pv.setAttribute('aria-label','Previous image');
    const nx=el('button','ibtn');
    nx.innerHTML=Icon('chevR',15);
    nx.setAttribute('aria-label','Next image');
    const cap=el('span','ag-cap');
    const nm2=el('span','ag-nm');
    const cn=el('span','ag-cn');
    cap.appendChild(nm2);
    cap.appendChild(cn);
    const st=el('button','btn ag-set');
    st.innerHTML=Icon('gallery',14)+'Set as wallpaper';
    st.addEventListener('click',()=>{
      if(!w.gal)return;
      const g=GALLERY[w.gal.i];
      Settings.data.customWp=this._gen(g);
      Settings.set('wallpaper','custom');
      Notify.toast('Wallpaper changed',g.name+' is now the wallpaper.','gallery');
    });
    nav.appendChild(pv);
    nav.appendChild(nx);
    nav.appendChild(cap);
    nav.appendChild(st);
    view.appendChild(nav);
    w.body.appendChild(view);
    pv.addEventListener('click',()=>this._go(w,(w.gal.i-1+GALLERY.length)%GALLERY.length));
    nx.addEventListener('click',()=>this._go(w,(w.gal.i+1)%GALLERY.length));
    this._go(w,i);
  },
  _go(w,i){
    if(!w.gal)return;
    w.gal.i=i;
    const g=GALLERY[i];
    const img=w.body.querySelector('.ag-img');
    if(img)img.src=this._gen(g);
    const nm2=w.body.querySelector('.ag-nm');
    if(nm2)nm2.textContent=g.name;
    const cn=w.body.querySelector('.ag-cn');
    if(cn)cn.textContent=(i+1)+' / '+GALLERY.length;
    w.body.querySelectorAll('.ag-thumb').forEach((t,idx)=>t.classList.toggle('on',idx===i));
  }
};
/* ================= app: trash ================= */
const AppTrash={
  open(w){
    w.body.classList.add('atr');
    w.body.innerHTML='';
    const bar=el('div','atr-bar');
    bar.innerHTML='<span class="at-t">'+Icon('trash',16)+'<span>Trash</span></span><span class="at-n"></span><span class="grow"></span>';
    const btn=el('button','btn sm atr-empt');
    btn.textContent='Empty trash';
    btn.addEventListener('click',()=>{
      const t=FS.trashDir();
      if(!t||!t.children||!t.children.length){
        Notify.toast('Trash is empty','Nothing to empty.','trash',2200);
        return;
      }
      Dialog.confirm('Permanently delete all items in Trash? This cannot be undone.','Empty trash?','Delete all',true).then(ok=>{
        if(!ok)return;
        FS.emptyTrash();
        Notify.toast('Trash emptied','All items were deleted permanently.','trash');
      });
    });
    bar.appendChild(btn);
    const list=el('div','atr-list');
    w.body.appendChild(bar);
    w.body.appendChild(list);
    w._atSub=()=>this._render(w);
    Bus.on('fs:change',w._atSub);
    this._render(w);
  },
  _render(w){
    const list=w.body.querySelector('.atr-list');
    if(!list)return;
    const t=FS.trashDir();
    const items=(t&&t.children)?t.children:[];
    const nEl=w.body.querySelector('.atr-bar .at-n');
    if(nEl)nEl.textContent=items.length?items.length+' item'+(items.length>1?'s':''):'Empty';
    list.innerHTML='';
    if(!items.length){
      const e=el('div','atr-empty');
      e.innerHTML=Icon('trash',30)+'<br>Trash is empty<br><span style="font-size:.64rem">Deleted files land here and can be restored.</span>';
      list.appendChild(e);
      return;
    }
    items.forEach(it=>{
      const row=el('div','atr-row');
      const ic=el('span','atr-ic');
      ic.innerHTML=Icon(AppFiles._icon(it),16);
      const tx=el('span','atr-tx');
      const nm=el('span','atr-nm');
      nm.textContent=it.name;
      const fr=el('span','atr-fr');
      fr.textContent='from '+FS.displayPath(it.from||['home'])+' \u00B7 '+timeAgo(it.trashedAt);
      tx.appendChild(nm);
      tx.appendChild(fr);
      const bs=el('span','atr-btns');
      const rb=el('button','btn sm');
      rb.textContent='Restore';
      rb.addEventListener('click',()=>{
        const err=FS.restore(it);
        if(err)Notify.toast('Restore failed',err,'close');
        else Notify.toast('Restored',it.name,'files');
      });
      const db=el('button','btn sm dng');
      db.textContent='Delete';
      db.addEventListener('click',()=>{
        Dialog.confirm('Permanently delete "'+it.name+'"? This cannot be undone.','Delete permanently?','Delete',true).then(ok=>{
          if(!ok)return;
          FS.deleteForever(it);
          Notify.toast('Deleted permanently',it.name,'trash');
        });
      });
      bs.appendChild(rb);
      bs.appendChild(db);
      row.appendChild(ic);
      row.appendChild(tx);
      row.appendChild(bs);
      list.appendChild(row);
    });
  },
  onClose(w){
    if(w._atSub){
      Bus.off('fs:change',w._atSub);
      w._atSub=null;
    }
  }
};
/* ================= registration & bootstrap ================= */
function registerAllApps(){
  AppRegistry.register({id:'files',name:'Files',icon:'files',w:720,h:470,kw:'file manager documents browse explorer',open:AppFiles.open.bind(AppFiles),onClose:AppFiles.onClose.bind(AppFiles),onKey:AppFiles.onKey.bind(AppFiles)});
  AppRegistry.register({id:'notes',name:'Notes',icon:'notes',multi:true,w:680,h:460,kw:'text editor markdown write',open:AppNotes.open.bind(AppNotes),onClose:AppNotes.onClose.bind(AppNotes),onSave:AppNotes.onSave.bind(AppNotes),onActivate:AppNotes.onActivate.bind(AppNotes)});
  AppRegistry.register({id:'terminal',name:'Terminal',icon:'terminal',multi:true,w:640,h:420,kw:'shell console command cli',open:AppTerm.open.bind(AppTerm),onActivate:AppTerm.onActivate.bind(AppTerm)});
  AppRegistry.register({id:'calc',name:'Calculator',icon:'calc',w:340,h:470,kw:'math numbers arithmetic',open:AppCalc.open.bind(AppCalc),onKey:AppCalc.onKey.bind(AppCalc),onClose:AppCalc.onClose.bind(AppCalc)});
  AppRegistry.register({id:'monitor',name:'System Monitor',icon:'monitor',w:760,h:520,kw:'performance cpu memory processes diagnostics',open:AppMon.open.bind(AppMon),onClose:AppMon.onClose.bind(AppMon)});
  AppRegistry.register({id:'settings',name:'Settings',icon:'settings',w:700,h:480,kw:'preferences appearance theme wallpaper system',open:AppSet.open.bind(AppSet),onNavigate:AppSet.onNavigate.bind(AppSet)});
  AppRegistry.register({id:'knowledge',name:'Knowledge',icon:'knowledge',w:740,h:500,kw:'docs documentation help guide browser internal',open:AppKB.open.bind(AppKB)});
  AppRegistry.register({id:'gallery',name:'Gallery',icon:'gallery',w:720,h:480,kw:'images pictures photos artwork wallpaper',open:AppGal.open.bind(AppGal)});
  AppRegistry.register({id:'trash',name:'Trash',icon:'trash',w:600,h:420,kw:'deleted recycle bin',open:AppTrash.open.bind(AppTrash),onClose:AppTrash.onClose.bind(AppTrash)});
  AppRegistry.register({id:'about',name:'About',icon:'about',w:480,h:460,kw:'system info version nova',open:AppAbout.open.bind(AppAbout)});
}
function init(){
  registerAllApps();
  Settings.load();
  Settings.apply();
  FS.init();
  Notes.load();
  Recent.load();
  Wallpaper.init();
  AltTab.init();
  Taskbar.init();
  StartMenu.init();
  QuickSettings.init();
  ClockPop.init();
  NotifyCenter.init();
  Notify.init();
  Palette.init();
  Desktop.init();
  Desktop.render();
  LockScreen.init();
  SleepScreen.init();
  MatrixFx.init();
  Clock.init();
  Power.start();
  Bus.on('settings',key=>{
    if(!key)return;
    if(key.indexOf('toggles.')===0){
      QuickSettings.render();
      const nc=byId('notifcenter');
      if(nc&&!nc.classList.contains('hidden'))NotifyCenter.render();
      return;
    }
    Taskbar._tray();
    if(key==='iconSize')Desktop.render();
    const discrete=['theme','accent','wallpaper','clock24','dayNight','reducedMotion','highContrast'];
    if(discrete.indexOf(key)>=0){
      WM.windows.filter(x=>x.app.id==='settings'&&!x._closing).forEach(x=>{
        try{AppSet._render(x)}catch(e){}
      });
    }
  });
  document.addEventListener('keydown',e=>{
    const meta=e.ctrlKey||e.metaKey;
    const editing=isEditable(e.target);
    if(Nova.locked){
      if(e.key!=='Alt'&&e.key!=='Meta'){
        if(e.key!=='F5'&&e.key!=='F12')e.preventDefault();
        LockScreen.unlock();
      }
      return;
    }
    if(Nova.asleep){
      if(e.key!=='Alt'&&e.key!=='Meta'){
        if(e.key!=='F5'&&e.key!=='F12')e.preventDefault();
        SleepScreen.wake();
      }
      return;
    }
    if(MatrixFx.active&&(e.key==='Escape'||e.key===' ')){
      e.preventDefault();
      MatrixFx.stop();
      return;
    }
    if(e.altKey&&e.key==='Tab'){
      e.preventDefault();
      AltTab.handleTab(e.shiftKey);
      return;
    }
    if(meta&&(e.key==='k'||e.key==='K')){
      e.preventDefault();
      Palette.toggle();
      return;
    }
    if(meta&&(e.key==='l'||e.key==='L')&&!editing){
      e.preventDefault();
      Nova.lock();
      return;
    }
    if(meta&&e.altKey&&(e.key==='t'||e.key==='T')){
      e.preventDefault();
      openApp('terminal',{force:true});
      return;
    }
    if(meta&&(e.key==='s'||e.key==='S')){
      e.preventDefault();
      if(WM.active&&WM.active.app.onSave){
        try{WM.active.app.onSave(WM.active)}catch(err){}
      }
      return;
    }
    if(meta&&(e.key==='w'||e.key==='W')&&!editing){
      e.preventDefault();
      if(WM.active)WM.close(WM.active);
      return;
    }
    if(e.key==='Escape'){
      const dr=byId('dr');
      if(dr&&!dr.classList.contains('hidden'))return;
      if(AltTab.shown){AltTab.release();return}
      if(Menu.open){e.preventDefault();Menu.close();return}
      ClosePops([]);
      return;
    }
    if(Menu.open){
      if(e.key==='ArrowDown'){e.preventDefault();Menu.move(1);return}
      if(e.key==='ArrowUp'){e.preventDefault();Menu.move(-1);return}
      if(e.key==='Enter'){e.preventDefault();Menu.runSel();return}
    }
    if(!editing&&WM.active&&WM.active.app.onKey){
      try{WM.active.app.onKey(e,WM.active)}catch(err){}
    }
  });
  document.addEventListener('mousedown',e=>{
    if(Nova.locked||Nova.asleep)return;
    if(!e.target||typeof e.target.closest!=='function')return;
    if(MatrixFx.active){MatrixFx.stop();return}
    if(AltTab.shown){
      if(!e.target.closest('#alttab'))AltTab.release();
      return;
    }
    const pal=byId('pal');
    if(!e.target.closest('#pal')&&pal&&!pal.classList.contains('hidden'))Palette.close();
    if(!e.target.closest('#startmenu')&&!e.target.closest('#tb-start')&&!byId('startmenu').classList.contains('hidden'))StartMenu.close();
    if(!e.target.closest('#quicksettings')&&!e.target.closest('#tb-tray')&&!byId('quicksettings').classList.contains('hidden'))QuickSettings.toggle();
    if(!e.target.closest('#clockpop')&&!e.target.closest('#tray-clock')&&!byId('clockpop').classList.contains('hidden'))ClockPop.toggle();
    if(!e.target.closest('#notifcenter')&&!e.target.closest('#tray-bell')&&!byId('notifcenter').classList.contains('hidden'))NotifyCenter.toggle();
    if(!e.target.closest('#ctxmenu')&&Menu.open)Menu.close();
    if(e.target===byId('desktop')||e.target.id==='wallpaper'||e.target.id==='desktop-icons')Desktop._deselect();
  });
  window.addEventListener('keyup',e=>{
    if(e.key==='Alt')AltTab.release();
  });
  window.addEventListener('resize',debounce(()=>{
    if(!Nova.locked&&!Nova.asleep)WM.clampAll();
  },250));
  window.addEventListener('blur',()=>AltTab.release());
  window.addEventListener('error',e=>{
    if(window._novaErr)return;
    window._novaErr=true;
    setTimeout(()=>{window._novaErr=false},4000);
    Notify.toast('An unexpected error occurred','It was caught and contained — the system remains stable.','close',4200);
  });
  if(Sess.get('nova.booted'))Boot.skip();
  else Boot.run(false);
}
init();
</script>
