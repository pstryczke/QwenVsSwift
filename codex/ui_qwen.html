<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA OS</title>
<style>
/* ================= NOVA OS — core styles ================= */
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;user-select:none;overflow:hidden;
}
:root{
  --bg:#04060b;
  --panel:rgba(13,17,26,.78);
  --panel-strong:rgba(9,12,19,.94);
  --panel-soft:rgba(19,24,34,.55);
  --text:#e9edf5;--muted:#98a2b6;--faint:#5b6478;
  --border:rgba(150,166,196,.14);--border-strong:rgba(150,166,196,.3);
  --accent:#6fa8ff;--accent-soft:rgba(111,168,255,.14);--accent-line:rgba(111,168,255,.42);
  --danger:#e0705f;--ok:#5fd3a0;
  --shadow:0 24px 64px rgba(0,0,0,.55),0 6px 18px rgba(0,0,0,.4);
  --shadow-soft:0 10px 30px rgba(0,0,0,.4);
  --radius:10px;--radius-s:7px;
  --tb-h:56px;--blur:20px;--icon-w:48px;
  --anim:.24s;--anim2:.4s;
  --fs-s:.68rem;--fs-m:.8rem;--fs-l:.95rem;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
}
body.hc{--text:#ffffff;--muted:#c3cad8;--faint:#8a93a6;--border:rgba(170,185,215,.28);--border-strong:rgba(170,185,215,.5)}
body.rm *,body.rm *::before,body.rm *::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
.hidden{display:none !important}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit;color:inherit}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(148,163,190,.22);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,190,.42);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:1px;border-radius:4px}
body.fading #desktop,body.fading #taskbar{opacity:0;transition:opacity .42s ease}
body.dragging-win{cursor:grabbing}
body.focus-mode #windows .win:not(.active){opacity:.5;filter:saturate(.85);transition:opacity .3s ease,filter .3s ease}

/* ---- shared controls ---- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--radius-s);font-size:var(--fs-m);font-weight:500;color:var(--text);background:var(--panel-soft);border:1px solid var(--border);transition:background var(--anim),border-color var(--anim),transform .12s}
.btn:hover{background:var(--accent-soft);border-color:var(--accent-line)}
.btn:active{transform:scale(.97)}
.btn.prim{background:var(--accent);border-color:transparent;color:#0a0f18;font-weight:600}
.btn.prim:hover{filter:brightness(1.08);background:var(--accent)}
.btn.dng{color:var(--danger)}
.btn.dng.prim{background:var(--danger);color:#fff}
.btn.sm{padding:5px 9px;font-size:var(--fs-s)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-soft);border-color:var(--border)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;color:var(--muted);transition:background var(--anim),color var(--anim),transform .1s;flex:0 0 auto}
.ibtn:hover:not(:disabled){background:var(--panel-soft);color:var(--text)}
.ibtn:active{transform:scale(.92)}
.ibtn:disabled{opacity:.3;cursor:default}
.inp{width:100%;background:var(--panel-soft);border:1px solid var(--border);border-radius:var(--radius-s);padding:8px 11px;font-size:var(--fs-m);color:var(--text);transition:border-color var(--anim)}
.inp::placeholder{color:var(--faint)}
.inp:focus{outline:none;border-color:var(--accent-line)}
.seg{display:inline-flex;background:var(--panel-soft);border:1px solid var(--border);border-radius:var(--radius-s);padding:2px;gap:2px}
.seg button{padding:5px 12px;border-radius:5px;font-size:var(--fs-s);font-weight:500;color:var(--muted);transition:all var(--anim)}
.seg button.on{background:var(--accent);color:#0a0f18;font-weight:600}
.range{--p:50%;-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p),rgba(148,163,190,.18) var(--p));outline:none}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);border:2px solid var(--accent);box-shadow:0 1px 6px rgba(0,0,0,.4);cursor:pointer;transition:transform .12s}
.range::-webkit-slider-thumb:hover{transform:scale(1.15)}
.range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);border:2px solid var(--accent);cursor:pointer}
.sw{position:relative;width:36px;height:20px;border-radius:10px;background:rgba(148,163,190,.25);transition:background var(--anim);flex:0 0 auto}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:all var(--anim)}
.sw.on{background:var(--accent)}
.sw.on::after{left:18px;background:#fff}
.kbd{display:inline-block;padding:1.5px 6px;border-radius:4px;font-family:var(--mono);font-size:.62rem;border:1px solid var(--border-strong);background:var(--panel-soft);color:var(--muted)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border)}
.mrow:last-child{border-bottom:none}
.mrow .mr-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.mrow .mr-l{font-size:var(--fs-m);font-weight:500}
.mrow .mr-s{font-size:var(--fs-s);color:var(--faint)}

/* ---- markdown ---- */
.md .md-h1{font-size:1.25rem;font-weight:700;margin:14px 0 8px;line-height:1.3}
.md .md-h2{font-size:1.06rem;font-weight:700;margin:12px 0 7px}
.md .md-h3,.md .md-h4{font-size:.92rem;font-weight:600;margin:10px 0 6px}
.md p{margin:6px 0;line-height:1.6}
.md .md-ul{margin:6px 0 6px 4px;padding-left:18px}
.md .md-ul li{margin:3px 0;line-height:1.5}
.md .md-chk{list-style:none;margin-left:-18px;display:flex;gap:8px;align-items:flex-start}
.md .md-box{display:flex;align-items:center;justify-content:center;width:15px;height:15px;margin-top:3px;border-radius:4px;border:1px solid var(--border-strong);color:#fff;flex:0 0 auto}
.md .md-box.on{background:var(--accent);border-color:var(--accent)}
.md .md-q{margin:8px 0;padding:8px 12px;border-left:2px solid var(--accent);background:var(--panel-soft);border-radius:0 7px 7px 0;color:var(--muted);line-height:1.55}
.md .md-hr{border:none;height:1px;background:var(--border);margin:12px 0}
.md code{font-family:var(--mono);font-size:.92em;background:var(--panel-soft);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.md .md-pre{margin:8px 0;padding:10px 12px;background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:7px;overflow:auto}
.md .md-pre code{background:none;border:none;padding:0;font-size:.72rem;line-height:1.5;display:block;white-space:pre}
.md .md-lnk{color:var(--accent);text-decoration:underline;text-underline-offset:2px}

/* ---- boot ---- */
#boot{position:fixed;inset:0;z-index:4000;background:#030408;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;transition:opacity .5s ease}
#boot.done{opacity:0;pointer-events:none}
#boot-logo{color:var(--accent);filter:drop-shadow(0 0 20px var(--accent-soft))}
#boot-name{margin-top:20px;font-size:21px;font-weight:700;letter-spacing:.46em;color:var(--text);padding-left:.46em}
#boot-ver{margin-top:7px;font-size:var(--fs-s);letter-spacing:.3em;color:var(--faint);text-transform:uppercase}
#boot-lines{margin-top:36px;width:min(360px,86vw);font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:7px;min-height:96px}
.boot-line{opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.boot-line.on{opacity:1;transform:none}
.boot-line .bok{color:var(--ok);margin-right:9px}
#boot-track{margin-top:24px;width:min(360px,86vw);height:3px;border-radius:2px;background:rgba(148,163,190,.12);overflow:hidden}
#boot-fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,var(--accent),#9fd0ff);transition:width .34s ease}
</style>
<style>
/* ---- wallpaper ---- */
#desktop{position:fixed;inset:0}
#wallpaper{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wp-layer{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.wp-layer.on{opacity:1}
.wp{position:absolute;inset:0}
.wp-stars{position:absolute;top:0;left:0;width:2px;height:2px;border-radius:50%}
.wp-vin{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 32%,transparent 55%,rgba(0,0,0,.5) 100%)}
.wp-aur{background:linear-gradient(180deg,#050810 0%,#071019 45%,#0a1622 100%)}
.wp-aur::before{content:'';position:absolute;inset:0;background:
  radial-gradient(55% 42% at 28% 16%,rgba(62,224,187,.17),transparent 70%),
  radial-gradient(48% 38% at 72% 26%,rgba(101,132,255,.16),transparent 72%),
  radial-gradient(75% 52% at 50% 96%,rgba(94,72,214,.14),transparent 78%)}
.wp-aur::after{content:'';position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 42%,rgba(94,240,205,.06) 50%,transparent 58%),
  linear-gradient(100deg,transparent 30%,rgba(120,150,255,.05) 40%,transparent 55%)}
.wp-lunar{background:linear-gradient(180deg,#060810 0%,#0a0e1d 55%,#101a30 100%)}
.wp-lunar .wp-planet{position:absolute;left:50%;bottom:-42vmin;transform:translateX(-50%);width:78vmin;height:78vmin;border-radius:50%;
  background:radial-gradient(circle at 36% 28%,#41547c 0%,#1b2440 46%,#0a0e1c 72%,#05070f 100%);
  box-shadow:0 -12px 90px rgba(96,132,255,.22),inset 0 40px 120px rgba(255,255,255,.05),inset 0 -60px 140px rgba(0,0,0,.75)}
.wp-lunar .wp-horizon{position:absolute;left:0;right:0;bottom:26vmin;height:2px;background:linear-gradient(90deg,transparent,rgba(120,160,255,.5),transparent);box-shadow:0 0 24px 2px rgba(120,160,255,.25)}
.wp-lunar.dn .wp-planet{background:radial-gradient(circle at 36% 28%,#33415f 0%,#151d33 46%,#080b16 74%,#04050c 100%)}
.wp-lunar.dn .wp-horizon{background:linear-gradient(90deg,transparent,rgba(90,110,220,.4),transparent);box-shadow:0 0 24px 2px rgba(90,110,220,.2)}
.wp-mesh{background:radial-gradient(90% 70% at 50% 40%,#0a0f1e 0%,#05070f 100%)}
.wp-mesh::before{content:'';position:absolute;inset:0;
  background:linear-gradient(rgba(110,150,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(110,150,255,.055) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(75% 75% at 50% 45%,#000 30%,transparent 100%);
  mask-image:radial-gradient(75% 75% at 50% 45%,#000 30%,transparent 100%)}
.wp-mesh::after{content:'';position:absolute;inset:0;background:radial-gradient(40% 30% at 50% 42%,rgba(111,168,255,.1),transparent 70%)}
.wp-neb{background:linear-gradient(160deg,#070512 0%,#0b0a1e 50%,#060410 100%)}
.wp-neb::before{content:'';position:absolute;inset:0;background:
  radial-gradient(34% 42% at 30% 32%,rgba(150,90,255,.2),transparent 70%),
  radial-gradient(28% 36% at 55% 55%,rgba(255,90,180,.13),transparent 70%),
  radial-gradient(40% 46% at 74% 28%,rgba(64,190,255,.14),transparent 72%),
  radial-gradient(30% 40% at 45% 80%,rgba(90,140,255,.12),transparent 72%)}
.wp-neb::after{content:'';position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 50%,rgba(180,140,255,.05),transparent 75%)}
.wp-custom{background-size:cover;background-position:center}

/* ---- desktop icons ---- */
#desktop-icons{position:absolute;inset:0 0 var(--tb-h) 0;z-index:2;pointer-events:none}
.d-icon{position:absolute;width:88px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:7px 4px 5px;border-radius:var(--radius-s);pointer-events:auto;cursor:default;transition:background var(--anim)}
.d-icon .d-ic{display:flex;align-items:center;justify-content:center;width:var(--icon-w);height:var(--icon-w);border-radius:12px;color:var(--text);
  background:var(--panel);border:1px solid var(--border);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform var(--anim),border-color var(--anim)}
.d-icon:hover .d-ic{transform:translateY(-2px);border-color:var(--border-strong)}
.d-icon.sel{background:var(--accent-soft);outline:1px solid var(--accent-line);outline-offset:-1px}
.d-icon .d-lb{font-size:var(--fs-s);letter-spacing:.02em;text-shadow:0 1px 4px rgba(0,0,0,.85);max-width:86px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-icon.dragging{cursor:grabbing;opacity:.92}
.d-icon.dragging .d-ic{transform:scale(1.05)}

/* ---- windows ---- */
#windows{position:absolute;inset:0 0 var(--tb-h) 0;z-index:10;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:280px;min-height:190px;
  background:var(--panel);
  backdrop-filter:blur(var(--blur)) saturate(1.15);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.15);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-soft);overflow:hidden;
  opacity:0;transform:scale(.965) translateY(10px);
  transition:opacity var(--anim) ease,transform var(--anim) ease,box-shadow .22s ease,border-color .22s ease;
  will-change:transform}
.win.open{opacity:1;transform:none}
.win.active{border-color:var(--accent-line);box-shadow:var(--shadow)}
.win.max{border-radius:0}
.win.closing{opacity:0;transform:scale(.94) translateY(8px);pointer-events:none}
.win.mini{opacity:0;transform:scale(.9) translateY(14px);pointer-events:none}
.win.snap-anim{transition:opacity var(--anim) ease,transform .24s ease,box-shadow .22s ease,border-color .22s ease,left .24s ease,top .24s ease,width .24s ease,height .24s ease}
.win-titlebar{height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between;padding:0 5px 0 11px;user-select:none;background:linear-gradient(180deg,rgba(255,255,255,.028),transparent);cursor:default}
.win-tb-left{display:flex;align-items:center;gap:8px;min-width:0}
.win-ic{display:flex;width:17px;height:17px;color:var(--accent);flex:0 0 auto}
.win-title{font-size:var(--fs-m);font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win:not(.active) .win-title{color:var(--muted)}
.win-tb-right{display:flex;gap:2px}
.wbtn{width:30px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted);transition:background var(--anim),color var(--anim)}
.wbtn:hover{background:rgba(148,163,190,.14);color:var(--text)}
.wbtn.w-close:hover{background:rgba(224,96,95,.88);color:#fff}
.win-body{flex:1;min-height:0;overflow:hidden;position:relative}
.rh{position:absolute;z-index:6}
.rh.r-n{top:-4px;left:10px;right:10px;height:8px;cursor:n-resize}
.rh.r-s{bottom:-4px;left:10px;right:10px;height:8px;cursor:s-resize}
.rh.r-e{right:-4px;top:10px;bottom:10px;width:8px;cursor:e-resize}
.rh.r-w{left:-4px;top:10px;bottom:10px;width:8px;cursor:w-resize}
.rh.r-ne{top:-5px;right:-5px;width:13px;height:13px;cursor:ne-resize}
.rh.r-nw{top:-5px;left:-5px;width:13px;height:13px;cursor:nw-resize}
.rh.r-se{bottom:-5px;right:-5px;width:13px;height:13px;cursor:se-resize}
.rh.r-sw{bottom:-5px;left:-5px;width:13px;height:13px;cursor:sw-resize}
.win.max .rh{display:none}

/* ---- snap preview + brightness ---- */
#snap-preview{position:absolute;z-index:990;pointer-events:none;border-radius:var(--radius);background:var(--accent-soft);border:1px solid var(--accent-line);opacity:0;transition:opacity .15s ease}
#snap-preview.on{opacity:1}
#brightness-ov{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2400;transition:opacity .35s ease}
</style>
<style>
/* ---- taskbar ---- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tb-h);z-index:900;display:flex;align-items:center;gap:6px;padding:0 10px;
  background:var(--panel-strong);
  backdrop-filter:blur(var(--blur)) saturate(1.2);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.2);
  border-top:1px solid var(--border)}
#tb-start{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--accent);transition:background var(--anim),transform .12s}
#tb-start:hover{background:var(--panel-soft)}
#tb-start:active{transform:scale(.93)}
#tb-start.on{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.tb-sep{width:1px;height:26px;background:var(--border);margin:0 4px;flex:0 0 auto}
.tb-apps{display:flex;align-items:center;gap:3px;height:100%;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tb-apps::-webkit-scrollbar{display:none}
.tb-app{position:relative;width:40px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto;transition:background var(--anim),color var(--anim),transform .12s}
.tb-app:hover{background:var(--panel-soft);color:var(--text);transform:translateY(-2px)}
.tb-app:active{transform:translateY(0) scale(.95)}
.tb-app.running{color:var(--text)}
.tb-app.active{background:var(--accent-soft);color:var(--accent)}
.tb-dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--faint);transition:width var(--anim),background var(--anim)}
.tb-app.running .tb-dot{width:14px;border-radius:2px;background:var(--accent)}
.tb-grow{flex:1}
.tb-tray{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.tray-ic{position:relative;height:38px;min-width:32px;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:8px;color:var(--muted);padding:0 6px;transition:background var(--anim),color var(--anim)}
.tray-ic:hover{background:var(--panel-soft);color:var(--text)}
.tray-ic.off{color:var(--faint)}
.tray-batt{display:flex;align-items:center;gap:5px;padding:0 9px;color:var(--muted);font-size:var(--fs-s);cursor:pointer}
.tray-batt:hover{background:var(--panel-soft);border-radius:8px}
.b-body{position:relative;width:22px;height:11px;border:1px solid currentColor;border-radius:3px;padding:1.5px;opacity:.9}
.b-lvl{position:absolute;left:0;top:0;bottom:0;background:currentColor;border-radius:1px;transition:width .8s ease}
.b-tip{width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0;opacity:.7}
.tray-batt.low .b-lvl{background:var(--danger)}
.tray-batt.low .b-body{color:var(--danger)}
.nc-badge{position:absolute;top:4px;right:3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--danger);color:#fff;font-size:.58rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.tray-clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;height:38px;padding:0 10px;border-radius:8px;cursor:pointer;transition:background var(--anim)}
.tray-clock:hover{background:var(--panel-soft)}
.tray-clock .tc-time{font-size:var(--fs-m);font-weight:600;letter-spacing:.04em;line-height:1.15;display:flex}
.tray-clock .tc-date{font-size:.58rem;color:var(--faint);letter-spacing:.06em}
#ct-colon{animation:blink 2s infinite}
@keyframes blink{0%,45%{opacity:1}55%,100%{opacity:.3}}
.tb-desk{width:14px;height:34px;border-radius:4px;margin-left:4px;flex:0 0 auto;transition:background var(--anim)}
.tb-desk:hover{background:var(--accent-soft)}
.tb-desk::after{content:'';display:block;width:2px;height:15px;margin:10px auto 0;background:var(--faint);border-radius:1px}

/* ---- popups (shared) ---- */
.pop{position:fixed;z-index:1000;background:var(--panel-strong);
  backdrop-filter:blur(var(--blur)) saturate(1.25);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.25);
  border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow);
  opacity:0;transform:translateY(10px) scale(.985);transition:opacity var(--anim) ease,transform var(--anim) ease}
.pop.in{opacity:1;transform:none}

/* ---- start menu ---- */
#startmenu{left:12px;bottom:calc(var(--tb-h) + 12px);width:min(560px,94vw);max-height:min(640px,calc(100vh - var(--tb-h) - 24px));display:flex;flex-direction:column;padding:12px;transform-origin:bottom left}
.sm-sw{position:relative;flex:0 0 auto}

.ac-expr{font-size:.85rem;color:var(--faint);font-family:var(--mono);min-height:1.2em;max-width:100%;overflow-x:auto;white-space:nowrap}
.ac-res{font-size:2rem;font-weight:300;font-family:var(--mono);letter-spacing:.02em;max-width:100%;overflow-x:auto;white-space:nowrap}
.ac-last{font-size:.66rem;color:var(--faint);font-family:var(--mono);min-height:1em;max-width:100%;overflow-x:auto;white-space:nowrap}
.ac-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:7px;min-height:0}
.ac-key{border-radius:9px;background:var(--panel-soft);border:1px solid var(--border);font-size:.95rem;font-weight:500;color:var(--text);display:flex;align-items:center;justify-content:center;transition:background .1s,transform .08s,filter .1s;user-select:none}
.ac-key:hover{background:rgba(148,163,190,.15)}
.ac-key:active{transform:scale(.94);filter:brightness(1.15)}
.ac-key.op{color:var(--accent)}
.ac-key.warn{color:var(--danger)}
.ac-key.eq{background:var(--accent);color:#0a0f18;font-weight:700;grid-column:span 4;border-color:transparent}
.ac-key.eq:hover{filter:brightness(1.08);background:var(--accent)}

/* ---- system monitor ---- */
.am{display:flex;flex-direction:column;height:100%;gap:10px;padding:12px;font-size:var(--fs-m)}
.am-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:0 0 auto}
.am-card{border:1px solid var(--border);background:var(--panel-soft);border-radius:9px;padding:10px 12px;min-width:0}
.am-c-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;gap:8px}
.am-c-h .l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:var(--fs-s);letter-spacing:.05em}
.am-c-h .l svg{color:var(--faint)}
.am-c-h .v{font-size:.8rem;font-weight:700;font-family:var(--mono)}
.am-cv{display:block;width:100%;height:52px}
.am-net .am-n{display:flex;justify-content:space-between;font-size:.66rem;color:var(--faint);margin-bottom:3px}
.am-bar{height:7px;border-radius:4px;background:rgba(148,163,190,.14);overflow:hidden;margin-top:6px}
.am-bar .f{height:100%;border-radius:4px;background:var(--accent);transition:width .6s ease}
.am-procs{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--border);background:var(--panel-soft);border-radius:9px;overflow:hidden}
.am-p-h{display:grid;grid-template-columns:1fr 70px 70px 86px;padding:8px 12px;font-size:.62rem;letter-spacing:.08em;color:var(--faint);border-bottom:1px solid var(--border)}
.am-p-h span:not(:first-child),.am-p .c,.am-p .m{text-align:right}
.am-p-list{flex:1;overflow:auto;min-height:0}
.am-p{display:grid;grid-template-columns:1fr 70px 70px 86px;align-items:center;padding:6px 12px;font-size:.7rem;border-bottom:1px solid var(--border);transition:opacity .5s}
.am-p:nth-child(odd){background:rgba(148,163,190,.03)}
.am-p .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am-p .c,.am-p .m{font-family:var(--mono);color:var(--muted)}
.am-p .kill{justify-self:end}
.am-p .kill:hover{color:var(--danger)}
.am-p.gone{opacity:0}
.am-foot{display:flex;justify-content:space-between;font-size:.64rem;color:var(--faint);padding:0 2px;flex:0 0 auto}
</style>
<style>
/* ---- settings ---- */
.as{display:flex;height:100%;font-size:var(--fs-m)}
.as-side{width:170px;flex:0 0 170px;border-right:1px solid var(--border);padding:9px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.as-nav{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;font-size:var(--fs-m);color:var(--muted);text-align:left;transition:background .12s,color .12s;flex:0 0 auto}
.as-nav:hover{background:var(--panel-soft);color:var(--text)}
.as-nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.as-nav svg{opacity:.85}
.as-panel{flex:1;overflow:auto;min-width:0;padding:16px 18px;min-height:0}
.as-p-title{font-size:1rem;font-weight:700;margin-bottom:4px}
.as-p-sub{font-size:var(--fs-s);color:var(--faint);margin-bottom:16px;line-height:1.5}
.as-block{margin-bottom:20px}
.as-block .as-b-t{font-size:.64rem;font-weight:700;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin-bottom:9px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s,box-shadow .12s}
.swatch:hover{transform:scale(1.1)}
.swatch.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.wp-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wp-thumb{position:relative;height:58px;border-radius:8px;border:2px solid transparent;cursor:pointer;overflow:hidden;background:#0a0d16;transition:border-color .14s,transform .14s;padding:0}
.wp-thumb:hover{transform:translateY(-2px)}
.wp-thumb.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.wp-t{position:absolute;inset:0}
.wp-t-aurora{background:linear-gradient(180deg,#050810,#0a1622)}
.wp-t-aurora::before{content:'';position:absolute;inset:0;background:radial-gradient(60% 55% at 30% 25%,rgba(62,224,187,.3),transparent 70%),radial-gradient(55% 50% at 72% 45%,rgba(101,132,255,.28),transparent 72%)}
.wp-t-lunar{background:linear-gradient(180deg,#060810,#101a30)}
.wp-t-lunar::before{content:'';position:absolute;left:50%;bottom:-55%;transform:translateX(-50%);width:120%;height:120%;border-radius:50%;background:radial-gradient(circle at 40% 30%,#3b4d75,#0a0e1c 75%)}
.wp-t-mesh{background:#05070f}
.wp-t-mesh::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(110,150,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(110,150,255,.12) 1px,transparent 1px);background-size:13px 13px}
.wp-t-nebula{background:#070512}
.wp-t-nebula::before{content:'';position:absolute;inset:0;background:radial-gradient(45% 60% at 30% 35%,rgba(150,90,255,.42),transparent 70%),radial-gradient(40% 50% at 72% 55%,rgba(64,190,255,.3),transparent 72%),radial-gradient(35% 45% at 55% 20%,rgba(255,90,180,.25),transparent 70%)}
.wp-t-custom{background-size:cover;background-position:center}
.wp-tl{position:absolute;left:6px;bottom:5px;font-size:.58rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.85);letter-spacing:.03em;z-index:2}
.as-sysrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:var(--fs-m)}
.as-sysrow:last-child{border:none}
.as-sysrow .k{color:var(--faint)}
.as-sysrow .v{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.as-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ---- about ---- */
.aa{height:100%;overflow:auto;padding:26px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;font-size:var(--fs-m)}
.aa-logo{color:var(--accent);filter:drop-shadow(0 0 24px var(--accent-soft))}
.aa-name{font-size:1.5rem;font-weight:700;letter-spacing:.3em;margin-top:14px;padding-left:.3em}
.aa-ver{font-size:var(--fs-s);color:var(--faint);letter-spacing:.14em;margin-top:6px}
.aa-tbl{width:100%;max-width:350px;margin:22px 0 14px;text-align:left}
.aa-tbl .dp-row{padding:8px 0;font-size:var(--fs-m)}
.aa-note{font-size:.68rem;color:var(--faint);line-height:1.6;max-width:370px;margin-bottom:18px}
.aa-btns{display:flex;gap:8px}

/* ---- knowledge ---- */
.akb{display:flex;flex-direction:column;height:100%;font-size:var(--fs-m)}
.kb-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);flex:0 0 auto}
.kb-addr{flex:1;min-width:0}
.kb-addr .inp{font-family:var(--mono);font-size:.74rem}
.kb-body{flex:1;overflow:auto;min-height:0;padding:18px 22px}
.kb-body .md p{color:var(--muted)}
.kb-hero .kh-t{font-size:1.3rem;font-weight:700}
.kb-hero .kh-s{color:var(--muted);font-size:var(--fs-m);margin-top:7px;line-height:1.6;max-width:560px}
.kb-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}
.kb-card{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--border);background:var(--panel-soft);border-radius:9px;text-align:left;transition:all .14s}
.kb-card:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.kb-card .kc-ic{display:flex;color:var(--accent);margin-top:2px;flex:0 0 auto}
.kb-card .kc-t{font-weight:600;font-size:var(--fs-m)}
.kb-card .kc-s{font-size:.66rem;color:var(--faint);margin-top:3px;line-height:1.45}
.kb-table{width:100%;border-collapse:collapse;margin-top:10px}
.kb-table th{font-size:.62rem;letter-spacing:.1em;color:var(--faint);text-align:left;padding:6px 10px;border-bottom:1px solid var(--border-strong)}
.kb-table td{padding:7px 10px;border-bottom:1px solid var(--border);font-size:var(--fs-m);color:var(--muted)}
.kb-table td:first-child{white-space:nowrap}

/* ---- gallery ---- */
.ag{display:flex;height:100%;font-size:var(--fs-m)}
.ag-grid{width:150px;flex:0 0 150px;border-right:1px solid var(--border);overflow:auto;padding:9px;min-height:0;display:flex;flex-direction:column;gap:7px}
.ag-thumb{position:relative;border-radius:7px;overflow:hidden;border:2px solid transparent;cursor:pointer;padding:0;transition:border-color .14s,transform .14s;aspect-ratio:16/10;background:#0a0d16;flex:0 0 auto;width:100%}
.ag-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ag-thumb:hover{transform:scale(1.02)}
.ag-thumb.on{border-color:var(--accent)}
.ag-tt{position:absolute;left:0;right:0;bottom:0;padding:3px 7px;font-size:.58rem;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));text-align:left;letter-spacing:.03em}
.ag-view{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px}
.ag-stage{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:9px;overflow:hidden;background:rgba(0,0,0,.25);border:1px solid var(--border)}
.ag-stage img{max-width:100%;max-height:100%;object-fit:contain}
.ag-nav{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.ag-cap{font-size:var(--fs-s);color:var(--muted);letter-spacing:.06em;display:flex;align-items:baseline}
.ag-cn{color:var(--faint);font-size:.62rem;margin-left:8px}

/* ---- trash ---- */
.atr{display:flex;flex-direction:column;height:100%;font-size:var(--fs-m)}
.atr-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);flex:0 0 auto}
.atr-bar .at-t{font-weight:700;display:flex;align-items:center;gap:8px}
.atr-bar .at-t svg{color:var(--faint)}
.atr-bar .at-n{font-size:.64rem;color:var(--faint)}
.atr-bar .grow{flex:1}
.atr-list{flex:1;overflow:auto;min-height:0;padding:7px}
.atr-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;border-bottom:1px solid var(--border)}
.atr-row:hover{background:var(--panel-soft)}
.atr-ic{display:flex;color:var(--faint);flex:0 0 auto}
.atr-tx{flex:1;min-width:0}
.atr-nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atr-fr{font-size:.64rem;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atr-btns{display:flex;gap:4px}
.atr-empty{padding:40px;text-align:center;color:var(--faint);font-size:var(--fs-s);line-height:1.6}

/* ---- responsive ---- */
@media (max-width:1100px){
  .sm-grid{grid-template-columns:repeat(3,1fr)}
  .am-grid{grid-template-columns:repeat(2,1fr)}
  .wp-thumbs{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .tray-clock .tc-date{display:none}
  .an-side{width:160px;flex-basis:160px}
  .tb-app{width:34px}
  .am-grid{grid-template-columns:1fr}
  .kb-cards{grid-template-columns:1fr}
  .ag-grid{width:112px;flex-basis:112px}
  .as-side{width:132px;flex-basis:132px}
  .d-icon .d-ic{width:42px;height:42px}
  .qs-chips{grid-template-columns:1fr}
}
@media (max-width:600px){
  .tray-batt .b-txt{display:none}
  #startmenu{left:8px;right:8px;width:auto}
  .sm-grid{grid-template-columns:repeat(3,1fr)}
  .qs-chips{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const byId=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let _uidSeq=0;
const uid=()=>'n'+(++_uidSeq).toString(36)+Date.now().toString(36);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):'';
function hexToRgba(hex,a){
  hex=(hex||'').replace('#','');
  if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const n=parseInt(hex,16);
  if(isNaN(n))return 'rgba(148,163,190,'+(a==null?1:a)+')';
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+(a==null?1:a)+')';
}
function debounce(fn,ms){let t=0;return function(){const a=arguments;clearTimeout(t);t=setTimeout(()=>fn.apply(null,a),ms)}}
const fmtSize=b=>{b=+b||0;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB'};
const _MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=t=>{const d=new Date(t||Date.now());return _MO[d.getMonth()]+' '+d.getDate()+' · '+pad(d.getHours())+':'+pad(d.getMinutes())};
const timeAgo=t=>{const s=Math.max(1,Math.round((Date.now()-(t||Date.now()))/1000));if(s<60)return s+'s ago';const m=Math.round(s/60);if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago'};
const fmtUptime=ms=>{ms=Math.max(0,ms|0);const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
function fuzzy(q,s){
  q=String(q).toLowerCase();s=String(s).toLowerCase();
  if(!q)return 1;
  if(s.includes(q))return 100-s.indexOf(q);
  let qi=0,score=0,streak=0,prev=-2;
  for(let i=0;i<s.length&&qi<q.length;i++){
    if(s[i]===q[qi]){streak=(i===prev+1)?streak+1:1;score+=2+streak*2+((i===0||' -_./\\'.includes(s[i-1]))?4:0);qi++;prev=i}
    else streak=0;
  }
  return qi===q.length?score:-1;
}

    }catch(e){return k in this._mem?this._mem[k]:(d!==undefined?d:null)}
  },

const Bus={

const Wallpaper={
  el:null, lockBg:null,
  init(){this.el=byId('wallpaper');this.lockBg=byId('lock-bg');this.render()},
  _stars(n){
    const out=[];let seed=1103515245;
    const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
    for(let i=0;i<n;i++){
      const x=(rnd()*2600).toFixed(0), y=(rnd()*1500).toFixed(0);
      const o=(0.25+rnd()*0.6).toFixed(2);
      const sz=rnd()<0.85?1:2;
      out.push(x+'px '+y+'px 0 '+sz+'px rgba(255,255,255,'+o+')');
    }
    return out.join(',');
  },
  _style(id){
    const h=new Date().getHours();
    const dn=Settings.data.dayNight&&(h>=20||h<5);
    switch(id){
      case 'lunar':
        return '<div class="wp wp-lunar'+(dn?' dn':'')+'"><div class="wp-stars" style="box-shadow:'+this._stars(110)+'"></div><div class="wp-planet"></div><div class="wp-horizon"></div><div class="wp-vin"></div></div>';
      case 'mesh':
        return '<div class="wp wp-mesh"><div class="wp-stars" style="box-shadow:'+this._stars(50)+'"></div><div class="wp-vin"></div></div>';
      case 'nebula':
        return '<div class="wp wp-neb"><div class="wp-stars" style="box-shadow:'+this._stars(170)+'"></div><div class="wp-vin"></div></div>';
      case 'aurora':
      default:
        return '<div class="wp wp-aur"><div class="wp-stars" style="box-shadow:'+this._stars(130)+'"></div><div class="wp-vin"></div></div>';
    }
  },
  _html(){
    const d=Settings.data;
    if(d.wallpaper==='custom'&&d.customWp)
      return '<div class="wp wp-custom" style="background-image:url('+d.customWp+')"></div><div class="wp-vin"></div>';
    return this._style(d.wallpaper||'aurora');
  },
  render(){
    if(!this.el){this.el=byId('wallpaper');this.lockBg=byId('lock-bg')}
    const html=this._html();
    [this.el,this.lockBg].forEach(target=>{
      if(!target)return;
      const old=[...target.children];
      const layer=el('div','wp-layer');
      layer.innerHTML=html;
      target.appendChild(layer);
      requestAnimationFrame(()=>layer.classList.add('on'));
      if(target._wpTok)clearTimeout(target._wpTok);
      target._wpTok=setTimeout(()=>{old.forEach(o=>{if(o!==layer)o.remove()})},1050);
    });
  }
};

    if(!n||n.kind!=='dir')return [];
    const ch=[...(n.children||[])];
    return ch.sort((a,b)=>a.kind===b.kind?a.name.localeCompare(b.name):(a.kind==='dir'?-1:1));
  },
  displayPath(segs){return '/'+segs.join('/')},
  resolve(cwd,p){
    if(!p||p==='')return cwd;
    let parts;
    if(p==='/')parts=[];
    else if(p==='~')parts=['home'];
    else if(p.indexOf('~/')===0)parts=['home'].concat(p.slice(2).split('/'));
    else if(p.charAt(0)==='/')parts=p.split('/');
    else parts=cwd.concat(p.split('/'));
    const out=[];
    for(const s of parts){
      if(!s||s==='.')continue;
      if(s==='..'){if(out.length)out.pop()}
      else out.push(s);
    }
    return out;
  },
  writeContent(segs,content){
    const n=this.node(segs);
    if(!n||n.kind!=='file')return 'No such file';
    n.content=content;n.size=content.length;n.mtime=Date.now();
    this.save();Bus.emit('fs:change');
    return null;
  },
  mkdir(segs,name){
    name=(name||'').trim();
    if(!name||name==='.'||name==='..')return 'Invalid name';
    const p=this.node(segs);
    if(!p||p.kind!=='dir')return 'No such directory';
    if((p.children||[]).some(c=>c.name===name))return 'An item with that name already exists';
    p.children=p.children||[];
    p.children.push(dir(name,[],Date.now()));
    this.save();Bus.emit('fs:change');
    return null;
  },
  writeFile(segs,name,content){
    name=(name||'').trim();
    if(!name||name==='.'||name==='..')return 'Invalid name';
    const p=this.node(segs);
    if(!p||p.kind!=='dir')return 'No such directory';
    p.children=p.children||[];
    const ex=p.children.find(c=>c.name===name);
    if(ex)return this.writeContent(segs.concat(name),content);
    p.children.push(file(name,content,Date.now()));
    this.save();Bus.emit('fs:change');
    return null;
  },
  rename(segs,name,newName){
    newName=(newName||'').trim();
    if(!newName||newName==='.'||newName==='..')return 'Invalid name';
    const p=this.node(segs);
    if(!p||p.kind!=='dir')return 'No such directory';
    const n=(p.children||[]).find(c=>c.name===name);
    if(!n)return 'No such item';
    if((p.children||[]).some(c=>c.name===newName&&c!==n))return 'An item with that name already exists';
    n.name=newName;n.mtime=Date.now();
    this.save();Bus.emit('fs:change');
    return null;
  },
  trash(segs,name){
    const p=this.node(segs);
    if(!p||p.kind!=='dir')return 'No such directory';
    const i=(p.children||[]).findIndex(c=>c.name===name);
    if(i<0)return 'No such item';
    const n=p.children[i];
    p.children.splice(i,1);
    n.from=segs.slice();
    n.trashedAt=Date.now();
    const t=this.trashDir();
    if(t){t.children=t.children||[];t.children.push(n);this.save();Bus.emit('fs:change')}
    return null;
  },
  trashDir(){return this.node(['trash'])},
  restore(trashItem){
    const t=this.trashDir();
    if(!t||!t.children)return 'No such item';
    const i=t.children.indexOf(trashItem);
    if(i<0)return 'No such item';
    t.children.splice(i,1);
    const from=trashItem.from||['home'];
    let dest=this.node(from);
    if(!dest||dest.kind!=='dir')dest=this.node(['home']);
    if(!dest){this.save();return 'No place to restore to'}
    if((dest.children||[]).some(c=>c.name===trashItem.name))dest.children.push(this._deconflict(dest,trashItem));
    else dest.children.push(trashItem);
    delete trashItem.trashedAt;
    this.save();Bus.emit('fs:change');
    return null;
  },
  _deconflict(dest,n){
    let base=n.name.replace(/(\.[a-z0-9]+)$/i,''),ext=n.name.match(/(\.[a-z0-9]+)$/i);
    ext=ext?ext[0]:'';let i=2,cand;
    do{cand=base+' ('+i+')'+ext;i++}
    while((dest.children||[]).some(c=>c.name===cand));
    n.name=cand;
    return n;
  },
  deleteForever(trashItem){
    const t=this.trashDir();
    if(!t||!t.children)return;
    const i=t.children.indexOf(trashItem);
    if(i>=0){t.children.splice(i,1);this.save();Bus.emit('fs:change')}
  },
  emptyTrash(){
    const t=this.trashDir();
    if(!t)return;
    t.children=[];
    this.save();Bus.emit('fs:change');
  },
  walk(cb){
    const rec=(n,segs)=>{
      if(!n)return;
      if(n.kind==='file')cb(n,segs);
      if(n.kind==='dir'){(n.children||[]).forEach(c=>rec(c,segs.concat(n.name)))}
    };
    (this.root.children||[]).forEach(c=>rec(c,[c.name]));
  }
};

/* ================= app registry ================= */
const AppRegistry={
  apps:{},
  register(d){this.apps[d.id]=d},
  get(id){return this.apps[id]},
  list(){return Object.values(this.apps)}
};
function openApp(id,opts){
  opts=opts||{};
  const a=AppRegistry.get(id);
  if(!a){Notify.toast('Unknown application',id,'close');return null}
  if(!a.multi&&!opts.force){
    const ex=WM.windows.find(w=>w.app.id===id&&!w._closing);
    if(ex){
      if(ex.minimized)WM.restore(ex);
      WM.focus(ex);
      if(a.onNavigate)a.onNavigate(ex,opts);
      return ex;
    }
  }
  return WM.open(id,opts);
}
function openFile(segs){
  const n=FS.node(segs);
  if(!n){Notify.toast('File not found',FS.displayPath(segs),'close');return}
  if(n.kind==='dir'){openApp('files',{path:segs});return}
  const ext=(n.name.split('.').pop()||'').toLowerCase();
  let app=null;
  if(['txt','md','csv','log','ini'].indexOf(ext)>=0)app='notes';
  else if(['jpg','jpeg','png','webp','gif'].indexOf(ext)>=0)app='gallery';
  if(!app){
    Dialog.confirm('No application is associated with "'+n.name+'" in this simulation. Open it as a plain text note instead?','Open anyway?','Open in Notes',false).then(ok=>{if(ok)openApp('notes',{file:segs})});
    return;
  }
  Recent.add({app:app,name:n.name,sub:FS.displayPath(segs),path:segs,icon:AppFiles._icon?AppFiles._icon(n):'doc'});
  openApp(app,{file:segs});
}
/* ================= markdown ================= */
function renderMD(src){
  const lines=String(src==null?'':src).split('\n');
  let html='',inCode=false,inList=false,listType='';
  const codeBuf=[];
  const closeList=()=>{if(inList){html+='</ul>';inList=false}};
  const openList=t=>{if(inList&&listType!==t)html+='</ul>';if(!inList||listType!==t){html+='<ul class="md-ul">';inList=true;listType=t}};
  const flushPara=()=>{if(para.length){html+='<p>'+para.join('<br>')+'</p>';para.length=0}};
  const para=[];
  const inline=s=>{
    s=esc(s);
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a class="md-lnk" href="$2" target="_blank" rel="noopener">$1</a>');
    s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<span class="md-lnk">$1</span>');
    return s;
  };
  for(const raw of lines){
    if(/^```/.test(raw.trim())){
      if(inCode){closeList();html+='<pre class="md-pre"><code>'+esc(codeBuf.join('\n'))+'</code></pre>';codeBuf.length=0;inCode=false}
      else{flushPara();closeList();inCode=true}
      continue;
    }
    if(inCode){codeBuf.push(raw);continue}
    const t=raw.trim();
    if(!t){flushPara();closeList();continue}
    let m;
    if((m=t.match(/^(#{1,4})\s+(.*)$/))){
      flushPara();closeList();
      const h=m[1].length>3?4:m[1].length;
      html+='<h'+h+' class="md-h'+h+'">'+inline(m[2])+'</h'+h+'>';
    }else if((m=t.match(/^[-*]\s+\[( |x|X)\]\s+(.*)$/))){
      flushPara();openList('ck');
      const on=m[1].trim();
      html+='<li class="md-chk"><span class="md-box'+(on?' on':'')+'">'+(on?Icon('check',11):'')+'</span><span>'+inline(m[2])+'</span></li>';
    }else if((m=t.match(/^[-*]\s+(.*)$/))){
      flushPara();openList('ul');
      html+='<li>'+inline(m[1])+'</li>';
    }else if((m=t.match(/^>\s?(.*)$/))){
      flushPara();closeList();
      html+='<blockquote class="md-q">'+inline(m[1])+'</blockquote>';
    }else if(/^---+$/.test(t)){
      flushPara();closeList();
      html+='<hr class="md-hr">';
    }else{
      if(para.length)closeList();
      para.push(inline(t));
    }
  }
  if(inCode&&codeBuf.length)html+='<pre class="md-pre"><code>'+esc(codeBuf.join('\n'))+'</code></pre>';
  flushPara();closeList();
  return html;
}
/* ================= window manager ================= */
const SnapPreview={
  el:byId('snap-preview'),
  show(snap){
    if(!this.el)return;
    if(!snap){this.el.classList.remove('on');return}
    const b=WM._snapBounds(snap);
    this.el.style.left=b.x+'px';
    this.el.style.top=b.y+'px';
    this.el.style.width=b.w+'px';
    this.el.style.height=b.h+'px';
    this.el.classList.add('on');
  },
  hide(){if(this.el)this.el.classList.remove('on')}
};
const WM={
  windows:[],
  z:10,
  active:null,
  root(){return byId('windows')},
  open(appId,opts){
    const app=AppRegistry.get(appId);
    if(!app)return null;
    if(!app.multi){
      const ex=this.windows.find(w=>w.app.id===appId&&!w._closing);
      if(ex){
        if(ex.minimized)this.restore(ex);
        this.focus(ex);
        return ex;
      }
    }
    const w=this._make(app,opts||{});
    this.windows.push(w);
    Taskbar.render();
    if(!this.active)this.focus(w);
    return w;
  },
  _make(app,opts){
    const n=this.windows.length;
    const R=this.root();
    const W=R.clientWidth||innerWidth, H=R.clientHeight||(innerHeight-56);
    const maxW=Math.max(280,W-16), maxH=Math.max(200,H-16);
    const width=clamp(app.w||640,Math.min(300,maxW),maxW);
    const height=clamp(app.h||420,Math.min(200,maxH),maxH);
    let x=clamp(90+(n%6)*30,8,Math.max(8,maxW-width));
    let y=clamp(46+(n%6)*26,8,Math.max(8,maxH-height));
    const wEl=el('div','win');
    wEl.setAttribute('role','dialog');
    wEl.setAttribute('aria-label',app.name);
    const bar=el('div','win-titlebar');
    bar.innerHTML=
      '<div class="win-tb-left"><span class="win-ic">'+Icon(app.icon,16)+'</span><span class="win-title"></span></div>'+
      '<div class="win-tb-right">'+
      '<button class="wbtn w-min" aria-label="Minimize">'+Icon('min',13)+'</button>'+
      '<button class="wbtn w-max" aria-label="Maximize or restore">'+Icon('max',13)+'</button>'+
      '<button class="wbtn w-close" aria-label="Close">'+Icon('close',13)+'</button>'+
      '</div>';
    const body=el('div','win-body');
    wEl.appendChild(bar);
    wEl.appendChild(body);
    ['n','s','e','w','ne','nw','se','sw'].forEach(h=>{
      const d=el('div','rh r-'+h);
      d.addEventListener('pointerdown',e=>{if(e.button!==0)return;if(w.maximized)return;e.preventDefault();this.startResize(w,h,e)});
      wEl.appendChild(d);
    });
    R.appendChild(wEl);
    const w={
      id:uid(),app:app,el:wEl,bar:bar,body:body,
      title:app.name,
      x:x,y:y,w:width,h:height,
      prev:null,minimized:false,maximized:false,snap:null,
      opts:opts,_closing:false
    };
    w.el.querySelector('.w-min').addEventListener('click',e=>{e.stopPropagation();this.minimize(w)});
    w.el.querySelector('.w-max').addEventListener('click',e=>{e.stopPropagation();this.maximize(w)});
    w.el.querySelector('.w-close').addEventListener('click',e=>{e.stopPropagation();this.close(w)});
    bar.addEventListener('dblclick',e=>{if(e.target.closest('.wbtn'))return;this.maximize(w)});
    bar.addEventListener('pointerdown',e=>{
      if(e.button!==0||e.target.closest('.wbtn'))return;
      if(w.maximized){
        // drag out of maximized state restores first
        if(e.clientY>44){
          this.maximize(w);
          this.startDrag(w,e);
        }
        return;
      }
      this.startDrag(w,e);
    });
    wEl.addEventListener('pointerdown',()=>{if(this.active!==w&&!w._closing)this.focus(w)});
    this._applyBounds(w);
    requestAnimationFrame(()=>wEl.classList.add('open'));
    if(app.open){try{app.open(w,opts||{})}catch(err){console.warn('app open failed',app.id,err)}}
    this.focus(w);
    return w;
  },
  _applyBounds(w,anim){
    const R=this.root();
    let b;
    if(w.maximized)b={x:0,y:0,w:R.clientWidth,h:R.clientHeight};
    else if(w.snap)b=this._snapBounds(w.snap);
    else b={x:w.x,y:w.y,w:w.w,h:w.h};
    if(anim)w.el.classList.add('snap-anim');
    w.el.style.left=b.x+'px';
    w.el.style.top=b.y+'px';
    w.el.style.width=Math.max(200,b.w)+'px';
    w.el.style.height=Math.max(160,b.h)+'px';
    if(anim)setTimeout(()=>w.el.classList.remove('snap-anim'),260);
  },
  _snapBounds(snap){
    const R=this.root();
    const W=R.clientWidth, H=R.clientHeight;
    if(snap==='left')return {x:0,y:0,w:Math.round(W/2),h:H};
    if(snap==='right')return {x:Math.round(W/2),y:0,w:Math.round(W/2),h:H};
    if(snap==='top')return {x:0,y:0,w:W,h:H};
    if(snap==='tl')return {x:0,y:0,w:Math.round(W/2),h:Math.round(H/2)};
    if(snap==='tr')return {x:Math.round(W/2),y:0,w:Math.round(W/2),h:Math.round(H/2)};
    if(snap==='bl')return {x:0,y:Math.round(H/2),w:Math.round(W/2),h:Math.round(H/2)};
    if(snap==='br')return {x:Math.round(W/2),y:Math.round(H/2),w:Math.round(W/2),h:Math.round(H/2)};
    return {x:0,y:0,w:W,h:H};
  },
  _snapZone(cx,cy){
    const W=innerWidth, H=innerHeight;
    if(cy<8)return 'top';

    if(R&&cy<H/2)return 'tr';
    if(L)return 'bl';
    if(R)return 'br';
    return null;
  },
  focus(w){
    if(!w||w._closing)return;
    if(this.active===w){w.el.style.zIndex=++this.z;return}
    if(this.active){
      this.active.el.classList.remove('active');
      if(this.active.app.onDeactivate){try{this.active.app.onDeactivate(this.active)}catch(e){}}
    }
    this.active=w;

  },
  close(w){

      this.active=null;
      const vis=this.windows.filter(x=>!x.minimized&&!x._closing);
      if(vis.length)this.focus(vis[vis.length-1]);
    }
    w.el.classList.remove('open');
    w.el.classList.add('closing');

  },
  minimize(w){

      this.active=null;

  },
  restore(w){
    if(!w||w._closing||!w.minimized)return;

  },
  maximize(w){
    if(!w||w._closing)return;

      w.prev={x:w.x,y:w.y,w:w.w,h:w.h};

    }

  },
  snapTo(w,snap){
    if(!w||w._closing)return;

    }
    this._applyBounds(w,true);
  },
  startDrag(w,e){
    const sx=e.clientX, sy=e.clientY, ox=w.x, oy=w.y;
    const R=this.root();

    document.body.classList.add('dragging-win');
    let snap=null;
    const move=ev=>{
      let nx=ox+ev.clientX-sx, ny=oy+ev.clientY-sy;
      nx=clamp(nx,-w.w+120,Math.max(0,rootW-120));
      ny=clamp(ny,-w.h+44,Math.max(0,rootH-32));
      w.x=nx;w.y=ny;
      if(w.snap){w.snap=null;w.maximized=false;w.el.classList.remove('max')}

      if(!snap){
        w.el.style.left=nx+'px';

      }

    const up=()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      document.body.classList.remove('dragging-win');
      SnapPreview.hide();
      if(snap){
        this.snapTo(w,snap);
      }else{
        this._clampWin(w);

      }
    };

    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);

  startResize(w,h,e){
    const sx=e.clientX, sy=e.clientY;
    const o={x:w.x,y:w.y,w:w.w,h:w.h};

    const move=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      let x=o.x,y=o.y,ww=o.w,hh=o.h;
      if(h.indexOf('e')>=0)ww=clamp(o.w+dx,minW,5000);
      if(h.indexOf('s')>=0)hh=clamp(o.h+dy,minH,5000);
      if(h.indexOf('w')>=0){ww=clamp(o.w-dx,minW,5000);x=o.x+(o.w-ww)}
      if(h.indexOf('n')>=0){hh=clamp(o.h-dy,minH,5000);y=o.y+(o.h-hh)}
      w.x=x;w.y=y;w.w=ww;w.h=hh;
      this._applyBounds(w);
    };
    const up=()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      this._clampWin(w);
      this._applyBounds(w);
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  },
  _clampWin(w){
    const R=this.root();

    if(W>0)w.x=clamp(w.x,120-w.w,Math.max(0,W-120));

  },
  clampAll(){
    this.windows.forEach(w=>{

        this._applyBounds(w);
      }
    });
  },
  cascade(){
    const vis=this.windows.filter(w=>!w.minimized&&!w._closing);
    vis.forEach((w,i)=>{
      if(w.maximized)this.maximize(w);
      const R=this.root();
      w.x=clamp(50+(i*34)%Math.max(80,R.clientWidth-360),8,Math.max(8,R.clientWidth-320));
      w.y=clamp(36+(i*28)%Math.max(80,R.clientHeight-240),8,Math.max(8,R.clientHeight-200));
      this._applyBounds(w,true);
    });
  },
  tile(){
    const vis=this.windows.filter(w=>!w.minimized&&!w._closing);
    if(!vis.length)return;
    const R=this.root();
    const n=vis.length, cols=n<=1?1:(n<=4?2:3), rows=Math.ceil(n/cols);
    vis.forEach((w,i)=>{
      if(w.maximized)this.maximize(w);
      const c=i%cols, r=Math.floor(i/cols);
      w.snap=null;
      w.x=Math.round(c*(R.clientWidth/cols));
      w.y=Math.round(r*(R.clientHeight/rows));
      w.w=Math.round(R.clientWidth/cols);
      w.h=Math.round(R.clientHeight/rows);
      this._applyBounds(w,true);
    });
  },
  showDesktop(){
    const vis=this.windows.filter(w=>!w.minimized&&!w._closing);
    if(vis.length){
      vis.forEach(w=>this.minimize(w));
      this.active=null;
    }else if(this.windows.length){
      this.windows.filter(w=>!w._closing).forEach(w=>this.restore(w));
    }
  }
};

  handleTab(shift){
    let ws=this._visibles();
    if(!ws.length)ws=[...WM.windows].filter(w=>!w._closing);
    if(!ws.length)return false;
    if(!this.shown){
      this.order=[...WM.windows]
        .filter(w=>!w._closing)
        .sort((a,b)=>(parseInt(b.el.style.zIndex,10)||0)-(parseInt(a.el.style.zIndex,10)||0));

const Clock={
  _i:null,
  _DAY_S:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
  _DAY_L:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
  _MON_L:['January','February','March','April','May','June','July','August','September','October','November','December'],
  init(){this.tick();this._i=setInterval(()=>this.tick(),1000)},
  _set(id,v){const e=byId(id);if(e&&e.textContent!==v)e.textContent=v},
  tick(){
    const d=new Date();
    let h=d.getHours();
    const m=pad(d.getMinutes());
    const ap=Settings.data.clock24?'':(h>=12?'PM':'AM');
    if(!Settings.data.clock24)h=h%12||12;
    const hs=String(h);
    this._set('ct-h',hs);this._set('ct-m',m);this._set('ct-ap',ap);
    this._set('ct-date',this._DAY_S[d.getDay()]+' '+_MO[d.getMonth()]+' '+d.getDate());
    this._set('cp-h',hs);this._set('cp-m',m);this._set('cp-ap',ap);
    this._set('cp-date',this._DAY_L[d.getDay()]+', '+this._MON_L[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear());
    this._set('lock-time',hs+':'+m+(ap?' '+ap:''));
    this._set('lock-date',this._DAY_L[d.getDay()]+', '+this._MON_L[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear());
  },
  monthLong(m){return this._MON_L[m]}
};

const ClockPop={

    t.appendChild(ic);t.appendChild(tx);t.appendChild(x);
    byId('toasts').appendChild(t);

/* ================= search engine ================= */
const SearchEngine={
  search(q){
    q=String(q||'').trim();
    if(!q)return [];
    const out=[];
    AppRegistry.list().forEach(a=>{
      const s=fuzzy(q,(a.name+' '+(a.kw||'')));
      if(s>0)out.push({type:'app',label:a.name,sub:'Application',icon:a.icon,score:s+20,action:()=>openApp(a.id)});
    });
    FS.walk((n,segs)=>{
      if(segs[0]==='trash')return;
      const s=fuzzy(q,n.name);
      if(s>0)out.push({type:'file',label:n.name,sub:FS.displayPath(segs),icon:AppFiles._icon?AppFiles._icon(n):'doc',score:s,action:()=>openFile(segs)});
    });
    SETTING_SECTIONS.forEach(sec=>{
      const s=fuzzy(q,sec.name);
      if(s>0)out.push({type:'settings',label:sec.name,sub:'Settings · section',icon:sec.icon,score:s,action:()=>openApp('settings',{section:sec.id})});
    });
    (Palette.commands?Palette.commands():[]).forEach(cd=>{
      const s=fuzzy(q,(cd.label+' '+(cd.kw||'')));
      if(s>0)out.push({type:'command',label:cd.label,sub:'Command',icon:cd.icon||'grid',score:s-5,action:cd.action});
    });
    out.sort((a,b)=>b.score-a.score);
    return out.slice(0,9);
  }
};

/* ================= dialogs ================= */
const Dialog={
  open(opts){
    return new Promise(resolve=>{
      const root=byId('dr');
      if(root._tok)clearTimeout(root._tok);
      root.innerHTML='';
      root.classList.remove('hidden');
      let settled=false;
      const keyH=e=>{
        if(e.key==='Escape'){
          e.preventDefault();
          e.stopPropagation();
          done('cancel');
        }else if(e.key==='Enter'&&opts.input&&e.target===inp){
          e.preventDefault();
          e.stopPropagation();
          const ok=(opts.buttons||[]).find(b=>b.role==='ok')||{};
          done(ok.role||'ok',inp.value);
        }
      };
      const bdH=e=>{
        if(e.target===root)done('cancel');
      };
      const done=(role,input)=>{
        if(settled)return;
        settled=true;
        document.removeEventListener('keydown',keyH,true);
        root.removeEventListener('mousedown',bdH);
        root.classList.remove('in');
        root._tok=setTimeout(()=>{
          root.classList.add('hidden');
          root.innerHTML='';
        },200);
        resolve({role:role,input:input!=null?input:null});
      };
      const box=el('div','dr-box');
      box.setAttribute('role','dialog');
      box.setAttribute('aria-modal','true');
      let html='';
      if(opts.title)html+='<div class="dr-title">'+esc(opts.title)+'</div>';
      if(opts.html)html+='<div class="dr-msg">'+opts.html+'</div>';
      if(opts.input)html+='<input class="inp dr-inp" type="text" placeholder="'+esc(opts.input.ph||'')+'" aria-label="'+esc(opts.title||'Input')+'" autocomplete="off" spellcheck="false">';
      html+='<div class="dr-btns"></div>';
      box.innerHTML=html;
      const btns=box.querySelector('.dr-btns');
      (opts.buttons||[{label:'Close',role:'ok',primary:true}]).forEach(bd=>{
        const b=el('button','btn'+(bd.primary?' prim':'')+(bd.danger?' dng':'')+(bd.ghost?' ghost':''));
        b.textContent=bd.label;
        b.addEventListener('click',()=>{
          const i2=box.querySelector('.dr-inp');
          done(bd.role||'ok',i2?i2.value:null);
        });
        btns.appendChild(b);
      });
      root.appendChild(box);
      document.addEventListener('keydown',keyH,true);
      root.addEventListener('mousedown',bdH);
      const inp=box.querySelector('.dr-inp');
      if(inp){
        inp.value=opts.input.initial||'';
        setTimeout(()=>{try{inp.focus();inp.select()}catch(e2){}},60);
      }
      requestAnimationFrame(()=>root.classList.add('in'));
    });
  },
  prompt(title,ph,initial){
    return this.open({
      title:title,
      input:{ph:ph,initial:initial},
      buttons:[{label:'Cancel',role:'cancel'},{label:'Save',role:'ok',primary:true}]
    }).then(r=>({role:r.role,input:r.input}));
  },
  confirm(msg,title,label,danger){
    label=label||'Confirm';
    return this.open({
      title:title||'Are you sure?',
      html:esc(msg),
      buttons:[{label:'Cancel',role:'cancel'},{label:label,role:'ok',primary:!danger,danger:danger}]
    }).then(r=>r.role==='ok');
  },
  props(title,rows){
    let html='';
    (rows||[]).forEach(r=>{
      html+='<div class="dp-row"><span class="dp-k">'+esc(r[0])+'</span><span class="dp-v">'+esc(r[1])+'</span></div>';
    });
    return this.open({
      title:title,
      html:'<div class="dr-props">'+html+'</div>',
      buttons:[{label:'Close',role:'ok',primary:true}]
    });
  }
};

  ],
  _pos:null,
  init(){
    this._pos=Store.get('icons',null)||{};
    const root=byId('desktop');
    root.addEventListener('click',e=>{
      if(e.target===root||e.target.id==='wallpaper'||e.target.id==='desktop-icons')this._deselect();
    });

  },
  cell(){return (Settings.data.iconSize||64)+22},
  render(){
    const c=byId('desktop-icons');
    if(!c)return;
    c.innerHTML='';
    const cell=this.cell();
    this.defs.forEach((d,i)=>{
      const a=AppRegistry.get(d.app);
      if(!a)return;
      const p=this._pos[d.app]||{c:0,r:Math.floor(i/3)};
      const b=el('div','d-icon');
      b.dataset.app=d.app;
      b.style.left=(p.c*cell+10)+'px';
      b.style.top=(p.r*cell+10)+'px';
      b.innerHTML='<span class="d-ic">'+Icon(a.icon,26)+'</span><span class="d-lb">'+esc(d.label)+'</span>';
      b.addEventListener('click',()=>{
        if(b._moved){b._moved=false;return}
        this._select(b);
      });
      b.addEventListener('dblclick',e=>{
        e.preventDefault();
        openApp(d.app);
      });
      b.addEventListener('contextmenu',e=>{
        e.preventDefault();
        e.stopPropagation();
        this._select(b);
        this._iconMenu(e.clientX,e.clientY,d.app);
      });
      b.addEventListener('pointerdown',e=>this._dragIcon(b,d.app,e));
      c.appendChild(b);
    });
  },
  _deselect(){
    byId('desktop-icons').querySelectorAll('.d-icon.sel').forEach(n=>n.classList.remove('sel'));
  },
  _select(b){
    this._deselect();
    b.classList.add('sel');
  },
  _dragIcon(b,app,e){
    if(e.button!==0)return;
    e.preventDefault();
    const sx=e.clientX,sy=e.clientY;
    const ox=parseInt(b.style.left,10)||0, oy=parseInt(b.style.top,10)||0;
    let moved=false;
    const cell=this.cell();
    const move=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!moved&&Math.abs(dx)+Math.abs(dy)<6)return;
      moved=true;
      b._moved=true;
      b.classList.add('dragging');
      const R=byId('desktop').getBoundingClientRect();
      const nx=clamp(ox+dx,0,Math.max(0,R.width-96));
      const ny=clamp(oy+dy,0,Math.max(0,R.height-84));
      b.style.left=nx+'px';
      b.style.top=ny+'px';
    };
    const up=()=>{
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      if(!moved)return;
      b.classList.remove('dragging');
      const R=byId('desktop').getBoundingClientRect();
      const col=clamp(Math.round((parseInt(b.style.left,10)-10)/cell),0,Math.max(0,Math.ceil(R.width/cell)-1));
      const row=clamp(Math.round((parseInt(b.style.top,10)-10)/cell),0,Math.max(0,Math.ceil(R.height/cell)-1));
      this._pos[app]={c:col,r:row};
      Store.set('icons',this._pos);
      b.style.transition='left .18s ease,top .18s ease';
      b.style.left=(col*cell+10)+'px';
      b.style.top=(row*cell+10)+'px';
      setTimeout(()=>{b.style.transition='';b._moved=false},220);
    };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  },
  _menu(x,y){
    Menu.openMenu(x,y,[
      {label:'New Folder',icon:'plus',action:()=>{
        Dialog.prompt('New folder','Folder name (created in /home)','New folder').then(r=>{

/* ================= matrix fx ================= */
const MatrixFx={
  active:false,
  _raf:0,
  _drops:[],
  init(){
    this.cv=byId('matrix-cv');
    this.ctx=this.cv?this.cv.getContext('2d'):null;
    const size=()=>{
      if(!this.cv)return;
      this.cv.width=innerWidth;
      this.cv.height=innerHeight;
    };
    size();
    window.addEventListener('resize',debounce(size,300));
  },
  start(){
    if(this.active||!this.ctx)return;
    this.active=true;
    const m=byId('matrix');
    m.classList.remove('hidden');
    const W=this.cv.width,H=this.cv.height;
    this._drops=[];
    const cols=Math.max(10,Math.floor(W/16));
    for(let i=0;i<cols;i++)this._drops.push(Math.random()*-H/16);
    this.ctx.fillStyle='#000';
    this.ctx.fillRect(0,0,W,H);
    let last=0;
    const loop=t=>{
      if(!this.active)return;
      this._raf=requestAnimationFrame(loop);
      if(t-last<66)return;
      last=t;
      this.ctx.fillStyle='rgba(0,8,4,0.09)';
      this.ctx.fillRect(0,0,W,H);
      this.ctx.font='14px monospace';
      for(let i=0;i<this._drops.length;i++){
        const ch=String.fromCharCode(0x30A0+Math.floor(Math.random()*96));
        const x=i*16, y=this._drops[i]*16;
        this.ctx.fillStyle='#3dff8b';
        this.ctx.fillText(ch,x,y);
        if(y>H&&Math.random()>0.975)this._drops[i]=0;
        else this._drops[i]+=1;
      }
    };
    this._raf=requestAnimationFrame(loop);
  },
  stop(){
    if(!this.active)return;
    this.active=false;
    cancelAnimationFrame(this._raf);
    byId('matrix').classList.add('hidden');
  }
};
/* ================= sound (synthesized, off by default) ================= */
const Sound={
  _ac:null,
  ctx(){
    if(!this._ac){
      try{
        const AC=window.AudioContext||window.webkitAudioContext;
        if(AC)this._ac=new AC();
      }catch(e){this._ac=null}
    }
    return this._ac;
  },
  blip(f,dur,vol){
    const ac=this.ctx();
    if(!ac||!Settings.data.toggles.sound)return;
    try{
      if(ac.state==='suspended')ac.resume();
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine';
      o.frequency.value=f||880;
      g.gain.setValueAtTime(0.0001,ac.currentTime);
      g.gain.linearRampToValueAtTime(vol||0.04,ac.currentTime+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+(dur||0.08));
      o.connect(g);
      g.connect(ac.destination);
      o.start();
      o.stop(ac.currentTime+(dur||0.08)+0.04);
    }catch(e){}
  },
  boot(){
    if(!Settings.data.toggles.sound)return;

/* ================= boot sequence ================= */
const Boot={
  _running:false,
  lines:['Initializing kernel','Mounting virtual filesystem','Loading interface','Restoring session'],
  run(fromRestart){
    if(this._running)return;
    this._running=true;
    const b=byId('boot');
    b.classList.remove('done');
    b.classList.remove('hidden');
    byId('boot-fill').style.width='0%';
    const linesEl=byId('boot-lines');
    linesEl.innerHTML='';
    const step=i=>{
      if(i>=this.lines.length){
        byId('boot-fill').style.width='100%';
        setTimeout(()=>this._finish(fromRestart),fromRestart?360:540);
        return;
      }
      const ln=el('div','boot-line');
      ln.innerHTML='<span class="bok">[ ok ]</span>'+esc(this.lines[i]);
      linesEl.appendChild(ln);
      requestAnimationFrame(()=>ln.classList.add('on'));
      byId('boot-fill').style.width=Math.round(((i+1)/this.lines.length)*100)+'%';
      setTimeout(()=>step(i+1),fromRestart?150:340);
    };
    step(0);
  },
  _finish(fromRestart){
    const b=byId('boot');
    b.classList.add('done');
    document.body.classList.remove('fading');
    setTimeout(()=>{
      b.classList.add('hidden');
      this._running=false;
      Nova.onReady(fromRestart);
    },580);
  },
  skip(){
    const b=byId('boot');
    b.classList.add('hidden');
    document.body.classList.remove('fading');
    this._running=false;
    Nova.onReady(false);
  }
};

const AppTerm={
  open(w,opts){
    w.tm={cwd:['home'],hist:[],hp:-1};
    w.body.classList.add('tm');
    w.body.innerHTML='';
    const shell=el('div','tm-shell');
    const out=el('div','tm-out');
    const line=el('div','tm-line');

    const inp=el('input','tm-in');

    w.body.addEventListener('click',e=>{
      if(!isEditable(e.target))inp.focus();
    });
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.stopPropagation();
        const v=inp.value;
        inp.value='';
        if(v.trim()){
          w.tm.hist.push(v);
          if(w.tm.hist.length>100)w.tm.hist.shift();
          w.tm.hp=-1;
          this._print(w,this._pm(w)+v,'nc');
        }
        this._run(w,v.trim());
      }else if(e.key==='ArrowUp'){
        e.preventDefault();
        e.stopPropagation();
        if(!w.tm.hist.length)return;
        w.tm.hp=w.tm.hp<0?w.tm.hist.length-1:Math.max(0,w.tm.hp-1);
        inp.value=w.tm.hist[w.tm.hp];
      }else if(e.key==='ArrowDown'){
        e.preventDefault();
        e.stopPropagation();
        if(w.tm.hp<0)return;
        w.tm.hp++;
        if(w.tm.hp>=w.tm.hist.length){w.tm.hp=-1;inp.value=''}
        else inp.value=w.tm.hist[w.tm.hp];
      }

  _pm(w){
    const p=w.tm.cwd;
    const disp=p.join('/')==='home'?'~':'/'+p.join('/');
    return 'nova@station:'+disp+'$ ';
  },
  _prompt(w){
    const p=w.body.querySelector('.tm-prompt');

      d.textContent=l;
      out.appendChild(d);
    });
    out.scrollTop=out.scrollHeight;
  },
  _tree(w){
    const lines=['/'];
    const walk=(n,segs,prefix,isLast)=>{
      if(segs[0]==='trash')return;
      lines.push(prefix+(isLast?'└── ':'├── ')+(n.kind==='dir'?n.name+'/':n.name));
      if(n.kind==='dir'){
        const ch=FS.list(segs.concat(n.name));
        ch.forEach((c,i)=>walk(c,segs.concat(n.name),prefix+(isLast?'    ':'│   '),i===ch.length-1));
      }
    };
    const roots=FS.root.children.slice().sort((a,b)=>a.name.localeCompare(b.name));
    roots.forEach((r,i)=>walk(r,[],'',i===roots.length-1));
    this._print(w,lines.join('\n'),'nc');
  },
  _run(w,cmd){
    if(!cmd)return;
    const parts=cmd.split(/\s+/);
    const c=parts[0];
    const a=parts.slice(1);
    const cwd=w.tm.cwd;
    const ok=t=>this._print(w,t,'ok');
    const err=t=>this._print(w,t,'err');
    switch(c){
      case 'help':
        this._print(w,['AVAILABLE COMMANDS',

          '  ls [path]       list directory contents',
          '  cd [path]       change directory',
          '  pwd             print working directory',
          '  cat <file>      print a file',
          '  echo <text>     print text',
          '  date            current date and time',
          '  whoami          current user',
          '  hostname        machine name',
          '  mkdir <name>    create a folder in the current directory',
          '  rm <item>       move an item to Trash',
          '  tree            show the filesystem tree',
          '  history         command history',
          '  neofetch        system summary',
          '  uptime          system uptime',
          '  theme [name]    show or set theme (dark | dim | light)',
          '  open <app>      launch an application',
          '  matrix          …you know what this is',
          '  reboot          restart the interface',
          '  clear           clear the screen',
          '  exit            close this terminal'].join('\n'),'nc');
        break;
      case 'clear':
        w.body.querySelector('.tm-out').innerHTML='';
        break;
      case 'date':{
        const d=new Date();
        this._print(w,d.toUTCString()+'   ·   local '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()));
        break;
      }
      case 'whoami':
        this._print(w,'nova');
        break;
      case 'hostname':
        this._print(w,'station');
        break;
      case 'pwd':
        this._print(w,'/'+cwd.join('/'));
        break;
      case 'ls':{
        const segs=FS.resolve(cwd,a[0]);
        const n=FS.node(segs);
        if(!n){err('ls: cannot access "'+(a[0]||'/')+'": No such file or directory');break}
        if(n.kind==='file'){this._print(w,n.name);break}
        const ch=FS.list(segs);
        if(!ch.length){this._print(w,'(empty directory)','dim');break}
        this._print(w,ch.map(x=>x.kind==='dir'?x.name+'/':x.name).join('\n'));
        break;
      }
      case 'cd':{
        const p=a[0]||'~';
        const segs=FS.resolve(cwd,p);
        const n=FS.node(segs);
        if(!n){err('cd: no such file or directory: '+p);break}
        if(n.kind!=='dir'){err('cd: not a directory: '+p);break}
        w.tm.cwd=segs;
        this._prompt(w);
        break;
      }
      case 'cat':{
        if(!a[0]){err('cat: missing operand');break}
        const segs=FS.resolve(cwd,a[0]);
        const n=FS.node(segs);
        if(!n){err('cat: '+a[0]+': No such file or directory');break}
        if(n.kind==='dir'){err('cat: '+a[0]+': Is a directory');break}
        this._print(w,n.content||'');
        break;
      }
      case 'echo':
        this._print(w,a.join(' '));
        break;
      case 'mkdir':{
        if(!a[0]){err('mkdir: missing operand');break}
        const e2=FS.mkdir(cwd,a[0]);
        if(e2)err('mkdir: '+e2);
        break;
      }
      case 'rm':{
        if(!a[0]){err('rm: missing operand');break}
        const e2=FS.trash(cwd,a[0]);
        if(e2)err('rm: '+e2);
        else this._print(w,'moved "'+a[0]+'" to Trash','dim');
        break;
      }
      case 'tree':
        this._tree(w);
        break;
      case 'history':
        if(!w.tm.hist.length)this._print(w,'(empty history)','dim');
        else w.tm.hist.forEach((h,i)=>this._print(w,'  '+(i+1)+': '+h,'dim'));
        break;
      case 'neofetch':{
        const logo=[
          '╦ ╦  ╦═╗  ╦╦╗  ╔═╗',
          '║ ║  ╠╦╝  ║ ║  ║ ║',
          '╚═╝  ╩╚═  ╩ ╩  ╚═╝'
        ];
        const info=[
          'OS:        NOVA OS 8.4.2 (build 2609.44)',
          'Shell:     NovaShell 2.1',
          'WM:        Nova Window Server',
          'Resolution:'+window.innerWidth+'×'+window.innerHeight,
          'Uptime:    '+fmtUptime(Date.now()-Nova.bootTime),
          'Theme:     '+cap(Settings.data.theme||'dark'),
          'CPU:       8-Core Quantum Simulation Unit',
          'Memory:    '+Math.round(4.2+2*WM.windows.filter(x=>!x._closing).length*0.7).toFixed(1)+' / 32 GB virtual',
          'Windows:   '+WM.windows.filter(x=>!x._closing).length
        ];
        const rows=[];
        for(let i=0;i<info.length;i++){
          rows.push((logo[i]||'                   ')+'  '+info[i]);
        }
        this._print(w,rows.join('\n'),'acc');
        break;
      }
      case 'uptime':
        this._print(w,'up '+fmtUptime(Date.now()-Nova.bootTime)+', 1 user, load average 0.42 0.38 0.36');
        break;
      case 'theme':{
        if(a[0]){
          const t=a[0].toLowerCase();
          if(['dark','dim','light'].indexOf(t)<0){err('theme: unknown "'+a[0]+'" (use dark|dim|light)');break}
          Settings.set('theme',t);
          ok('theme set to '+t);
        }else this._print(w,'current theme: '+(Settings.data.theme||'dark'));
        break;
      }
      case 'open':{
        if(!a[0]){err('open: missing application name');break}
        const q=a.join(' ').toLowerCase();
        const hits=AppRegistry.list().map(x=>({x:x,s:fuzzy(q,x.name+' '+(x.kw||''))}))
          .filter(r=>r.s>0)
          .sort((p,q2)=>q2.s-p.s);
        if(!hits.length){err('open: no application matching "'+a.join(' ')+'"');break}
        const hit=hits[0].x;
        openApp(hit.id);
        ok('opening '+hit.name+'…');
        break;
      }
      case 'matrix':
        this._print(w,'wake up, nova…','dim');
        MatrixFx.start();
        break;
      case 'sudo':
        this._print(w,'nova is not in the sudoers file.\nThis incident will be reported.','err');
        break;
      case 'cow':
        this._print(w,'  ^__^\n  (oo)\\\n  |)||/\n  "^^"');
        break;
      case 'exit':
        WM.close(w);
        break;
      case 'reboot':
        this._print(w,'Rebooting NOVA interface…','dim');
        setTimeout(()=>Nova.restart(),700);
        break;
      default:
        err('NovaShell: command not found: '+c);
    }
  },
  onActivate(w){
    const inp=w.body.querySelector('.tm-in');
    if(inp)inp.focus({preventScroll:true});
  }
