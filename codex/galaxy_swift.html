<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTRA // Procedural Galaxy Explorer</title>
<style>
:root{
  --bg:#04060b;
  --ink:#d8dde8;
  --dim:#8b95a7;
  --faint:#5a6478;
  --line:rgba(140,165,205,.14);
  --line2:rgba(140,165,205,.30);
  --panel:rgba(9,14,24,.80);
  --accent:#e2b06a;
  --accent2:#6fb5a8;
  --danger:#c96a5a;
  --font-mono:"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:dark}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--bg);font-family:var(--font-mono);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:var(--font-mono)}
canvas#bg{position:fixed;inset:0;z-index:0;display:block}
canvas#scene{position:fixed;inset:0;z-index:1;display:block;cursor:crosshair;touch-action:none}

/* ---------- top HUD ---------- */
#hud-top{position:fixed;top:0;left:0;right:0;height:48px;z-index:10;display:flex;align-items:center;gap:18px;padding:0 16px;
  background:linear-gradient(180deg,rgba(5,8,15,.88),rgba(5,8,15,.42));border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none}
#hud-top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand-name{font-size:14px;font-weight:700;letter-spacing:.34em;color:var(--ink)}
.brand-sub{font-size:8.5px;letter-spacing:.26em;color:var(--faint);white-space:nowrap}
.sep{width:1px;height:22px;background:var(--line2)}
.hudstat{display:flex;flex-direction:column;gap:3px;min-width:0}
.hudstat .k{font-size:8px;letter-spacing:.24em;color:var(--faint)}
.hudstat .v{font-size:11.5px;letter-spacing:.08em;color:var(--ink);white-space:nowrap}
#hud-seed{cursor:pointer}
#hud-seed:hover{color:var(--accent)}
.seedbox{display:flex;align-items:center;gap:6px}
.seedbox input{width:112px}
.grow{flex:1}
.tb{display:flex;gap:6px}
.icon-btn{background:rgba(140,165,205,.05);border:1px solid var(--line);color:var(--dim);
  font-size:8.5px;font-weight:600;letter-spacing:.18em;padding:6px 10px;border-radius:3px;cursor:pointer;transition:all .18s ease}
.icon-btn:hover{color:var(--ink);border-color:var(--line2);background:rgba(140,165,205,.10)}
.icon-btn.active{color:var(--accent);border-color:rgba(226,176,106,.5)}

/* ---------- generic controls ---------- */
input[type=text]{background:rgba(4,8,16,.72);border:1px solid var(--line);color:var(--ink);
  font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;padding:7px 10px;border-radius:3px;width:100%}
input[type=text]::placeholder{color:var(--faint)}
input[type=text]:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 2px rgba(111,181,168,.14)}
.btn{background:rgba(140,165,205,.06);border:1px solid var(--line2);color:var(--dim);
  font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:7px 12px;border-radius:3px;cursor:pointer;
  transition:all .16s ease;white-space:nowrap}
.btn:hover{color:var(--ink);border-color:rgba(190,210,240,.45);background:rgba(140,165,205,.12)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.primary{color:#0a0d14;background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:#eec285;color:#0a0d14}
.btn.tiny{padding:4px 8px;font-size:8.5px}
button:focus-visible,input:focus-visible{outline:1px solid var(--accent2);outline-offset:2px}

/* ---------- panels ---------- */
.panel{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:4px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 14px 44px rgba(0,0,0,.5)}
.panel::before,.panel::after{content:'';position:absolute;width:10px;height:10px;border-style:solid;border-color:var(--line2);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.panel::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
#panel-left{left:12px;top:60px;bottom:46px;width:236px;display:flex;flex-direction:column;overflow:hidden}
#panel-right{right:12px;top:60px;width:288px;max-height:calc(100% - 118px);display:flex;flex-direction:column;overflow:hidden}
.panel-scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(140,165,205,.22) transparent}
.panel-scroll::-webkit-scrollbar{width:5px}
.panel-scroll::-webkit-scrollbar-thumb{background:rgba(140,165,205,.22);border-radius:3px}
.sec{border-bottom:1px solid var(--line)}
.sec h3{font-size:8.5px;font-weight:600;letter-spacing:.26em;color:var(--faint);padding:11px 14px 8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.sec h3 .chev{font-size:8px;color:var(--faint);transition:transform .2s ease}
.sec.collapsed .chev{transform:rotate(-90deg)}
.sec .body{padding:0 14px 12px}
.sec.collapsed .body{display:none}
.sec-meta{font-size:8px;color:var(--faint);letter-spacing:.14em}
.sec.flash{animation:secflash 1.1s ease}
@keyframes secflash{0%{box-shadow:inset 0 0 0 1px rgba(226,176,106,.5)}100%{box-shadow:inset 0 0 0 1px transparent}}

/* search */
#search-results{margin-top:8px}
.reslist{display:flex;flex-direction:column;gap:2px;max-height:172px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.reslist::-webkit-scrollbar{width:5px}
.reslist::-webkit-scrollbar-thumb{background:rgba(140,165,205,.22);border-radius:3px}
.res{display:flex;justify-content:space-between;gap:8px;align-items:baseline;width:100%;padding:6px 8px;border:1px solid transparent;background:transparent;
  color:var(--dim);font-size:10.5px;letter-spacing:.06em;cursor:pointer;text-align:left;border-radius:3px;transition:all .12s ease}
.res:hover{border-color:var(--line2);background:rgba(140,165,205,.08);color:var(--ink)}
.res .rid{color:var(--faint);font-size:8.5px;letter-spacing:.1em;white-space:nowrap}
.res-empty{font-size:8.5px;letter-spacing:.18em;color:var(--faint);padding:8px 2px}

/* filters */
.chips{display:flex;gap:4px;margin-bottom:10px}
.chip{width:24px;height:21px;display:grid;place-items:center;font-size:9px;font-weight:700;border:1px solid var(--line2);border-radius:3px;
  color:var(--dim);background:transparent;cursor:pointer;transition:all .15s ease;opacity:.55}
.chip.on{opacity:1;color:#0a0d14;background:var(--c,#888);border-color:var(--c,#888)}
.check{display:flex;gap:8px;align-items:center;font-size:9.5px;letter-spacing:.14em;color:var(--dim);padding:5px 0;cursor:pointer}
.check:hover{color:var(--ink)}
.check input{appearance:none;-webkit-appearance:none;width:11px;height:11px;border:1px solid var(--line2);border-radius:2px;background:transparent;cursor:pointer;flex:none}
.check input:checked{background:var(--accent2);border-color:var(--accent2)}
.filter-foot{margin-top:8px;display:flex;justify-content:flex-end}

/* inspector */
.insp-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.insp-name{font-size:13.5px;font-weight:700;letter-spacing:.14em;color:var(--ink);word-break:break-all}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badge{font-size:8px;font-weight:600;letter-spacing:.16em;padding:3px 8px;border:1px solid var(--line2);border-radius:2px;color:var(--dim)}
.badge.b-amber{color:var(--accent);border-color:rgba(226,176,106,.45)}
.badge.b-teal{color:var(--accent2);border-color:rgba(111,181,168,.45)}
.badge.sp-O{color:#9db8ff;border-color:rgba(157,184,255,.4)}
.badge.sp-B{color:#a8c0ff;border-color:rgba(168,192,255,.4)}
.badge.sp-A{color:#ccd8ff;border-color:rgba(204,216,255,.4)}
.badge.sp-F{color:#f1f4ff;border-color:rgba(241,244,255,.35)}
.badge.sp-G{color:#fff1dc;border-color:rgba(255,241,220,.35)}
.badge.sp-K{color:#ffd9a6;border-color:rgba(255,217,166,.4)}
.badge.sp-M{color:#ffab78;border-color:rgba(255,171,120,.4)}
.specs{padding:4px 16px}
.spec{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(140,165,205,.10)}
.spec .k{font-size:9px;letter-spacing:.18em;color:var(--faint);padding-top:1px}
.spec .v{font-size:11px;letter-spacing:.06em;color:var(--ink);text-align:right}
.insp-actions{display:flex;gap:6px;padding:12px 16px;flex-wrap:wrap}
.insp-hint{font-size:8px;letter-spacing:.2em;color:var(--faint);padding:0 16px 14px}
.empty{padding:44px 20px;text-align:center}
.empty-glyph{font-size:22px;color:var(--faint);margin-bottom:12px}
.empty-t{font-size:10px;letter-spacing:.24em;color:var(--dim)}
.empty-sub{font-size:8.5px;letter-spacing:.18em;color:var(--faint);margin-top:8px}

/* minimap */
#minimap-wrap{right:12px;bottom:46px;padding:8px}
.mm-label{font-size:7.5px;letter-spacing:.3em;color:var(--faint);margin-bottom:6px}
#minimap{display:block;width:168px;height:168px;background:rgba(4,7,13,.72);border:1px solid var(--line);cursor:pointer}

/* bottom bar */
#hud-bottom{position:fixed;bottom:0;left:0;right:0;height:34px;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 16px;background:rgba(5,8,15,.82);border-top:1px solid var(--line);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);font-size:9px;letter-spacing:.16em;color:var(--dim);pointer-events:none}
#hud-bottom .bb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#statusline{color:var(--accent2);flex:1;text-align:center}
#perf{color:var(--faint)}

/* event log */
#eventlog{position:fixed;left:14px;bottom:46px;z-index:11;display:flex;flex-direction:column;gap:5px;pointer-events:none;max-width:320px}
.logline{font-size:9.5px;letter-spacing:.05em;color:var(--dim);padding:5px 10px;background:rgba(8,12,20,.62);
  border-left:2px solid var(--accent2);animation:logIn .3s ease;max-width:320px}
.logline.warn{border-left-color:var(--accent)}
.logline.out{opacity:0;transition:opacity .8s ease}
@keyframes logIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* tooltip */
#tooltip{position:fixed;z-index:30;pointer-events:none;padding:6px 10px;background:rgba(8,12,20,.94);border:1px solid var(--line2);
  border-radius:3px;opacity:0;transition:opacity .12s ease;display:flex;flex-direction:column;gap:2px}
#tooltip .tt-name{font-size:10.5px;letter-spacing:.1em;color:var(--ink)}
#tooltip .tt-sub{font-size:8px;letter-spacing:.18em;color:var(--faint)}

/* command palette */
#palette{position:fixed;inset:0;z-index:40;display:none}
#palette.open{display:block}
.pal-backdrop{position:absolute;inset:0;background:rgba(2,4,8,.6);backdrop-filter:blur(3px)}
.pal-box{position:absolute;top:15vh;left:50%;transform:translateX(-50%);width:min(560px,84vw);background:rgba(9,14,24,.96);
  border:1px solid var(--line2);border-radius:5px;box-shadow:0 24px 80px rgba(0,0,0,.6);animation:palIn .18s ease;overflow:hidden}
@keyframes palIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#pal-input{border:none;border-bottom:1px solid var(--line);background:transparent;font-size:13px;padding:14px 16px;width:100%}
#pal-input:focus{box-shadow:none}
#pal-list{max-height:300px;overflow-y:auto;padding:6px}
.cmd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;font-size:10.5px;letter-spacing:.1em;
  color:var(--dim);border-radius:3px;cursor:pointer;border-left:2px solid transparent}
.cmd.sel{background:rgba(226,176,106,.10);color:var(--ink);border-left-color:var(--accent)}
.cmd.dim{cursor:default;color:var(--faint)}
.cmd-hint{font-size:8px;letter-spacing:.14em;color:var(--faint)}
.pal-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:8px;letter-spacing:.2em;color:var(--faint)}

/* toast */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-6px);z-index:50;padding:7px 16px;
  background:rgba(8,12,20,.94);border:1px solid var(--line2);border-radius:3px;font-size:10px;letter-spacing:.18em;color:var(--ink);
  opacity:0;pointer-events:none;transition:all .25s ease}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* system view chip */
#sys-back{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:12;display:none}

/* view states */
body.view-system #minimap-wrap{display:none}
body.view-system #eventlog{display:none}
body.cinematic #hud-top,body.cinematic #hud-bottom,body.cinematic .panel,body.cinematic #minimap-wrap,body.cinematic #eventlog{
  opacity:0;pointer-events:none;transition:opacity .5s ease}
body.hide-panels #panel-left,body.hide-panels #panel-right{display:none}

/* responsive */
@media (max-width:1280px){ .brand-sub{display:none} #hud-top{gap:12px} }
@media (max-width:1120px){ #panel-left{width:210px} #panel-right{width:258px} }
@media (max-width:980px){
  #panel-left,#panel-right{display:none}
  body.panels-open #panel-left,body.panels-open #panel-right{display:flex}
  .hudstat.hideable{display:none}
  #hud-bottom .hints{display:none}
  .seedbox input{width:84px}
}
@media (prefers-reduced-motion:reduce){ .logline{animation:none} }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="scene"></canvas>

<header id="hud-top">
  <div class="brand">
    <span class="brand-name">ASTRA</span>
    <span class="brand-sub">PROCEDURAL GALAXY EXPLORER</span>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="hudstat"><span class="k">GALAXY SEED</span><span class="v" id="hud-seed" title="Click to copy seed">—</span></div>
  <div class="seedbox">
    <input id="seed-input" type="text" placeholder="CUSTOM SEED" aria-label="Custom galaxy seed" spellcheck="false" autocomplete="off">
    <button class="btn primary" id="btn-gen" title="Generate new galaxy (R)">GENERATE</button>
  </div>
  <div class="grow"></div>
  <div class="hudstat"><span class="k">STARS</span><span class="v" id="hud-stars">—</span></div>
  <div class="hudstat"><span class="k">ZOOM</span><span class="v" id="hud-zoom">100%</span></div>
  <div class="hudstat hideable"><span class="k">SELECTED SYSTEM</span><span class="v" id="hud-sel">—</span></div>
  <div class="tb">
    <button class="icon-btn" id="btn-panels" title="Toggle side panels">PANELS</button>
    <button class="icon-btn" id="btn-tour" title="Tour mode (T)">TOUR</button>
    <button class="icon-btn" id="btn-cine" title="Cinematic mode (C)">CINE</button>
    <button class="icon-btn" id="btn-snd" title="Toggle sound (synthesized, off by default)">SND</button>
    <button class="icon-btn" id="btn-help" title="Command palette (Ctrl/Cmd K)">K</button>
  </div>
</header>

<aside id="panel-left" class="panel" aria-label="Navigation, search and filters">
  <div class="panel-scroll">
    <section class="sec" id="sec-search">
      <h3><span>SEARCH <span class="sec-meta" id="search-count"></span></span><span class="chev">▾</span></h3>
      <div class="body">
        <input id="search-input" type="text" placeholder="NAME OR ID" aria-label="Search stars by name or ID" spellcheck="false" autocomplete="off">
        <button class="btn" id="btn-random" style="width:100%;margin-top:8px">⌖ DISCOVER RANDOM SYSTEM</button>
        <div id="search-results" class="reslist"></div>
      </div>
    </section>
    <section class="sec" id="sec-filters">
      <h3><span>FILTERS</span><span class="chev">▾</span></h3>
      <div class="body">
        <div class="chips" id="spectral-chips" role="group" aria-label="Spectral class filters"></div>
        <label class="check"><input type="checkbox" id="f-hab"> HABITABLE CANDIDATES ONLY</label>
        <label class="check"><input type="checkbox" id="f-multi"> MULTI-STAR SYSTEMS ONLY</label>
        <label class="check"><input type="checkbox" id="f-plan"> SYSTEMS WITH PLANETS ONLY</label>
        <div class="filter-foot"><button class="btn tiny" id="btn-filters-reset">RESET</button></div>
      </div>
    </section>
    <section class="sec" id="sec-bookmarks">
      <h3><span>BOOKMARKS <span class="sec-meta" id="bm-count"></span></span><span class="chev">▾</span></h3>
      <div class="body"><div id="bookmark-list" class="reslist"></div></div>
    </section>
    <section class="sec" id="sec-stats">
      <h3><span>GALAXY STATISTICS</span><span class="chev">▾</span></h3>
      <div class="body" id="stats-body"></div>
    </section>
  </div>
</aside>

<aside id="panel-right" class="panel" aria-label="Object inspector">
  <div id="inspector" class="panel-scroll"></div>
</aside>

<div id="minimap-wrap" class="panel">
  <div class="mm-label">NAV</div>
  <canvas id="minimap" width="168" height="168" aria-label="Galaxy minimap — click to navigate"></canvas>
</div>

<div id="sys-back"><button class="btn" id="btn-sys-back">◀ RETURN TO GALAXY</button></div>

<footer id="hud-bottom">
  <div class="bb" id="coords">X +0000 · Y +0000</div>
  <div class="bb" id="statusline">NOMINAL</div>
  <div class="bb hints">DRAG PAN · WHEEL ZOOM · WASD FLY · 0 RESET · B BOOKMARK · K COMMANDS</div>
  <div class="bb" id="perf">FPS — · ZOOM 100%</div>
</footer>

<div id="eventlog" aria-live="polite"></div>
<div id="tooltip" role="tooltip"></div>

<div id="palette" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="pal-backdrop" data-close></div>
  <div class="pal-box">
    <input id="pal-input" type="text" placeholder="TYPE A COMMAND…" aria-label="Command palette input" spellcheck="false" autocomplete="off">
    <div id="pal-list"></div>
    <div class="pal-foot">↑↓ NAVIGATE · ↵ RUN · ESC CLOSE</div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
'use strict';
/* ============================================================
   ASTRA // PROCEDURAL GALAXY EXPLORER
   utils · PRNG · data · galaxy gen · system gen · camera
   renderer · interaction · UI · palette · sound · main loop
   ============================================================ */

/* ---------------- utils ---------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const fmtInt = n => Math.round(n).toLocaleString('en-US');
const fmt = (n, d) => n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtCoord = v => (v < 0 ? '−' : '+') + String(Math.abs(Math.round(v))).padStart(4, '0');
const $ = id => document.getElementById(id);
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const FONT = '"SF Mono",Menlo,Consolas,monospace';
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function cyrb53(str, seed) {
  seed = seed || 0;
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)) >>> 0;
}

/* seeded PRNG (mulberry32) */
class SeededRandom {
  constructor(seed) { this.state = (typeof seed === 'string') ? cyrb53(seed) : (seed >>> 0); }
  next() {
    let t = (this.state += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return Math.floor(a + (b - a + 1) * this.next()); }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  chance(p) { return this.next() < p; }
  gauss() {
    let u = 0, v = 0;
    while (u === 0) u = this.next();
    while (v === 0) v = this.next();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  }
}

/* ---------------- spectral / naming data ---------------- */
const SPEC = {
  O: { w: 0.004, t: [30000, 45000], m: [16, 40],    col: '#9db8ff' },
  B: { w: 0.032, t: [10000, 30000], m: [2.1, 16],   col: '#a8c0ff' },
  A: { w: 0.120, t: [7500, 10000],  m: [1.4, 2.1],  col: '#ccd8ff' },
  F: { w: 0.220, t: [6000, 7500],   m: [1.04, 1.4], col: '#f1f4ff' },
  G: { w: 0.235, t: [5200, 6000],   m: [0.8, 1.04], col: '#fff1dc' },
  K: { w: 0.235, t: [3700, 5200],   m: [0.45, 0.8], col: '#ffd9a6' },

/* ---------------- camera ---------------- */
class Camera {
  constructor(minZ, maxZ) {
    this.minZ = minZ; this.maxZ = maxZ;
    this.x = 0; this.y = 0; this.z = 1;
    this.tx = 0; this.ty = 0; this.tz = 1;
    this.speed = 0;
  }
  s(base) { return base * this.z; }
  reset() { this.tx = 0; this.ty = 0; this.tz = 1; }
  panBy(dx, dy, s) { this.tx -= dx / s; this.ty -= dy / s; this.x = this.tx; this.y = this.ty; }
  zoomAt(px, py, f, s, base, cx, cy) {
    const wx = this.x + (px - cx) / s, wy = this.y + (py - cy) / s;
    const nz = clamp(this.tz * f, this.minZ, this.maxZ);
    const ns = base * nz;
    this.tz = nz;
    this.tx = wx - (px - cx) / ns;
    this.ty = wy - (py - cy) / ns;
  }
  update(dt) {
    const k = 1 - Math.exp(-dt * 8);
    this.x = lerp(this.x, this.tx, k);
    this.y = lerp(this.y, this.ty, k);
    this.z = Math.exp(lerp(Math.log(this.z), Math.log(this.tz), k));
    this.speed = Math.hypot(this.tx - this.x, this.ty - this.y) * this.s(baseScale);
    if (this === cam && S.traveling && this.speed < 6 && Math.abs(this.z - this.tz) < 0.03) S.traveling = false;
    if (this === sysCam && S.view === 'system' && S.sys) {
      const lim = sysMaxA * 1.7;
      this.tx = clamp(this.tx, -lim, lim);
      this.ty = clamp(this.ty, -lim, lim);
      this.x = clamp(this.x, -lim, lim);
      this.y = clamp(this.y, -lim, lim);
    }
  }
}
const cam = new Camera(Z_MIN, Z_MAX);
const sysCam = new Camera(0.35, 9);

function w2s(wx, wy) { const s = cam.s(baseScale); return [(wx - cam.x) * s + W / 2, (wy - cam.y) * s + H / 2]; }
function s2w(px, py) { const s = cam.s(baseScale); return [cam.x + (px - W / 2) / s, cam.y + (py - H / 2) / s]; }
function flyTo(x, y, z) {
  cam.tx = x; cam.ty = y;
  if (z) cam.tz = clamp(z, Z_MIN, Z_MAX);
  S.traveling = true;
}

/* ---------------- procedural names ---------------- */
function makeName(rng, used) {
  const t = rng.next();
  let name;
  if (t < 0.18) name = rng.pick(NAME_CATS) + '-' + rng.int(100, 99999);
  else if (t < 0.34) name = rng.pick(NAME_PREFIX) + '-' + rng.int(1, 999);
  else if (t < 0.52) name = rng.pick(NAME_GREEK) + ' ' + rng.pick(NAME_CONST);
  else if (t < 0.70) name = rng.pick(NAME_CONST) + ' ' + ROMAN[rng.int(0, ROMAN.length - 1)];
  else if (t < 0.84) name = rng.pick(NAME_PREFIX) + ' ' + rng.pick(NAME_SUFFIX);
  else name = rng.pick(NAME_CATS) + '-' + rng.int(1000, 9999);
  let n = name, k = 2;
  while (used.has(n)) n = name + '-' + (k++);
  used.add(n);
  return n;
}

/* ---------------- planetary system generation ---------------- */
function atmosphereFor(type, temp, rng) {
  switch (type) {
    case 'LAVA': return temp > 1600 ? 'VOLCANIC HAZE' : 'THIN SILICATE';
    case 'OCEAN': return temp < 170 ? 'N₂/O₂ · CRYO' : 'N₂/O₂';
    case 'ROCKY': return rng.pick(['N₂ THIN', 'CO₂ THIN', 'NEGLECTIBLE']);
    case 'DESERT': return rng.pick(['CO₂ DENSE', 'N₂ DRY', 'SULFURIC']);
    case 'SUPEREARTH': return rng.pick(['N₂/O₂ RICH', 'CO₂ DENSE', 'O₂ SUPERIOR']);
    case 'GAS': return rng.pick(['H₂/HE', 'H₂/HE CLOUDS', 'METANE CLOUDS']);
    case 'ICE': return rng.pick(['H₂/HE', 'CH₄ RICH', 'NH₃ CRYO']);
  }
  return 'UNKNOWN';
}

const P_RAD = { LAVA: [0.35, 0.9], ROCKY: [0.45, 1.1], OCEAN: [0.9, 1.35], DESERT: [0.6, 1.2], SUPEREARTH: [1.5, 2.4], GAS: [8, 14], ICE: [3.4, 5.2] };

function makeSystem(star, seed) {
  const rng = new SeededRandom('SYS::' + seed + '::' + star.id);
  const lum = clamp(star.lum, 0.02, 60000);
  const hz = Math.sqrt(lum);
  const n = star.planets;
  const us = [];
  for (let i = 0; i < n; i++) us.push(rng.next());
  us.sort((a, b) => a - b);
  const planets = us.map((u, k) => {
    const a = 0.08 * Math.pow(430, u);
    const ratio = a / hz;
    let type;
    if (ratio < 0.35) type = 'LAVA';
    else if (ratio < 0.75) type = rng.chance(0.55) ? 'ROCKY' : 'DESERT';
    else if (ratio <= 1.35) type = rng.pick(['OCEAN', 'OCEAN', 'OCEAN', 'ROCKY', 'SUPEREARTH', 'DESERT']);
    else if (ratio < 3.4) type = rng.chance(0.5) ? 'GAS' : 'DESERT';
    else type = rng.pick(['GAS', 'GAS', 'ICE', 'ICE', 'ROCKY']);
    const rad = P_RAD[type];
    const r = rng.range(rad[0], rad[1]);
    const temp = 255 * Math.pow(lum, 0.25) / Math.sqrt(a);
    let hab = 0;
    if (ratio >= 0.75 && ratio <= 1.35) hab = Math.round(clamp(rng.range(35, 98), 0, 99));
    else if (ratio >= 0.5 && ratio < 1.6) hab = Math.round(rng.range(0, 10));
    let moons = 0;
    if (type === 'GAS') moons = rng.int(0, 6);
    else if (type === 'ICE') moons = rng.int(1, 5);
    else if (type === 'SUPEREARTH') moons = rng.int(0, 2);
    else if (rng.chance(0.25)) moons = 1;
    const moonArr = [];
    for (let m = 0; m < moons; m++) moonArr.push({ off: rng.next() * TAU, sp: rng.range(1.6, 3.4), dist: rng.range(5, 10) });
    return {
      name: star.name + ' ' + 'bcdefghijklm'[k],
      type, a, r, temp, hab, moons: moonArr,
      atmo: atmosphereFor(type, temp, rng),
      phase: rng.next() * TAU,
      speed: 0.22 / Math.sqrt(a),
      _sx: -1e4, _sy: -1e4, _ss: 3,
    };
  });
  let belt = null;
  if (n >= 3 && rng.chance(0.45)) {
    const i = rng.int(0, n - 2);
    const ba = lerp(planets[i].a, planets[i + 1].a, rng.range(0.35, 0.65));
    const dots = [];
    const bn = rng.int(90, 150);
    for (let i2 = 0; i2 < bn; i2++) dots.push({ ang: rng.next() * TAU, rad: ba * (1 + rng.gauss() * 0.05), sp: 0.05 / Math.sqrt(ba) });
    belt = { a: ba, dots };
  }
  return { star, hz, planets, belt };
}

/* ---------------- galaxy generation ---------------- */
function generateGalaxy(seed) {
  const rng = new SeededRandom('GAL::' + seed);
  const arms = rng.pick([2, 2, 3]);
  const twist = rng.range(4.8, 6.6);
  const N = 2400;
  const armAngle = (r, arm) => arm * (TAU / arms) + (r / GAL_R) * twist;
  const stars = [];
  const usedNames = new Set();
  for (let i = 0; i < N; i++) {
    let x, y;
    if (rng.chance(0.10)) {
      const rb = Math.abs(rng.gauss()) * 72;
      const a = rng.next() * TAU;
      x = Math.cos(a) * rb; y = Math.sin(a) * rb;
    } else {
      const t = Math.pow(rng.next(), 0.72);
      let r = 42 + t * (GAL_R - 42);
      const arm = rng.int(0, arms - 1);
      let a = armAngle(r, arm) + rng.gauss() * (0.10 + 0.30 * (r / GAL_R)) * 0.55;
      r += Math.abs(rng.gauss()) * (12 + 26 * (r / GAL_R)) * 0.5;
      r = Math.min(r, GAL_R * 1.02);
      if (rng.chance(0.07)) {
        a = rng.next() * TAU;
        r = Math.pow(rng.next(), 0.85) * GAL_R * 0.96;
      }
      x = Math.cos(a) * r; y = Math.sin(a) * r;
    }
    const u = rng.next();
    let acc = 0, cls = 'M';
    for (const c of SPEC_ORDER) { acc += SPEC[c].w; if (u <= acc) { cls = c; break; } }
    const spec = SPEC[cls];
    const temp = Math.round(rng.range(spec.t[0], spec.t[1]));
    const mass = +rng.range(spec.m[0], spec.m[1]).toFixed(3);
    const radius = +(Math.pow(mass, 0.85) * rng.range(0.85, 1.15)).toFixed(2);
    const age = +(rng.range(0.05, 12.9) * (cls === 'O' ? 0.25 : cls === 'B' ? 0.55 : 1)).toFixed(2);
    const lum = Math.pow(mass, 3.5) * rng.range(0.7, 1.4);
    const sysType = rng.chance(0.22) ? (rng.chance(0.28) ? 'triple' : 'binary') : 'single';
    const pu = rng.next();
    let planets = 0;
    const PC = [0.34, 0.49, 0.63, 0.73, 0.81, 0.87, 0.92, 0.955, 1.0];
    for (let k = 0; k < 9; k++) if (pu <= PC[k]) { planets = k; break; }
    const dist = Math.hypot(x, y);
    const bright = clamp((lum / 4000) * (140 / Math.max(40, dist)), 0.04, 1);
    const name = makeName(rng, usedNames);
    const sub = rng.int(0, 9);
    const lcls = mass > 2.6 ? rng.pick(['II', 'III', 'IV']) : (rng.chance(0.9) ? 'V' : 'IV');
    stars.push({
      i, id: 'A-' + (1000 + i), x, y, cls, temp, mass, radius, age, lum,
      sysType, planets, hab: 0, dist, bright, name,
      specLabel: cls + sub + ' ' + lcls,
      color: spec.col,
      size: 0.8 + 2.7 * bright,
      alpha: 0.30 + 0.70 * bright,
      phase: rng.next() * TAU,
      twSp: rng.range(0.5, 1.8),
      twAmp: rng.range(0.06, 0.20),
      visible: true,
      _sx: -1e4, _sy: -1e4, _ss: 1,
    });
  }
  for (const st of stars) {
    st._sys = makeSystem(st, seed);
    st.hab = st._sys.planets.filter(p => p.hab > 30).length;
  }
  const NEB_COLS = [[44, 96, 116], [96, 58, 84], [112, 92, 46], [46, 72, 116], [72, 88, 120]];
  const NEB_NAMES = ['TARIS CLOUD', 'VEIL OF NYX', 'CINDER FIELD', 'MERIDIAN NEBULA', 'HALCYON DRIFT', 'SOOT GATE', 'ION REACH'];
  const nebulae = [];
  const nNeb = rng.int(6, 9);
  const nameStart = rng.int(0, NEB_NAMES.length - 1);
  for (let i = 0; i < nNeb; i++) {
    const arm = rng.int(0, arms - 1);
    const r = rng.range(0.22, 0.95) * GAL_R;
    const a = armAngle(r, arm) + rng.gauss() * 0.10;
    nebulae.push({
      x: Math.cos(a) * r, y: Math.sin(a) * r,
      rad: rng.range(60, 170),
      col: rng.pick(NEB_COLS),
      a: rng.range(0.08, 0.16),
      name: i < 3 ? NEB_NAMES[(nameStart + i) % NEB_NAMES.length] : null,
    });
  }
  const coreMass = +rng.range(2.2, 8.4).toFixed(2);
  const core = {
    id: 'CORE', name: 'ASTRA X-1', type: 'nucleus', x: 0, y: 0,
    massM: coreMass,
    spin: +rng.range(0.75, 0.98).toFixed(2),
    horizonKm: Math.round(coreMass * 5.9e6),
    visible: true,
    _sx: -1e4, _sy: -1e4, _ss: 1,
  };
  let multi = 0, plan = 0, pl = 0, hab = 0, o = 0;
  for (const st of stars) {
    if (st.sysType !== 'single') multi++;
    if (st.planets > 0) plan++;
    pl += st.planets; hab += st.hab;
    if (st.cls === 'O') o++;
  }
  const stats = { total: N, arms, multi, planetary: plan, planets: pl, hab, ostars: o, nebulae: nNeb };
  const score = st => (st.cls === 'O' ? 3 : st.cls === 'B' ? 1 : 0) + (st.sysType === 'triple' ? 2 : st.sysType === 'binary' ? 1 : 0) + st.planets * 0.25 + st.hab * 2 + st.bright * 0.5;
  const notable = stars.slice().sort((a, b) => score(b) - score(a)).slice(0, 40);
  const g = { seed, stars, nebulae, core, stats, arms, twist, notable, haze: null };
  g.haze = buildHaze(g, rng);
  return g;
}

/* ---------------- pre-rendered layers ---------------- */
function buildHaze(g, rng) {
  const c = document.createElement('canvas');
  c.width = c.height = HAZE_SIZE;
  const x = c.getContext('2d');
  const s = HAZE_SIZE / HAZE_W;
  x.setTransform(s, 0, 0, s, HAZE_SIZE / 2, HAZE_SIZE / 2);
  // faint arm glow
  for (let arm = 0; arm < g.arms; arm++) {
    x.strokeStyle = 'rgba(150,170,215,0.05)';
    x.lineWidth = 34;
    x.beginPath();
    for (let i = 0; i <= 40; i++) {
      const r = 40 + (i / 40) * (GAL_R - 40);
      const a = arm * (TAU / g.arms) + (r / GAL_R) * g.twist;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i) x.lineTo(px, py); else x.moveTo(px, py);
    }
    x.stroke();
  }
  // nebula clouds
  for (const n of g.nebulae) {
    const grad = x.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.rad);
    grad.addColorStop(0, 'rgba(' + n.col[0] + ',' + n.col[1] + ',' + n.col[2] + ',' + n.a + ')');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = grad;
    x.beginPath(); x.arc(n.x, n.y, n.rad, 0, TAU); x.fill();
  }
  // dust lanes
  x.fillStyle = 'rgba(2,4,8,0.16)';
  for (let arm = 0; arm < g.arms; arm++) {
    for (let i = 0; i < 26; i++) {
      const r = 60 + (i / 26) * (GAL_R - 70);
      const a = arm * (TAU / g.arms) + (r / GAL_R) * g.twist + 0.10;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      const rad = 20 + rng.range(0, 30);
      x.beginPath(); x.ellipse(px, py, rad, rad * 0.45, a, 0, TAU); x.fill();
    }
  }
  // galactic core glow
  const cg = x.createRadialGradient(0, 0, 0, 0, 0, 230);
  cg.addColorStop(0, 'rgba(255,236,200,0.55)');
  cg.addColorStop(0.25, 'rgba(255,214,160,0.28)');
  cg.addColorStop(0.6, 'rgba(190,170,210,0.10)');
  cg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = cg;
  x.beginPath(); x.arc(0, 0, 230, 0, TAU); x.fill();
  return c;
}

function buildMiniBase() {
  const c = document.createElement('canvas');
  c.width = c.height = MS * dpr;
  const x = c.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const k = MS / HAZE_W;
  for (const st of S.galaxy.stars) {
    x.globalAlpha = 0.14 + 0.5 * st.bright;
    x.fillStyle = st.color;
    x.fillRect(MS / 2 + st.x * k, MS / 2 + st.y * k, 1, 1);
  }
  x.globalAlpha = 1;
  const gr = x.createRadialGradient(MS / 2, MS / 2, 0, MS / 2, MS / 2, 7);
  gr.addColorStop(0, 'rgba(255,220,170,0.9)');
  gr.addColorStop(1, 'rgba(255,220,170,0)');
  x.fillStyle = gr;
  x.beginPath(); x.arc(MS / 2, MS / 2, 7, 0, TAU); x.fill();
  return c;
}

function makeNoise() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  const id = x.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 200 + Math.floor(Math.random() * 55);
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
    id.data[i + 3] = 26;
  }
  x.putImageData(id, 0, 0);
  return c;
}

function rebuildBackground() {
  const x = bgBase.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.fillStyle = '#030509';
  x.fillRect(0, 0, bgW, bgH);
  const rng = new SeededRandom('BG::' + (S.galaxy ? S.galaxy.seed : 'default'));
  for (let i = 0; i < 3; i++) {
    const nx = rng.range(0.15, 0.85) * bgW, ny = rng.range(0.15, 0.85) * bgH, nr = rng.range(180, 420);
    const cols = ['30,50,90', '40,30,70', '20,60,70'];
    const gr = x.createRadialGradient(nx, ny, 0, nx, ny, nr);
    gr.addColorStop(0, 'rgba(' + cols[i % 3] + ',0.10)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr;
    x.beginPath(); x.arc(nx, ny, nr, 0, TAU); x.fill();
  }
  for (let i = 0; i < 650; i++) {
    const px = rng.next() * bgW, py = rng.next() * bgH;
    const b = rng.next();
    x.globalAlpha = 0.08 + 0.5 * b * b;
    x.fillStyle = rng.chance(0.12) ? '#ffd9a6' : (rng.chance(0.2) ? '#9db8ff' : '#dfe6f2');
    const sz = b > 0.93 ? 2 : 1;
    x.fillRect(px, py, sz, sz);
  }
  x.globalAlpha = 1;
  for (let i = 0; i < 4; i++) {
    const px = rng.range(0.08, 0.92) * bgW, py = rng.range(0.08, 0.92) * bgH, sz = rng.range(5, 12);
    x.save();
    x.translate(px, py); x.rotate(rng.next() * TAU);
    const gr = x.createRadialGradient(0, 0, 0, 0, 0, sz);
    gr.addColorStop(0, 'rgba(200,210,235,0.35)');
    gr.addColorStop(0.5, 'rgba(160,175,210,0.12)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr;
    x.scale(1, 0.45);
    x.beginPath(); x.arc(0, 0, sz, 0, TAU); x.fill();
    x.restore();
  }
  if (noiseCanvas) {
    x.globalAlpha = 0.05;
    x.fillStyle = x.createPattern(noiseCanvas, 'repeat');
    x.fillRect(0, 0, bgW, bgH);
    x.globalAlpha = 1;
  }
  const vx = bgW / 2, vy = bgH / 2, vr = Math.hypot(vx, vy);
  const vg = x.createRadialGradient(vx, vy, vr * 0.35, vx, vy, vr);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  x.fillStyle = vg;
  x.fillRect(0, 0, bgW, bgH);
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function makeSprite(color) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.16, hexA(color, 0.9));
  g.addColorStop(0.42, hexA(color, 0.30));
  g.addColorStop(1, hexA(color, 0));
  x.fillStyle = g;
  x.fillRect(0, 0, 64, 64);
  return c;
}
function buildSprites() {
  for (const c of SPEC_ORDER) SPR[c] = makeSprite(SPEC[c].col);
  SPR.W = makeSprite('#ffffff');
  SPR.WARM = makeSprite('#ffd9a6');
}

/* ---------------- renderer: background ---------------- */
function drawBackground(t) {
  bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const dx = REDUCED ? 0 : Math.sin(t * 0.05) * 5;
  const dy = REDUCED ? 0 : Math.cos(t * 0.043) * 5;
  bgCtx.drawImage(bgBase, -12 + dx, -12 + dy, bgW, bgH);
}

/* ---------------- renderer: galaxy ---------------- */
function renderGalaxy(t, alpha) {
  const x = sceneCtx;
  const g = S.galaxy;
  const s = cam.s(baseScale);
  x.setTransform(s * dpr, 0, 0, s * dpr, (W / 2 - cam.x * s) * dpr, (H / 2 - cam.y * s) * dpr);
  x.globalAlpha = alpha * 0.95;
  x.drawImage(g.haze, -HAZE_W / 2, -HAZE_W / 2, HAZE_W, HAZE_W);
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const st of g.stars) {
    if (!st.visible) continue;
    const sx = (st.x - cam.x) * s + W / 2, sy = (st.y - cam.y) * s + H / 2;
    st._sx = sx; st._sy = sy;
    if (sx < -40 || sy < -40 || sx > W + 40 || sy > H + 40) continue;
    const ss = clamp(st.size * (0.7 + 0.5 * Math.log2(cam.z + 1)), 0.7, 7);
    st._ss = ss;
    let a = st.alpha * alpha;
    if (ss > 1.3) a *= 1 + st.twAmp * Math.sin(t * st.twSp + st.phase);
    if (st === S.hover) a = Math.min(1, a * 1.5 + 0.15);
    if (st === S.sel) a = Math.min(1, a * 1.25 + 0.2);
    x.globalAlpha = clamp(a, 0, 1);
    if (ss < 1.7) {
      x.fillStyle = st.color;
      x.fillRect(sx - 0.5, sy - 0.5, Math.max(1, ss), Math.max(1, ss));
    } else {
      const d = ss * 4.5;
      x.drawImage(SPR[st.cls], sx - d / 2, sy - d / 2, d, d);
    }
  }
  drawCore(x, t, alpha);
  // nebula + core labels
  if (S.labelsOn) {
    x.font = '9px ' + FONT;
    for (const n of g.nebulae) {
      if (!n.name) continue;
      const sx = (n.x - cam.x) * s + W / 2, sy = (n.y - cam.y) * s + H / 2;
      if (sx < -80 || sy < -40 || sx > W + 80 || sy > H + 40) continue;
      if (cam.z < 2.2) continue;
      x.globalAlpha = alpha * 0.55;
      x.fillStyle = '#8fa3c8';
      x.fillText(n.name, sx - 16, sy + n.rad * s * 0.5 + 12);
    }
    const cxs = (0 - cam.x) * s + W / 2, cys = (0 - cam.y) * s + H / 2;
    if (cxs > -60 && cys > -60 && cxs < W + 60 && cys < H + 60 && cam.z > 1.1) {
      x.globalAlpha = alpha * 0.85;
      x.fillStyle = '#e8c9a0';
      x.fillText(g.core.name, cxs + 10, cys - 10);
    }
  }
  x.globalAlpha = 1;
  // hover marker
  if (S.hover && S.view === 'galaxy' && S.hover !== S.sel) {
    const hx = S.hover._sx, hy = S.hover._sy;
    if (hx > -20 && hy > -20 && hx < W + 20 && hy < H + 20) {
      x.globalAlpha = alpha * 0.5;
      x.strokeStyle = 'rgba(160,190,230,0.8)';
      x.lineWidth = 1;
      x.beginPath(); x.arc(hx, hy, 7, 0, TAU); x.stroke();
    }
  }
  // selection reticle
  if (S.sel && S.sel.visible !== false) {
    const sx = (S.sel.x - cam.x) * s + W / 2, sy = (S.sel.y - cam.y) * s + H / 2;
    if (sx > -60 && sy > -60 && sx < W + 60 && sy < H + 60) drawReticle(x, sx, sy, t, alpha);
  }
  // LOD labels
  if (S.labelsOn) for (const st of computeLabels()) drawStarLabel(x, st, alpha);
  // travel streaks
  if (!REDUCED && cam.speed > 60 && alpha > 0.6) drawStreaks(x, clamp(cam.speed / 900, 0, 1));
  // regeneration scanline
  if (S.regen) drawScan(x);
  x.globalAlpha = 1;
}

function drawCore(x, t, alpha) {
  const s = cam.s(baseScale);
  const cx = (0 - cam.x) * s + W / 2, cy = (0 - cam.y) * s + H / 2;
  if (cx < -260 || cy < -260 || cx > W + 260 || cy > H + 260) return;
  x.globalAlpha = alpha;
  const gl = 120 * clamp(Math.sqrt(s) * 2.2, 0.8, 2.6);
  x.drawImage(SPR.WARM, cx - gl / 2, cy - gl / 2, gl, gl);
  x.lineWidth = 1;
  for (let i = 0; i < 26; i++) {
    const ang = t * 0.5 + i * (TAU / 26);
    const r0 = 9 + 3 * Math.sin(t * 1.4 + i * 1.7);
    const len = 4 + 3 * Math.sin(t * 2.1 + i * 0.9);
    const a2 = 0.10 + 0.22 * (0.5 + 0.5 * Math.sin(ang * 2 + t * 1.8));
    x.strokeStyle = 'rgba(255,196,130,' + (a2 * alpha).toFixed(3) + ')';
    x.beginPath();
    x.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
    x.lineTo(cx + Math.cos(ang) * (r0 + len), cy + Math.sin(ang) * (r0 + len));
    x.stroke();
  }
  x.fillStyle = '#020308';
  x.beginPath(); x.arc(cx, cy, 4.5, 0, TAU); x.fill();
  x.strokeStyle = 'rgba(255,224,178,' + (0.75 * alpha).toFixed(3) + ')';
  x.beginPath(); x.arc(cx, cy, 5.4, 0, TAU); x.stroke();
  x.globalAlpha = 1;
}

function drawReticle(x, sx, sy, t, alpha) {
  const r = 13 + 1.5 * Math.sin(t * 2.2);
  x.lineWidth = 1;
  x.strokeStyle = 'rgba(226,176,106,' + (0.85 * alpha).toFixed(3) + ')';
  for (let k = 0; k < 4; k++) {
    const a0 = t * 0.8 + k * (Math.PI / 2);
    x.beginPath(); x.arc(sx, sy, r, a0, a0 + Math.PI / 3.4); x.stroke();
  }
  x.strokeStyle = 'rgba(226,176,106,' + (0.28 * alpha).toFixed(3) + ')';
  x.beginPath(); x.arc(sx, sy, r + 4, 0, TAU); x.stroke();
}

function computeLabels() {
  const out = [];
  const g = S.galaxy;
  for (const st of g.stars) {
    if (!st.visible) continue;
    if (st._sx < -20 || st._sy < -20 || st._sx > W + 20 || st._sy > H + 20) continue;
    if (cam.z > 0.9 && st.bright > 0.80) out.push(st);
    else if (cam.z > 4 && st.bright > 0.62) out.push(st);
  }
  out.sort((a, b) => b.bright - a.bright);
  const top = out.slice(0, 7);
  let res = top;
  if (cam.z > 9) {
    const seen = new Set(top.map(s => s.i));
    const near = g.stars
      .filter(st => st.visible && !seen.has(st.i) && st._sx > 0 && st._sy > 0 && st._sx < W && st._sy < H)
      .map(st => [st, (st._sx - W / 2) * (st._sx - W / 2) + (st._sy - H / 2) * (st._sy - H / 2)])
      .sort((a, b) => a[1] - b[1]).slice(0, 5).map(o => o[0]);
    res = top.concat(near);
  }
  if (S.sel && S.sel.visible && !res.includes(S.sel)) res.push(S.sel);
  if (S.hover && S.hover !== S.sel && S.hover.visible && !res.includes(S.hover)) res.push(S.hover);
  return res.slice(0, 13);
}

function drawStarLabel(x, st, alpha) {
  x.globalAlpha = alpha * 0.8;
  x.strokeStyle = 'rgba(140,165,205,0.4)';
  x.lineWidth = 1;
  x.beginPath(); x.moveTo(st._sx + 3, st._sy - 3); x.lineTo(st._sx + 10, st._sy - 10); x.stroke();
  x.fillStyle = 'rgba(216,221,232,0.9)';
  x.font = '9px ' + FONT;
  x.fillText(st.name, st._sx + 12, st._sy - 9);
  x.globalAlpha = alpha * 0.4;
  x.fillStyle = '#7c8798';
  x.font = '8px ' + FONT;
  x.fillText(st.id, st._sx + 12, st._sy + 1);
}

function drawStreaks(x, k) {
  const n = Math.floor(10 + 22 * k);
  x.lineWidth = 1;
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * TAU;
    const d0 = 24 + Math.random() * 80;
    const len = 30 + Math.random() * 150 * k;
    const px = W / 2 + Math.cos(ang) * d0, py = H / 2 + Math.sin(ang) * d0;
    x.strokeStyle = 'rgba(160,190,235,' + ((0.05 + 0.10 * Math.random()) * k).toFixed(3) + ')';
    x.beginPath();
    x.moveTo(px, py);
    x.lineTo(px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
}

function drawScan(x) {
  const k = clamp((performance.now() - S.regen.t0) / 900, 0, 1);
  const y = (k * 1.3 - 0.15) * H;
  const gr = x.createLinearGradient(0, y - 46, 0, y);
  gr.addColorStop(0, 'rgba(111,181,168,0)');
  gr.addColorStop(1, 'rgba(111,181,168,0.10)');
  x.fillStyle = gr;
  x.fillRect(0, y - 46, W, 46);
  x.fillStyle = 'rgba(111,181,168,0.5)';
  x.fillRect(0, y, W, 1);
  x.fillStyle = 'rgba(160,200,190,0.8)';
  x.font = '9px ' + FONT;
  x.fillText('SCANNING SECTOR // REBUILDING STARFIELD', 16, y - 8);
}

/* ---------------- renderer: planetary system ---------------- */
function computeSysBase() {
  if (!S.sys) { sysBase = 1; sysMaxA = 4; return; }
  const g = S.sys;
  let m = 4;
  for (const p of g.planets) m = Math.max(m, p.a);
  m = Math.max(m, g.hz * 1.45);
  sysMaxA = m;
  sysBase = Math.min(W, H) / (2 * m * 1.18);
}

function renderSystem(t, alpha) {
  if (!S.sys) return;
  const x = sceneCtx;
  const s = sysBase * sysCam.z;
  const ox = W / 2 - sysCam.x * s, oy = H / 2 - sysCam.y * s;
  const g = S.sys;
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.globalAlpha = alpha;
  // habitable zone band
  const hzA = 0.75 * g.hz * s, hzB = 1.35 * g.hz * s;
  x.strokeStyle = 'rgba(110,200,160,0.06)';
  x.lineWidth = Math.max(1, hzB - hzA);
  x.beginPath(); x.arc(ox, oy, (hzA + hzB) / 2, 0, TAU); x.stroke();
  // orbit rings
  x.lineWidth = 1;
  x.strokeStyle = 'rgba(150,175,215,0.12)';
  for (const p of g.planets) {
    x.beginPath(); x.arc(ox, oy, p.a * s, 0, TAU); x.stroke();
  }
  // asteroid belt
  if (g.belt) {
    x.fillStyle = 'rgba(170,160,140,0.5)';
    for (const d of g.belt.dots) {
      const a = d.ang + t * d.sp;
      const px = ox + Math.cos(a) * d.rad * s, py = oy + Math.sin(a) * d.rad * s;
      x.fillRect(px, py, 1.3, 1.3);
    }
  }
  // star
  const starSize = Math.min(W, H) * 0.16;
  x.drawImage(SPR[g.star.cls], ox - starSize / 2, oy - starSize / 2, starSize, starSize);
  x.drawImage(SPR.W, ox - starSize * 0.30, oy - starSize * 0.30, starSize * 0.6, starSize * 0.6);
  x.font = '10px ' + FONT;
  x.fillStyle = 'rgba(216,221,232,0.85)';
  x.textAlign = 'center';
  x.fillText(g.star.name.toUpperCase(), ox, oy + starSize * 0.42 + 16);
  x.textAlign = 'left';
  // planets
  for (const p of g.planets) {
    const ang = p.phase + t * p.speed;
    const px = ox + Math.cos(ang) * p.a * s, py = oy + Math.sin(ang) * p.a * s;
    p._sx = px; p._sy = py;
    const baseR = p.type === 'GAS' ? 2.6 : p.type === 'ICE' ? 2.2 : 1.7;
    const pr = clamp(p.r * baseR, 2, 15);
    p._ss = pr;
    if (px < -30 || py < -30 || px > W + 30 || py > H + 30) continue;
    if (S.hoverP === p) {
      x.strokeStyle = 'rgba(160,190,230,0.7)';
      x.lineWidth = 1;
      x.beginPath(); x.arc(px, py, pr + 4, 0, TAU); x.stroke();
    }
    x.fillStyle = PTYPE[p.type].col;
    x.beginPath(); x.arc(px, py, pr, 0, TAU); x.fill();
    if (p.type === 'GAS' || p.type === 'ICE') {
      x.globalAlpha = alpha * 0.25;
      x.beginPath(); x.arc(px, py, pr * 1.7, 0, TAU); x.fill();
      x.globalAlpha = alpha;
    }
    const angToStar = Math.atan2(oy - py, ox - px);
    x.globalAlpha = alpha * 0.35;
    x.fillStyle = '#04060c';
    x.beginPath(); x.arc(px, py, pr, angToStar - 1.15, angToStar + 1.15); x.fill();
    x.globalAlpha = alpha;
    x.fillStyle = '#b9c2d4';
    for (const m of p.moons) {
      const ma = m.off + t * m.sp;
      x.globalAlpha = alpha * 0.75;
      x.beginPath(); x.arc(px + Math.cos(ma) * m.dist, py + Math.sin(ma) * m.dist, 1.2, 0, TAU); x.fill();
    }
    x.globalAlpha = alpha;
  }
  // planet labels
  if (sysCam.z > 1.15) {
    x.font = '9px ' + FONT;
    for (const p of g.planets) {
      if (p._sx < 0 || p._sy < 0 || p._sx > W || p._sy > H) continue;
      x.globalAlpha = alpha * 0.7;
      x.fillStyle = '#aeb8cc';
      x.fillText(p.name, p._sx + p._ss + 4, p._sy + 3);
    }
  }
  // selection reticle
  if (S.sysSel) {
    const p = S.sysSel;
    if (p._sx > -20 && p._sy > -20 && p._sx < W + 20 && p._sy < H + 20) drawReticle(x, p._sx, p._sy, t, alpha);
  }
  x.globalAlpha = 1;
}

/* ---------------- picking ---------------- */
function pickStar(px, py) {
  const g = S.galaxy;
  let best = null, bd = Infinity;
  for (const st of g.stars) {
    if (!st.visible) continue;
    const dx = st._sx - px, dy = st._sy - py;
    const rr = Math.max(6, st._ss * 2.2);
    if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = st; }
  }
  const s = cam.s(baseScale);
  const cx = (0 - cam.x) * s + W / 2, cy = (0 - cam.y) * s + H / 2;
  const ddx = cx - px, ddy = cy - py;
  if (ddx * ddx + ddy * ddy < 18 * 18) best = g.core;
  return best;
}
function pickPlanet(px, py) {
  if (!S.sys) return null;
  let best = null, bd = Infinity;
  for (const p of S.sys.planets) {
    const dx = p._sx - px, dy = p._sy - py;
    const rr = Math.max(9, p._ss * 2);
    if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

/* ---------------- selection & system view ---------------- */
function selectStar(st, opts) {
  opts = opts || {};
  S.sel = st;
  S.sysSel = null;
  renderInspector();
  updateFastHUD();
  if (opts.fly) {
    S.travelName = st.name;
    flyTo(st.x, st.y, opts.zoom || 12);
  }
  Sound.blip(740);
  log(st.name + ' — target locked.');
}
function openSystem(star) {
  if (!star || star.planets === 0) { toast('NO PLANETARY BODIES IN THIS SYSTEM'); return; }
  S.view = 'system';
  S.sys = star._sys;
  S.sysSel = null; S.hoverP = null;
  sysCam.x = sysCam.y = sysCam.tx = sysCam.ty = 0;
  sysCam.z = sysCam.tz = 1;
  computeSysBase();
  document.body.classList.add('view-system');
  renderSystemStarInspector();
  Sound.blip(520);
  log('Entering system ' + star.name + ' — ' + star.planets + ' bodies on stable orbits.');
}
function closeSystem() {
  if (S.view !== 'system') return;
  S.view = 'galaxy';
  S.sysSel = null; S.hoverP = null;
  document.body.classList.remove('view-system');
  renderInspector();
  Sound.blip(390);
}

/* ---------------- galaxy lifecycle ---------------- */
function normalizeSeed(s) {
  let t = (s || '').toUpperCase().replace(/[^A-Z0-9-]/g, '-').replace(/-{2,}/g, '-').replace(/^-+|-+$/g, '').slice(0, 16);
  if (!t) t = SEED_PREFIX[Math.floor(Math.random() * SEED_PREFIX.length)] + '-' + (10000 + Math.floor(Math.random() * 90000));
  return t;
}
function regenerateGalaxy(seedStr, after) {
  const seed = normalizeSeed(seedStr);
  S.regen = { t0: performance.now(), seed, done: false, after: after || null };
  log('Generating galaxy ' + seed + '…');
  if (S.view === 'system') closeSystem();
}
function stepRegen(nowMs) {
  const r = S.regen;
  const k = (nowMs - r.t0) / 900;
  if (!r.done && k >= 0.45) { r.done = true; buildGalaxy(r.seed, r.after); }
  if (k >= 1) S.regen = null;
}
function buildGalaxy(seed, after) {
  S.galaxy = generateGalaxy(seed);
  S.miniBase = buildMiniBase();
  S.sys = null; S.hover = null; S.hoverP = null;
  S.sel = null;
  cam.reset();
  rebuildBackground();
  renderStats();
  renderBookmarks();
  renderInspectorEmpty();
  searchInput.value = '';
  renderSearchResults([]);
  hudSeed.textContent = seed;
  applyFilters();
  if (after) {
    const st = S.galaxy.stars.find(s => s.id === after);
    if (st) selectStar(st, { fly: true, zoom: 12 });
  }
}

/* ---------------- filters ---------------- */
const filters = { spectral: new Set(SPEC_ORDER), hab: false, multi: false, plan: false };
function buildChips() {
  spectralChips.innerHTML = SPEC_ORDER.map(c =>
    '<button class="chip on" data-c="' + c + '" style="--c:' + SPEC[c].col + '" aria-label="Toggle spectral class ' + c + '" aria-pressed="true">' + c + '</button>'
  ).join('');
}
function applyFilters() {
  const g = S.galaxy;
  if (!g) return;
  let vis = 0;
  for (const st of g.stars) {
    let v = filters.spectral.has(st.cls);
    if (v && filters.hab) v = st.hab > 0;
    if (v && filters.multi) v = st.sysType !== 'single';
    if (v && filters.plan) v = st.planets > 0;
    st.visible = v;
    if (v) vis++;
  }
  S.visibleCount = vis;
  hudStars.textContent = fmtInt(vis);
}

/* ---------------- UI: HUD / stats / inspector ---------------- */
function statusText() {
  if (S.regen) return 'SCANNING… REBUILDING STARFIELD';
  if (S.view === 'system') return 'SYSTEM // ' + (S.sys ? S.sys.star.name : '');
  if (S.traveling) return 'TRANSITING → ' + (S.travelName || 'TARGET');
  return 'NOMINAL';
}
function updateFastHUD() {
  const z = S.view === 'system' ? sysCam.z : cam.z;
  const zp = Math.round(z * 100) + '%';
  hudZoom.textContent = zp;
  hudSel.textContent = S.sel ? S.sel.name : '—';
  statusline.textContent = statusText();
  perfEl.textContent = 'FPS ' + fps + ' · ZOOM ' + zp + ' · ' + fmtInt(S.visibleCount) + '/' + fmtInt(S.galaxy.stats.total) + ' STARS';
  hudStars.textContent = fmtInt(S.visibleCount);
  const inspBtn = inspectorEl.querySelector('[data-act="inspect"]');
  if (inspBtn) inspBtn.disabled = cam.z < 10;
}
function specRow(k, v) {
  return '<div class="spec"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
}
function renderStats() {
  const st = S.galaxy.stats;
  const rows = [
    ['TOTAL STARS', fmtInt(st.total)],
    ['SPIRAL ARMS', st.arms],
    ['MULTI-STAR SYSTEMS', fmtInt(st.multi)],
    ['PLANETARY SYSTEMS', fmtInt(st.planetary)],
    ['PLANETS', fmtInt(st.planets)],
    ['HABITABLE CANDIDATES', fmtInt(st.hab)],
    ['RARE O-CLASS', st.ostars],
    ['NEBULA REGIONS', st.nebulae],
  ];
  statsBody.innerHTML = rows.map(r => specRow(r[0], r[1])).join('');
}
function renderInspectorEmpty() {
  inspectorEl.innerHTML =
    '<div class="empty">' +
    '<div class="empty-glyph">◌</div>' +
    '<div class="empty-t">NO TARGET LOCKED</div>' +
    '<div class="empty-sub">SELECT A STAR TO BEGIN INSPECTION</div>' +
    '</div>';
}
function renderInspector() {
  const sel = S.sel;
  if (!sel) { renderInspectorEmpty(); return; }

/* ---------------- toast / event log / ambience ---------------- */
let toastTimer = null;
function toast(msg) {

  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}
function log(msg, kind) {

  el.className = 'logline' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  eventlog.appendChild(el);
  while (eventlog.children.length > 7) eventlog.removeChild(eventlog.firstChild);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 900); }, 8000);
}

function setTour(on) {

    S.tourIdx = 0;

function stepTour(nowMs) {
  if (!S.tour || S.view !== 'galaxy' || S.regen || S.traveling || nowMs < S.tourNext) return;
  const list = S.galaxy.notable;
  if (!list || !list.length) return;
  const st = list[S.tourIdx % list.length];
  S.tourIdx++;
  S.travelName = st.name;
  flyTo(st.x, st.y, 12);
  selectStar(st, { fly: false });
  log('Tour stop ' + (S.tourIdx) + ' — ' + st.name + ' (' + st.cls + '-class).');
  S.tourNext = nowMs + 14000;
}
function discoverRandom() {
  const g = S.galaxy;
  if (!g) return;
  const pool = g.stars.filter(s => s.visible);
  let st;
  if (Math.random() < 0.6 && g.notable.length) st = g.notable[Math.floor(Math.random() * g.notable.length)];
  else st = (pool.length ? pool : g.stars)[Math.floor(Math.random() * (pool.length || g.stars.length))];
  selectStar(st, { fly: true, zoom: 13 });
  log('Random survey target: ' + st.name + ' — ' + st.cls + '-class, ' + st.planets + ' planets.', 'warn');

function copySeed() {
  const seed = S.galaxy.seed;
  const done = () => toast('SEED ' + seed + ' COPIED');

    navigator.clipboard.writeText(seed).then(done, () => fallbackCopy(seed, done));

function fallbackCopy(text, done) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); done();

}

/* ---------------- command palette ---------------- */
const COMMANDS = [
  { label: 'Search star', hint: 'FOCUS SEARCH', fn: () => { Palette.close(); searchInput.focus(); searchInput.select(); } },
  { label: 'Generate new galaxy', hint: 'R', fn: () => { Palette.close(); regenerateGalaxy(''); } },
  { label: 'Reset camera', hint: '0', fn: () => { Palette.close(); cam.reset(); S.traveling = false; } },
  { label: 'Go to galactic core', hint: 'NUCLEUS', fn: () => { Palette.close(); selectStar(S.galaxy.core, { fly: true, zoom: 6 }); } },
  { label: 'Discover random system', hint: 'RANDOM', fn: () => { Palette.close(); discoverRandom(); } },
  { label: 'Toggle minimap', hint: 'M', fn: () => { Palette.close(); toggleMinimap(); } },
  { label: 'Toggle star labels', hint: 'L', fn: () => { Palette.close(); S.labelsOn = !S.labelsOn; } },
  { label: 'Toggle tour mode', hint: 'T', fn: () => { Palette.close(); setTour(!S.tour); } },
  { label: 'Toggle cinematic mode', hint: 'C', fn: () => { Palette.close(); toggleCinematic(); } },
  { label: 'Toggle sound', hint: 'AUDIO', fn: () => { Palette.close(); Sound.set(!Sound.on); btnSnd.classList.toggle('active', Sound.on); } },
];
const Palette = {
  opened: false, items: [], idx: 0,
  open() {
    if (this.opened) return;
    this.opened = true;
    palEl.classList.add('open');
    palInput.value = '';
    this.idx = 0;
    this.render();
    palInput.focus();
  },
  close() {
    if (!this.opened) return;
    this.opened = false;
    palEl.classList.remove('open');
  },
  toggle() { this.opened ? this.close() : this.open(); },
  render() {
    const q = palInput.value.trim().toLowerCase();
    let items = COMMANDS.filter(c => !q || c.label.toLowerCase().includes(q));
    if (q.length >= 2 && S.galaxy) {
      const hits = S.galaxy.stars.filter(st => st.visible && st.name.toLowerCase().includes(q)).slice(0, 3);
      items = hits.map(h => ({
        label: 'Jump to ' + h.name,
        hint: h.cls + ' · ' + h.id,
        fn: () => { this.close(); selectStar(h, { fly: true, zoom: 12 }); }
      })).concat(items);
    }
    this.items = items;
    this.idx = clamp(this.idx, 0, Math.max(0, items.length - 1));
    palList.innerHTML = items.length
      ? items.map((c, i) =>
          '<div class="cmd' + (i === this.idx ? ' sel' : '') + '" data-i="' + i + '"><span>' + c.label +
          '</span><span class="cmd-hint">' + c.hint + '</span></div>').join('')
      : '<div class="cmd dim">NO COMMANDS MATCH</div>';
  },
  key(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); this.idx = (this.idx + 1) % Math.max(1, this.items.length); this.render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); this.idx = (this.idx - 1 + Math.max(1, this.items.length)) % Math.max(1, this.items.length); this.render(); }
    else if (e.key === 'Enter') { e.preventDefault(); const c = this.items[this.idx]; if (c) c.fn(); }
    else if (e.key === 'Escape') { e.preventDefault(); this.close(); }
  }
};

/* ---------------- synthesized sound (off by default) ---------------- */
const Sound = {
  ctx: null, on: false, master: null, amb: null,
  ensure() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 1;
    this.master.connect(this.ctx.destination);
    const o1 = this.ctx.createOscillator(), o2 = this.ctx.createOscillator();
    const lp = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    o1.type = 'sine'; o2.type = 'sine';
    o1.frequency.value = 54; o2.frequency.value = 54.7;
    lp.type = 'lowpass'; lp.frequency.value = 220;
    g.gain.value = 0;
    o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.master);
    const lfo = this.ctx.createOscillator(), lg = this.ctx.createGain();
    lfo.frequency.value = 0.07; lg.gain.value = 0.5;
    lfo.connect(lg); lg.connect(g.gain);
    o1.start(); o2.start(); lfo.start();
    this.amb = g;
  },
  set(on) {
    this.on = !!on;
    if (!this.on) { if (this.amb) this.amb.gain.setTargetAtTime(0, this.ctx.currentTime, 0.3); return; }
    this.ensure();
    if (!this.ctx) return;
    this.ctx.resume();
    this.amb.gain.setTargetAtTime(0.05, this.ctx.currentTime, 0.6);
  },
  blip(f, d) {
    if (!this.on || !this.ctx) return;
    f = f || 880; d = d || 0.09;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + d + 0.02);
  }
};

/* ---------------- tooltip ---------------- */
function showTooltip(a, b, x, y) {
  tooltip.innerHTML = '<div class="tt-name">' + a + '</div>' + (b ? '<div class="tt-sub">' + b + '</div>' : '');
  tooltip.style.display = 'block';
  const r = tooltip.getBoundingClientRect();
  let tx = x + 14, ty = y + 16;
  if (tx + r.width > W - 8) tx = x - r.width - 12;
  if (ty + r.height > H - 8) ty = y - r.height - 12;
  tooltip.style.left = tx + 'px';
  tooltip.style.top = ty + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }

/* ---------------- hover / click ---------------- */
function onHover(x, y) {
  if (S.view === 'galaxy') {
    const st = pickStar(x, y);
    S.hover = st && st.type !== 'nucleus' ? st : (st ? st : null);
    if (st) {
      sceneC.style.cursor = 'pointer';
      const sub = st.type === 'nucleus' ? 'GALACTIC NUCLEUS' : st.cls + '-CLASS · ' + st.sysType.toUpperCase();
      showTooltip(st.name, sub, x, y);
    } else {
      sceneC.style.cursor = 'default';
      hideTooltip();
    }
    const w = s2w(x, y);
    coordsEl.textContent = 'X ' + fmtCoord(w[0]) + '  ·  Y ' + fmtCoord(w[1]);
  } else if (S.sys) {
    const p = pickPlanet(x, y);
    S.hoverP = p;
    if (p) {
      sceneC.style.cursor = 'pointer';
      showTooltip(p.name, PTYPE[p.type].label, x, y);
    } else {
      sceneC.style.cursor = 'default';
      hideTooltip();
    }
    coordsEl.textContent = 'FRAME // ' + S.sys.star.name + ' · AU';
  }
}
function handleClick(x, y) {
  if (S.view === 'galaxy') {
    const st = pickStar(x, y);
    if (st) selectStar(st, { fly: false });
    else { S.sel = null; renderInspector(); updateFastHUD(); }
  } else if (S.sys) {
    const p = pickPlanet(x, y);
    if (p) { S.sysSel = p; renderPlanetInspector(p); Sound.blip(660); }
    else { S.sysSel = null; renderSystemStarInspector(); }
  }
}
function handlePinch() {
  if (activePointers.size !== 2) return;
  const pts = [...activePointers.values()];
  const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  const mx = (pts[0].x + pts[1].x) / 2, my = (pts[0].y + pts[1].y) / 2;
  if (pinchLast > 0) {
    const f = d / pinchLast;
    if (S.view === 'system') sysCam.zoomAt(mx, my, f, sysCam.s(sysBase), sysBase, W / 2, H / 2);
    else cam.zoomAt(mx, my, f, cam.s(baseScale), baseScale, W / 2, H / 2);
  }
  pinchLast = d;
}

/* ---------------- input binding ---------------- */
function bindUI() {
  /* scene pointer handling */
  sceneC.addEventListener('pointerdown', e => {
    activePointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
    try { sceneC.setPointerCapture(e.pointerId); } catch (err) {}
    if (activePointers.size === 1) {
      pDown = { x: e.offsetX, y: e.offsetY, lx: e.offsetX, ly: e.offsetY, moved: 0, t0: performance.now() };
      if (S.tour) setTour(false);
    } else { pDown = null; pinchLast = 0; }
  });
  sceneC.addEventListener('pointermove', e => {
    const pt = activePointers.get(e.pointerId);
    if (pt) { pt.x = e.offsetX; pt.y = e.offsetY; }
    if (activePointers.size === 2) { handlePinch(); return; }
    if (pDown) {
      const dx = e.offsetX - pDown.lx, dy = e.offsetY - pDown.ly;
      pDown.moved += Math.abs(dx) + Math.abs(dy);
      pDown.lx = e.offsetX; pDown.ly = e.offsetY;
      if (pDown.moved > 2) {
        hideTooltip();
        if (S.view === 'system') sysCam.panBy(dx, dy, sysCam.s(sysBase));
        else cam.panBy(dx, dy, cam.s(baseScale));
      }
    } else {
      onHover(e.offsetX, e.offsetY);
    }
  });
  const endPointer = e => {
    activePointers.delete(e.pointerId);
    if (pDown && pDown.moved < 6 && performance.now() - pDown.t0 < 600) {
      handleClick(pDown.x, pDown.y);
    }
    if (activePointers.size < 2) pinchLast = 0;
    if (activePointers.size === 0) pDown = null;
  };
  sceneC.addEventListener('pointerup', endPointer);
  sceneC.addEventListener('pointercancel', endPointer);
  sceneC.addEventListener('pointerleave', () => {
    if (pDown) return;
    S.hover = null; S.hoverP = null; hideTooltip();
  });
  sceneC.addEventListener('wheel', e => {
    e.preventDefault();
    const f = Math.exp(-e.deltaY * 0.0016);
    if (S.view === 'system') sysCam.zoomAt(e.offsetX, e.offsetY, f, sysCam.s(sysBase), sysBase, W / 2, H / 2);
    else cam.zoomAt(e.offsetX, e.offsetY, f, cam.s(baseScale), baseScale, W / 2, H / 2);
    hideTooltip();
  }, { passive: false });
  sceneC.addEventListener('contextmenu', e => e.preventDefault());

  /* minimap navigation */
  miniC.addEventListener('pointerdown', e => {
    if (!S.galaxy) return;
    const r = miniC.getBoundingClientRect();
    const k = MS / HAZE_W;
    const wx = (e.clientX - r.left - MS / 2) / k;
    const wy = (e.clientY - r.top - MS / 2) / k;
    S.travelName = 'SECTOR ' + fmtInt(wx) + ',' + fmtInt(wy);
    flyTo(wx, wy);
  });

  /* top hud */
  btnGen.addEventListener('click', () => regenerateGalaxy(seedInput.value));
  seedInput.addEventListener('keydown', e => { if (e.key === 'Enter') regenerateGalaxy(seedInput.value); });
  hudSeed.addEventListener('click', copySeed);
  btnTour.addEventListener('click', () => setTour(!S.tour));
  btnCine.addEventListener('click', toggleCinematic);
  btnSnd.addEventListener('click', () => { Sound.set(!Sound.on); btnSnd.classList.toggle('active', Sound.on); });
  btnHelp.addEventListener('click', () => Palette.open());
  btnPanels.addEventListener('click', () => {
    if (window.innerWidth <= 980) document.body.classList.toggle('panels-open');
    else document.body.classList.toggle('hide-panels');
  });
  btnRandom.addEventListener('click', discoverRandom);
  btnSysBack.addEventListener('click', closeSystem);

  /* section collapse */
  document.querySelectorAll('.sec > h3').forEach(h => {
    h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed'));
  });

  /* search */
  let searchTimer = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const q = searchInput.value.trim().toLowerCase();
      if (q.length < 2 || !S.galaxy) { renderSearchResults([]); return; }
      renderSearchResults(S.galaxy.stars.filter(st =>
        st.visible && (st.name.toLowerCase().includes(q) || st.id.toLowerCase().includes(q))
      ).slice(0, 40));
    }, 120);
  });
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = searchResults.querySelector('[data-star]');
      if (first) first.click();
    }
  });
  searchResults.addEventListener('click', e => {
    const b = e.target.closest('[data-star]');
    if (!b || !S.galaxy) return;
    const st = S.galaxy.stars[+b.dataset.star];
    if (!st) return;
    selectStar(st, { fly: true, zoom: 12 });
    searchInput.value = '';
    renderSearchResults([]);
  });

  /* filters */
  spectralChips.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const c = chip.dataset.c;
    if (filters.spectral.has(c)) {
      if (filters.spectral.size <= 1) { toast('AT LEAST ONE SPECTRAL CLASS REQUIRED'); return; }
      filters.spectral.delete(c);
      chip.classList.remove('on'); chip.setAttribute('aria-pressed', 'false');
    } else {
      filters.spectral.add(c);
      chip.classList.add('on'); chip.setAttribute('aria-pressed', 'true');
    }
    applyFilters();
  });
  fHab.addEventListener('change', () => { filters.hab = fHab.checked; applyFilters(); });
  fMulti.addEventListener('change', () => { filters.multi = fMulti.checked; applyFilters(); });
  fPlan.addEventListener('change', () => { filters.plan = fPlan.checked; applyFilters(); });
  btnFiltersReset.addEventListener('click', () => {
    filters.spectral = new Set(SPEC_ORDER);
    filters.hab = filters.multi = filters.plan = false;
    fHab.checked = fMulti.checked = fPlan.checked = false;
    spectralChips.querySelectorAll('.chip').forEach(c => { c.classList.add('on'); c.setAttribute('aria-pressed', 'true'); });
    applyFilters();
    toast('FILTERS RESET');
  });

  /* bookmarks */
  bookmarkList.addEventListener('click', e => {
    const b = e.target.closest('[data-bm]');
    if (!b) return;
    const bm = bookmarks[+b.dataset.bm];
    if (!bm) return;
    if (bm.seed === S.galaxy.seed) {
      const st = S.galaxy.stars.find(s => s.id === bm.id);
      if (st) selectStar(st, { fly: true, zoom: 12 });
      else toast('TARGET NO LONGER EXISTS');
    } else {
      regenerateGalaxy(bm.seed, { after: bm.id });
    }
  });

  /* inspector action delegation */
  inspectorEl.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === 'inspect' && S.sel) openSystem(S.sel);
    else if (act === 'focus' && S.sel) {
      S.travelName = S.sel.name;
      flyTo(S.sel.x, S.sel.y, S.sel.type === 'nucleus' ? 6 : 14);
    }
    else if (act === 'bookmark' && S.sel) toggleBookmark(S.sel);
    else if (act === 'return') closeSystem();
  });

  /* palette */
  palInput.addEventListener('input', () => { Palette.idx = 0; Palette.render(); });
  palInput.addEventListener('keydown', e => Palette.key(e));
  palEl.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { Palette.close(); return; }
    const cmd = e.target.closest('.cmd[data-i]');
    if (cmd) {
      const c = Palette.items[+cmd.dataset.i];
      Palette.close();
      if (c) c.fn();
    }
  });

  /* keyboard shortcuts */
  window.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      Palette.toggle();
      return;
    }
    if (e.key === 'Escape') {
      if (Palette.opened) { Palette.close(); return; }
      if (S.view === 'system') { closeSystem(); return; }
      if (S.sel) { S.sel = null; renderInspector(); updateFastHUD(); }
      return;
    }
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    const key = e.key.toLowerCase();
    const step = 110 * (e.shiftKey ? 2.4 : 1);
    if (S.view === 'system') {
      const s = sysCam.s(sysBase);
      if (key === 'w' || key === 'arrowup') sysCam.ty -= step / s;
      else if (key === 's' || key === 'arrowdown') sysCam.ty += step / s;
      else if (key === 'a' || key === 'arrowleft') sysCam.tx -= step / s;
      else if (key === 'd' || key === 'arrowright') sysCam.tx += step / s;
      else if (key === '+' || key === '=') sysCam.zoomAt(W / 2, H / 2, 1.22, s, sysBase, W / 2, H / 2);
      else if (key === '-' || key === '_') sysCam.zoomAt(W / 2, H / 2, 1 / 1.22, s, sysBase, W / 2, H / 2);
      else if (key === '0') sysCam.reset();
      else if (key === 'escape') closeSystem();
      else return;
    } else {
      const s = cam.s(baseScale);
      if (key === 'w' || key === 'arrowup') cam.ty -= step / s;
      else if (key === 's' || key === 'arrowdown') cam.ty += step / s;
      else if (key === 'a' || key === 'arrowleft') cam.tx -= step / s;
      else if (key === 'd' || key === 'arrowright') cam.tx += step / s;
      else if (key === '+' || key === '=') cam.zoomAt(W / 2, H / 2, 1.22, s, baseScale, W / 2, H / 2);
      else if (key === '-' || key === '_') cam.zoomAt(W / 2, H / 2, 1 / 1.22, s, baseScale, W / 2, H / 2);
      else if (key === '0') { cam.reset(); S.traveling = false; }
      else if (key === 'f' && S.sel) { S.travelName = S.sel.name; flyTo(S.sel.x, S.sel.y, S.sel.type === 'nucleus' ? 6 : 14); }
      else if (key === 'r') regenerateGalaxy('');
      else if (key === 'b' && S.sel) toggleBookmark(S.sel);
      else if (key === 'm') toggleMinimap();
      else if (key === 'l') S.labelsOn = !S.labelsOn;
      else if (key === 'c') toggleCinematic();
      else if (key === 't') setTour(!S.tour);
      else return;
    }
    e.preventDefault();
  });
}

/* ---------------- minimap ---------------- */
function updateMinimap() {
  if (!S.miniBase || S.view === 'system') return;
  miniCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  miniCtx.clearRect(0, 0, MS, MS);
  miniCtx.drawImage(S.miniBase, 0, 0, MS, MS);
  const k = MS / HAZE_W;
  const s = cam.s(baseScale);
  const hw = (W / 2) / s * k, hh = (H / 2) / s * k;
  miniCtx.strokeStyle = 'rgba(226,176,106,0.85)';
  miniCtx.lineWidth = 1;
  miniCtx.strokeRect(MS / 2 + cam.x * k - hw, MS / 2 + cam.y * k - hh, hw * 2, hh * 2);
  if (S.sel && S.sel.type !== 'nucleus') {
    miniCtx.fillStyle = '#e2b06a';
    miniCtx.beginPath();
    miniCtx.arc(MS / 2 + S.sel.x * k, MS / 2 + S.sel.y * k, 2, 0, TAU);
    miniCtx.fill();
  }
}

/* ---------------- main loop ---------------- */
function frame(nowMs) {
  requestAnimationFrame(frame);
  const now = nowMs / 1000;
  const dt = clamp(now - lastT, 0.001, 0.05);
  lastT = now;
  fpsFrames++;
  if (nowMs - fpsTime > 500) {
    fps = Math.round(fpsFrames * 1000 / (nowMs - fpsTime));
    fpsFrames = 0; fpsTime = nowMs;
  }
  if (S.regen) stepRegen(nowMs);
  const fadeTgt = S.view === 'system' ? 1 : 0;
  S.fade += (fadeTgt - S.fade) * Math.min(1, dt * 5);
  if (Math.abs(S.fade - fadeTgt) < 0.005) S.fade = fadeTgt;
  stepTour(nowMs);
  if (nowMs > nextAmbient) {
    nextAmbient = nowMs + 20000 + Math.random() * 18000;
    if (S.view === 'galaxy' && !S.regen && Math.random() < 0.7) ambientMsg();
  }
  cam.update(dt);
  sysCam.update(dt);
  drawBackground(now);
  sceneCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sceneCtx.clearRect(0, 0, W, H);
  if (S.fade < 0.999 && S.galaxy) renderGalaxy(now, 1 - S.fade);
  if (S.fade > 0.001 && S.sys) renderSystem(now, S.fade);
  updateMinimap();
  uiAcc += dt;
  if (uiAcc > 0.12) { uiAcc = 0; updateFastHUD(); }
}

/* ---------------- sizing ---------------- */
function sizeCanvases() {
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  for (const c of [sceneC, bgC]) {
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    c.style.width = W + 'px'; c.style.height = H + 'px';
  }
  bgW = W + 48; bgH = H + 48;
  bgBase.width = Math.round(bgW * dpr); bgBase.height = Math.round(bgH * dpr);
  baseScale = Math.min(W, H) / 2300;
  miniC.width = miniC.height = Math.round(MS * dpr);
  if (S.galaxy) {
    rebuildBackground();
    S.miniBase = buildMiniBase();
    computeSysBase();
  } else {
    rebuildBackground();
  }
}
window.addEventListener('resize', debounce(sizeCanvases, 120));

/* ---------------- init ---------------- */
function init() {
  noiseCanvas = makeNoise();
  buildSprites();
  sizeCanvases();
  bindUI();
  buildChips();
  loadBookmarks();
  const seed = 'ASTRA-74291';
  S.galaxy = generateGalaxy(seed);
  S.miniBase = buildMiniBase();
  rebuildBackground();
  hudSeed.textContent = seed;
  renderStats();
  renderBookmarks();
  renderInspectorEmpty();
  applyFilters();
  log('Galaxy ' + seed + ' synthesized — ' + fmtInt(S.galaxy.stats.total) + ' stellar systems indexed.');
  requestAnimationFrame(t => { lastT = t / 1000; requestAnimationFrame(frame); });
}
window.ASTRA = { S, cam, flyTo, selectStar, regenerateGalaxy, openSystem, togglePalette: () => Palette.toggle() };
init();
</script>
