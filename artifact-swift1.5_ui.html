    {id:'theme',label:'Toggle Dark / Frosted Theme',icon:'sun',kw:'light dark variation appearance',act:()=>{S.set('appearance.theme',S.get('appearance.theme')==='frosted'?'dark':'frosted');S.apply();NF.notify('Theme changed','Now using '+(S.get('appearance.theme'))+'.','sun');}},
    {id:'restart',label:'Restart Shell',icon:'refresh',kw:'reload reboot interface',act:()=>RESTART.run()},
    {id:'showdesk',label:'Show Desktop',icon:'grid',kw:'minimize all',act:toggleShowDesk},
    {id:'cascade',label:'Cascade Windows',icon:'grid',kw:'tile arrange organize',act:()=>WM.cascade()},
    {id:'close-win',label:'Close Active Window',icon:'x',kw:'close',act:()=>WM.closeActive()},
    {id:'min-win',label:'Minimize Active Window',icon:'minus',kw:'minimize',act:()=>{const w=WM.activeWin();if(w)WM.minimize(w.id);}},
    {id:'max-win',label:'Maximize Active Window',icon:'sq',kw:'maximize fullscreen',act:()=>{const w=WM.activeWin();if(w&&w.state!=='max')WM.toggleMax(w.id);}},
    {id:'notifs',label:'Open Notifications',icon:'bell',kw:'alerts center',act:()=>NC.open()},
    {id:'lock',label:'Lock System',icon:'lock',kw:'secure sleep lock',act:()=>LOCK.lock()},
    {id:'sleep',label:'Sleep',icon:'moon',kw:'dim rest',act:()=>SLEEP.run()}
  ],
  sel:0, hits:[],
  open(){
    $('#palette').classList.add('open');
    const i=$('#pal-in'); i.value=''; this.filter(''); i.focus();
  },
  close(){ $('#palette').classList.remove('open'); },
  toggle(){ $('#palette').classList.contains('open')?this.close():this.open(); },
  fuzzy(q,s){
    if(!q)return 1;
    q=q.toLowerCase(); s=s.toLowerCase();
    if(s.includes(q))return 2;
    let i=0;
    for(const c of s) if(c===q[i])i++;
    return i===q.length?1:0;
  },
  filter(q){
    const scored=[];
    this.cmds.forEach((c,i)=>{ if(c.sep)return;
      const s=this.fuzzy(q,c.label)+this.fuzzy(q,c.kw||'');
      if(s)scored.push({c,score:s}); });
    // app quick-launch
    Object.values(APPS).forEach(a=>{ const s=this.fuzzy(q,'open '+a.name); if(s)scored.push({c:{label:'Open '+a.name,icon:a.icon,act:()=>WM.open(a.id)},score:s}); });
    // files
    if(q)FS.walk((parts,n)=>{ if(n.t==='f'&&this.fuzzy(q,n.name))
      scored.push({c:{label:n.name,icon:'file',act:()=>WM.open('editor',{path:parts})},score:this.fuzzy(q,n.name)});});
    scored.sort((a,b)=>b.score-a.score);
    this.hits=scored.slice(0,12).map(x=>x.c);
    this.sel=0;
    this.render();
  },
  render(){
    const list=$('#pal-list');
    list.innerHTML=this.hits.length?this.hits.map((h,i)=>
      `<div class="pal-item ${i===this.sel?'sel':''}" data-i="${i}" role="option">${I[h.icon]||I.file}<span>${esc(h.label)}</span><span class="p-kind">command</span></div>`).join('')
      :'<div class="pal-empty">No matching commands</div>';
    const s=list.querySelector('.sel'); if(s)s.scrollIntoView({block:'nearest'});
  },
  move(d){
    if(!this.hits.length)return;
    this.sel=(this.sel+d+this.hits.length)%this.hits.length;
    this.render();
  },
  run(){
    const h=this.hits[this.sel];
    if(h){this.close();h.act();}
  },
  wire(){
    const i=$('#pal-in');
    i.addEventListener('input',()=>this.filter(i.value));
    i.addEventListener('keydown',e=>{
      e.stopPropagation();
      if(e.key==='ArrowDown'){e.preventDefault();this.move(1);}
      else if(e.key==='ArrowUp'){e.preventDefault();this.move(-1);}
      else if(e.key==='Enter'){e.preventDefault();this.run();}
    });
    $('#pal-list').addEventListener('click',e=>{
      const b=e.target.closest('.pal-item'); if(!b)return;
      this.sel=+b.dataset.i; this.run();
    });
    $('#pal-list').addEventListener('mousemove',e=>{
      const b=e.target.closest('.pal-item'); if(!b)return;
      if(this.sel!==+b.dataset.i){this.sel=+b.dataset.i;this.render();}
    });
  }
};

/* ================= ALT+TAB ================= */
const ALT={
  show:false, order:[], idx:0,
  open(){
    this.order=[...WM.wins.values()].filter(w=>w.state!=='min').sort((a,b)=>(b.el.style.zIndex|0)-(a.el.style.zIndex|0)).map(w=>w.id);
    if(!this.order.length)return;
    this.idx=1%this.order.length;
    this.show=true; this.render();
    $('#alttab').classList.add('show');
  },
  cycle(d){
    if(!this.order.length)return;
    this.idx=(this.idx+d+this.order.length)%this.order.length;
    this.render();
  },
  commit(){
    if(!this.show)return;
    this.show=false; $('#alttab').classList.remove('show');
    if(this.order[this.idx])WM.focus(this.order[this.idx]);
  },
  render(){
    $('#alttab').innerHTML=this.order.map((id,i)=>{
      const w=WM.wins.get(id);
      return `<div class="at-card ${i===this.idx?'sel':''}">${I[w.app.icon]}<span>${esc(w.el.querySelector('.tb-title').textContent)}</span></div>`;
    }).join('');
  },
  refresh(){ if(this.show)this.render(); }
};

/* ================= LOCK / SLEEP / RESTART / BOOT ================= */
const LOCK={
  on:false,
  lock(){
    if(this.on)return;
    this.on=true;
    $('#lock-bg').style.backgroundImage=wpCSS(wpCur);
    $('#lock').classList.add('on');
    refreshClock();
  },
  unlock(){
    if(!this.on)return;
    this.on=false;
    $('#lock').classList.remove('on');
    NF.notify('Welcome back','Session unlocked.');
  }
};
const SLEEP={
  on:false,
  run(){ if(this.on)return; this.on=true; $('#sleep').classList.add('on'); },
  wake(){ if(!this.on)return; this.on=false; $('#sleep').classList.remove('on'); }
};
const RESTART={
  busy:false,
  run(){
    if(this.busy)return; this.busy=true;
    $('#desktop').classList.add('fading');
    $('#taskbar').classList.add('fading');
    setTimeout(()=>{
      playBoot(()=>{
        $('#desktop').classList.remove('fading');
        $('#taskbar').classList.remove('fading');
        this.busy=false;
        NF.notify('Interface restarted','Session restored. All data was kept.');
      });
    },420);
  }
};
function playBoot(done){
  const b=$('#boot');
  b.style.display='flex'; b.style.opacity='1'; b.style.pointerEvents='auto';
  $('#boot-logo-ic').innerHTML=I.logo;
  const log=$('#boot-log'); log.innerHTML='';
  const lines=['NOVA SYSTEMS','SYSTEM CORE 8.4.2','Initializing kernel…','Mounting virtual filesystem…','Loading interface compositor…','Restoring session…'];
  lines.forEach((t,i)=>setTimeout(()=>{
    const d=document.createElement('div'); d.className='bl'; d.textContent=t;
    log.appendChild(d);
    while(log.children.length>5)log.removeChild(log.firstChild);
  },200+i*300));
  const bar=$('#boot-bar');
  bar.style.transition='none'; bar.style.width='0%';
  requestAnimationFrame(()=>{bar.style.transition='width 2.3s cubic-bezier(.3,.1,.3,1)';bar.style.width='100%';});
  let fin=false;
  const finish=()=>{ if(fin)return; fin=true;
    b.style.pointerEvents='none'; b.style.opacity='0';
    setTimeout(()=>{b.style.display='none';done&&done();},560);
  };
  b.addEventListener('pointerdown',finish,{once:true});
  setTimeout(finish,2800);
}
const MATRIX={
  on:false,
  run(){
    if(this.on)return;
    this.on=true;
    const cv=$('#matrix canvas'); cv.width=innerWidth; cv.height=innerHeight;
    const x=cv.getContext('2d');
    const cols=cv.width/14;
    const drops=Array(Math.floor(cols)).fill(0).map(()=>Math.random()*-40);
    let frames=0;
    const tick=()=>{
      if(!this.on)return;
      x.fillStyle='rgba(0,0,0,.08)'; x.fillRect(0,0,cv.width,cv.height);
      x.fillStyle='#39ff88'; x.font='13px monospace';
      drops.forEach((d,i)=>{
        x.fillText(String.fromCharCode(0x30A0+Math.random()*96),i*14,d*14);
        drops[i]=d>cv.height/14&&Math.random()>.975?0:d+1;
      });
      frames++;
      if(frames>320){ this.stop(); return; }
      requestAnimationFrame(tick);
    };
    tick();
  },
  stop(){ this.on=false; $('#matrix').classList.remove('on');
    const x=$('#matrix canvas').getContext('2d'); x.clearRect(0,0,innerWidth,innerHeight); }
};

/* ================= GLOBAL EVENTS ================= */
function isTyping(t){return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);}
function closeEphemerals(){
  CTX.hide(); PAL.close(); SM.close(); QS.close(); CLK.close(); NC.close();
  if($('#modal-root').classList.contains('show')&&$$('#modal-root .btn').length>1)$('#modal-root').classList.remove('show');
}
function wireGlobal(){
  document.addEventListener('keydown',e=>{
    if(LOCK.on){ if(e.key!=='F5')LOCK.unlock(); e.preventDefault(); return; }
    if(SLEEP.on){ SLEEP.wake(); e.preventDefault(); return; }
    if(MATRIX.on&&e.key==='Escape'){MATRIX.stop();return;}
    const meta=e.ctrlKey||e.metaKey;
    const k=e.key.toLowerCase();
    if(meta&&k==='k'&&!e.altKey){e.preventDefault();PAL.toggle();return;}
    if(meta&&e.altKey&&k==='t'){e.preventDefault();WM.open('terminal');return;}
    if(meta&&!e.altKey&&k==='l'){e.preventDefault();LOCK.lock();return;}
    if(meta&&!e.altKey&&k==='w'){e.preventDefault();WM.closeActive();return;}
    if(meta&&!e.altKey&&k==='s'){
      e.preventDefault();
      const w=WM.activeWin();
      if(w&&w.api&&w.api.save)w.api.save();
      return;
    }
    if(e.altKey&&e.key==='Tab'){
      e.preventDefault();
      if(!ALT.show)ALT.open(); else ALT.cycle(e.shiftKey?-1:1);
      return;
    }
    if(e.key==='Alt')return;
    const typing=isTyping(e.target);
    if(e.key==='Escape'){
      if(ALT.show){ALT.commit();return;}
      closeEphemerals();
      return;
    }
    if(!typing){
      const w=WM.activeWin();
      if(w&&w.api&&w.api.onKey)w.api.onKey(e);
    }
  });
  document.addEventListener('keyup',e=>{
    if(e.key==='Alt'&&ALT.show)ALT.commit();
  });
  document.addEventListener('pointerdown',e=>{
    if(CTX.visible&&!e.target.closest('#ctx'))CTX.hide();
    if($('#start-menu').classList.contains('open')&&!e.target.closest('#start-menu')&&!e.target.closest('#start-btn'))SM.close();
    if($('#qs').classList.contains('open')&&!e.target.closest('#qs')&&!e.target.closest('#tb-tray'))QS.close();
    if($('#clock-panel').classList.contains('open')&&!e.target.closest('#clock-panel')&&!e.target.closest('#tb-clock'))CLK.close();
    if($('#nc').classList.contains('open')&&!e.target.closest('#nc')&&!e.target.closest('#tb-bell'))NC.close();
    if($('#palette').classList.contains('open')&&!e.target.closest('#palette'))PAL.close();
  },{capture:true});
  // taskbar interactions
  $('#start-btn').addEventListener('click',()=>SM.toggle());
  $$('#tb-tray .tray-btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();QS.toggle();}));
  $('#tb-bell').addEventListener('click',e=>{e.stopPropagation();NC.open();});
  $('#tb-clock').addEventListener('click',e=>{e.stopPropagation();CLK.open();});
  $('#cp-prev').addEventListener('click',()=>{CLK.m--;if(CLK.m<0){CLK.m=11;CLK.y--;}CLK.render();});
  $('#cp-next').addEventListener('click',()=>{CLK.m++;if(CLK.m>11){CLK.m=0;CLK.y++;}CLK.render();});
  // lock & sleep surfaces
  $('#lock').addEventListener('pointerdown',()=>LOCK.unlock());
  $('#sleep').addEventListener('pointerdown',()=>SLEEP.wake());
  window.addEventListener('resize',debounce(()=>WM.clampAll(),150));
  document.addEventListener('click',e=>{
    if(!e.target.closest('.d-icon'))$$('#icons .d-icon').forEach(x=>x.classList.remove('sel'));
  });
}
QS.toggle=function(){ $('#qs').classList.contains('open')?this.close():this.open(); };

/* ================= INIT ================= */
let bootTime=Date.now();
function init(){
  S.init();
  FS.load();
  Notes.load();
  NF.init();
  $('#bell-ic').innerHTML=I.bell;
  TB.init();
  DI.build();
  SM.wire();
  PAL.wire();
  QS.wire();
  NC.wire();
  CTX.wire();
  wireGlobal();
  NF.renderCenter=()=>{ if($('#nc').classList.contains('open'))NC.render(); };
  setWallpaper(S.get('desktop.wallpaper'),true);
  setInterval(refreshClock,1000);
  refreshClock();
  playBoot(()=>{
    NF.notify('Welcome to NOVA OS 8.4','Press Ctrl+K to open the command palette, or double-click a desktop icon.','logo');
  });
}
document.addEventListener('DOMContentLoaded',init);
