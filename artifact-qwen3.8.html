                        <body>
                            <!DOCTYPE html>
<html lang="en" data-theme="dark" data-motion="full" data-tb="standard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA OS</title>
<style>
/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --bg:#05070b;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --fs:13.5px;
  --tbh:56px;
  --di-tile:46px;--di-w:88px;--di-h:104px;--di-lab:11px;
  --panel-a:.74;
  --panel:rgba(13,17,24,var(--panel-a));
  --panel-2:rgba(22,27,36,var(--panel-a));
  --panel-3:rgba(255,255,255,.045);
  --hover:rgba(255,255,255,.08);
  --text:#e7edf4;
  --muted:#93a0b2;
  --faint:#5b6879;
  --border:rgba(255,255,255,.09);
  --border-soft:rgba(255,255,255,.055);
  --accent:#54d1e8;
  --accent-soft:rgba(84,209,232,.15);
  --accent-line:rgba(84,209,232,.45);
  --shadow:0 24px 60px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.4);
  --shadow-soft:0 10px 28px rgba(0,0,0,.42);
  --radius:11px;
}
html[data-theme="dim"]{--bg:#0a0d13;--panel:rgba(19,24,32,var(--panel-a));--panel-2:rgba(29,35,45,var(--panel-a));--text:#dde5ee;--muted:#8d99ab}
html[data-theme="light"]{
  --bg:#b9c2cd;--panel:rgba(238,242,247,var(--panel-a));--panel-2:rgba(224,230,238,var(--panel-a));--panel-3:rgba(20,30,44,.05);
  --hover:rgba(15,25,40,.07);--text:#1b2430;--muted:#54637a;--faint:#7e8ca1;
  --border:rgba(15,25,40,.15);--border-soft:rgba(15,25,40,.09);
  --shadow:0 24px 60px rgba(20,30,50,.30),0 2px 10px rgba(20,30,50,.18);--shadow-soft:0 10px 28px rgba(20,30,50,.22);
}
html[data-tb="compact"]{--tbh:44px}
html[data-motion="off"] *,html[data-motion="off"] *::before,html[data-motion="off"] *::after{animation:none!important;transition:none!important}
html[data-motion="subtle"] .aur-b,html[data-motion="subtle"] .wp-cv,html[data-motion="subtle"] .b-mark{animation:none!important}
html{height:100%}
body{height:100%;overflow:hidden;font-family:var(--font);font-size:var(--fs);color:var(--text);background:var(--bg);user-select:none;-webkit-user-select:none;cursor:default}
input,textarea,select{user-select:text;-webkit-user-select:text;font:inherit;color:var(--text);background:transparent;border:0;outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{font-family:var(--font);font-size:9.5px;letter-spacing:.08em;color:var(--faint);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--panel-3)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(140,160,190,.22);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(140,160,190,.4)}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:rgba(140,160,190,.25) transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
body.dragging{cursor:grabbing}
body.dragging *{user-select:none!important}
.ic{display:inline-block;vertical-align:middle;flex:none}

/* ============ WALLPAPER ============ */
#wallpaper{position:fixed;inset:0;z-index:0;overflow:hidden;background:#04060a}
.wp-layer{position:absolute;inset:0;opacity:1}
#wp-tint{position:absolute;inset:0;transition:background .9s ease;pointer-events:none}
.wp-aurora{background:linear-gradient(180deg,#030509 0%,#06101c 42%,#0a1a26 78%,#0c1f2b 100%)}
.aur-b{position:absolute;width:55vw;height:55vw;border-radius:50%;filter:blur(70px);will-change:transform}
.aur-b.a{left:-10vw;top:6vh;background:radial-gradient(circle,#0f5d6e,transparent 62%);opacity:.55;animation:aurA 52s ease-in-out infinite alternate}
.aur-b.b{right:-12vw;top:28vh;background:radial-gradient(circle,#1d2f6e,transparent 62%);opacity:.5;animation:aurB 64s ease-in-out infinite alternate}
.aur-b.c{left:24vw;bottom:-20vh;background:radial-gradient(circle,#3a2260,transparent 62%);opacity:.42;animation:aurC 46s ease-in-out infinite alternate}
@keyframes aurA{to{transform:translate(9vw,-6vh) scale(1.15)}}
@keyframes aurB{to{transform:translate(-7vw,6vh) scale(.9)}}
@keyframes aurC{to{transform:translate(6vw,-9vh) scale(1.22)}}
.wp-mesh{background:radial-gradient(ellipse 70% 55% at 50% 62%,rgba(90,190,220,.075),transparent 70%),linear-gradient(180deg,#04060a,#070b12 60%,#0a0f18)}
.mesh-grid{position:absolute;inset:-2px;background:repeating-linear-gradient(0deg,rgba(140,180,220,.055) 0 1px,transparent 1px 46px),repeating-linear-gradient(90deg,rgba(140,180,220,.045) 0 1px,transparent 1px 46px);-webkit-mask-image:radial-gradient(ellipse 78% 68% at 50% 55%,#000 28%,transparent 80%);mask-image:radial-gradient(ellipse 78% 68% at 50% 55%,#000 28%,transparent 80%)}
.wp-lunar svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wp-cv-wrap{background:#04060a}
.wp-cv{width:100%;height:100%;display:block;animation:wpDrift 90s ease-in-out infinite alternate}
@keyframes wpDrift{to{transform:translate3d(-26px,18px,0) scale(1.05)}}

/* ============ DESKTOP ============ */
#desktop{position:fixed;inset:0;bottom:var(--tbh);z-index:1;opacity:0;transition:opacity .5s ease}
body.ready #desktop{opacity:1}
#desk-icons{position:absolute;inset:0;pointer-events:none}
.dicon{position:absolute;width:var(--di-w);display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 4px 7px;border-radius:10px;cursor:default;pointer-events:auto;transition:background .15s}
.dicon:hover{background:rgba(255,255,255,.06)}
.dicon.sel{background:var(--accent-soft)}
.dicon .di-tile{width:var(--di-tile);height:var(--di-tile);border-radius:13px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.4);color:var(--text);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s,box-shadow .15s}
.dicon:hover .di-tile{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.5)}
.dicon .di-lab{font-size:var(--di-lab);color:var(--text);text-shadow:0 1px 8px rgba(0,0,0,.9);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.02em}
.dicon.drag{transition:none;opacity:.92;cursor:grabbing;z-index:9}

/* ============ WINDOWS ============ */
#win-layer{position:fixed;inset:0;bottom:var(--tbh);z-index:10;overflow:hidden;opacity:0;transition:opacity .5s ease}
body.ready #win-layer{opacity:1}
.win{position:absolute;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-soft);overflow:hidden;will-change:left,top;backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25)}
.win.active{border-color:var(--accent-line);box-shadow:var(--shadow)}
body.focus .win:not(.active){opacity:.86}
.win.opening{animation:winIn .22s cubic-bezier(.2,.8,.3,1)}
@keyframes winIn{from{opacity:0;transform:scale(.955) translateY(10px)}}
.win.close-anim{opacity:0;transform:scale(.965) translateY(8px);transition:opacity .16s ease-in,transform .16s ease-in}
.win.min-anim{opacity:0;transform:translateY(170px) scale(.88);transition:opacity .2s ease-in,transform .2s ease-in}
.win.rest-anim{transition:opacity .18s ease-out,transform .18s ease-out}
.win.snapping{transition:left .24s cubic-bezier(.2,.8,.25,1),top .24s cubic-bezier(.2,.8,.25,1),width .24s cubic-bezier(.2,.8,.25,1),height .24s cubic-bezier(.2,.8,.25,1)}
.win.max{border-radius:8px}
.win.max .rh{display:none}
.tb{height:40px;flex:none;display:flex;align-items:center;gap:9px;padding:0 8px 0 13px;background:var(--panel-2);border-bottom:1px solid var(--border-soft);touch-action:none}
.tb-ic{display:grid;place-items:center;color:var(--muted);width:18px}
.win.active .tb-ic{color:var(--accent)}
.tb-t{flex:1;min-width:0;font-size:12.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.win.active .tb-t{color:var(--text)}
.tb-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.tb-btns{display:flex;gap:2px}
.tb-btn{width:30px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--muted);transition:background .13s,color .13s}
.tb-btn:hover{background:var(--hover);color:var(--text)}
.tb-btn.close:hover{background:rgba(235,80,92,.16);color:#ff8d95}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden}
.rh{position:absolute;z-index:6}
.rh.n{top:-4px;left:10px;right:10px;height:9px;cursor:n-resize}
.rh.s{bottom:-4px;left:10px;right:10px;height:9px;cursor:s-resize}
.rh.w{left:-4px;top:10px;bottom:10px;width:9px;cursor:w-resize}
.rh.e{right:-4px;top:10px;bottom:10px;width:9px;cursor:e-resize}
.rh.nw{top:-4px;left:-4px;width:13px;height:13px;cursor:nw-resize}
.rh.ne{top:-4px;right:-4px;width:13px;height:13px;cursor:ne-resize}
.rh.sw{bottom:-4px;left:-4px;width:13px;height:13px;cursor:sw-resize}
.rh.se{bottom:-4px;right:-4px;width:13px;height:13px;cursor:se-resize}
#snap-preview{position:fixed;z-index:900;border:1.5px solid var(--accent-line);background:var(--accent-soft);border-radius:10px;opacity:0;pointer-events:none;transition:opacity .12s,all .1s ease}
#snap-preview.on{opacity:.55}

/* ============ TASKBAR ============ */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tbh);z-index:1000;display:flex;align-items:center;gap:7px;padding:0 10px;background:linear-gradient(180deg,rgba(10,13,18,.5),rgba(6,9,13,.78));backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid var(--border-soft);opacity:0;transition:opacity .5s ease}
body.ready #taskbar{opacity:1}
html[data-theme="light"] #taskbar{background:linear-gradient(180deg,rgba(225,231,240,.55),rgba(214,221,232,.8))}
.tb-start{width:40px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--text);transition:background .14s,transform .14s,filter .2s}
.tb-start:hover{background:var(--hover);transform:translateY(-1px)}
.tb-start .ic{color:var(--accent);filter:drop-shadow(0 0 7px var(--accent-soft))}
.tb-search{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;background:var(--panel-3);border:1px solid var(--border-soft);color:var(--muted);font-size:12px;transition:background .14s,color .14s}
.tb-search:hover{background:var(--hover);color:var(--text)}
html[data-tb="compact"] .tb-search .ts-lab{display:none}
.tb-search .ts-kbd{font-size:9px;letter-spacing:.06em;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:1px 4px}
.tb-apps{display:flex;gap:5px;margin-left:4px;overflow-x:auto;scrollbar-width:none}
.tb-apps::-webkit-scrollbar{display:none}
.app-slot{width:42px;height:38px;flex:none;position:relative;display:grid;place-items:center;border-radius:10px;color:var(--muted);transition:transform .14s,background .14s,color .14s}
.app-slot:hover{background:var(--hover);color:var(--text);transform:translateY(-2px)}
.app-slot .run{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:10px;height:3px;border-radius:2px;background:var(--accent);opacity:0;transition:opacity .2s,width .2s}
.app-slot.running .run{opacity:.55}
.app-slot.active .run{opacity:1;width:18px}
.app-slot .cnt{position:absolute;top:1px;right:2px;min-width:13px;height:13px;padding:0 3px;border-radius:7px;background:var(--accent);color:#06121a;font-size:8.5px;font-weight:700;display:grid;place-items:center}
.tb-tray{margin-left:auto;display:flex;align-items:center;gap:3px}
.tray-chip{display:flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:8px;color:var(--muted);transition:background .13s,color .13s}
.tray-chip:hover{background:var(--hover);color:var(--text)}
.tray-chip .ic.off{opacity:.35}
.badge{min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--accent);color:#06121a;font-size:9px;font-weight:700;display:grid;place-items:center;font-style:normal}
.tray-clock{height:34px;padding:0 11px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;border-radius:8px;line-height:1.25;transition:background .13s}
.tray-clock:hover{background:var(--hover)}
#clock-time{font-size:13px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.02em}
#clock-time .cln{animation:clnBlink 2s steps(1) infinite}
#clock-time .ampm{font-size:9px;color:var(--muted);margin-left:2px;letter-spacing:.08em}
@keyframes clnBlink{0%,49%{opacity:1}50%,100%{opacity:.35}}
#clock-date{font-size:10.5px;color:var(--muted)}
#show-desktop{width:5px;height:100%;align-self:stretch;margin-left:5px;background:rgba(160,190,220,.14);border-radius:2px;cursor:pointer;transition:width .15s,background .15s}
#show-desktop:hover{width:13px;background:var(--accent-soft)}
@media (max-width:900px){.tb-search .ts-kbd{display:none}.app-slot{width:38px}}

/* ============ POPOVERS ============ */
.pop{position:fixed;z-index:1100;transform-origin:bottom left}
#start{left:12px;bottom:calc(var(--tbh) + 12px);width:520px;max-width:calc(100vw - 24px);max-height:calc(100vh - var(--tbh) - 24px);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);animation:popIn .18s cubic-bezier(.2,.8,.3,1)}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.985)}}
.sm-searchbox{display:flex;align-items:center;gap:9px;height:37px;padding:0 13px;margin:14px 14px 4px;background:var(--panel-3);border:1px solid var(--border-soft);border-radius:10px;color:var(--muted);transition:border-color .15s}
.sm-searchbox:focus-within{border-color:var(--accent-line)}
.sm-searchbox input{flex:1;font-size:13px}
.sm-scroll{flex:1;min-height:0;overflow:auto;padding:0 14px 10px}
.sm-h{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:13px 0 8px}
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.sm-app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px 9px;border-radius:10px;transition:background .13s,transform .12s}
.sm-app:hover{background:var(--panel-3);transform:translateY(-1px)}
.sm-app .sa-tile{width:40px;height:40px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border-soft);display:grid;place-items:center;color:var(--text)}
.sm-app .sa-lab{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-app:hover .sa-lab{color:var(--text)}
.sm-recent{display:flex;flex-direction:column;gap:1px}
.sm-r{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.sm-r:hover{background:var(--panel-3);color:var(--text)}
.sm-r .sm-rr{margin-left:auto;font-size:10px;color:var(--faint)}
.sm-res-g{margin-bottom:10px}
.sm-res{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.sm-res.sel{background:var(--accent-soft);color:var(--text)}
.sm-res .sr-ic{width:16px;color:var(--muted);display:grid;place-items:center;flex:none}
.sm-res .sr-sub{margin-left:auto;font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}
.sm-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--border-soft)}
.sm-user{display:flex;gap:10px;align-items:center}
.sm-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.sm-uname{font-size:12.5px;font-weight:600}
.sm-usub{font-size:10.5px;color:var(--faint)}
.sm-actions{display:flex;gap:3px}
.sm-act{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 9px;border-radius:8px;color:var(--muted);font-size:9.5px;letter-spacing:.04em;transition:background .13s,color .13s}
.sm-act:hover{background:var(--panel-3);color:var(--text)}

#calendar{right:12px;bottom:calc(var(--tbh) + 12px);width:300px;background:var(--panel);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);animation:popIn .18s;transform-origin:bottom right;padding:14px}
.cal-time{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cal-date{font-size:12.5px;color:var(--muted);margin:3px 0 12px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-month{font-size:12.5px;font-weight:700}
.cal-nav .nav-b{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.cal-nav .nav-b:hover{background:var(--hover);color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:9.5px;color:var(--faint);letter-spacing:.1em;padding:4px 0;text-transform:uppercase}
.cal-cell{font-size:11.5px;padding:5px 0;border-radius:7px;color:var(--text);cursor:default;font-variant-numeric:tabular-nums}
.cal-cell.out{color:var(--faint);opacity:.5}
.cal-cell.today{background:var(--accent);color:#0a141c;font-weight:700}
.cal-cell:hover:not(.today){background:var(--panel-3)}

#quick{right:12px;bottom:calc(var(--tbh) + 12px);width:322px;background:var(--panel);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);animation:popIn .18s;transform-origin:bottom right}
.qs-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 14px 8px}
.qs-t{display:flex;flex-direction:column;gap:7px;align-items:center;padding:11px 4px;border-radius:11px;background:var(--panel-3);border:1px solid transparent;color:var(--muted);transition:all .15s}
.qs-t:hover{background:var(--hover)}
.qs-t.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.qst-l{font-size:10px;letter-spacing:.03em}
.qs-sl{display:flex;align-items:center;gap:10px;padding:5px 16px;color:var(--muted)}
.qs-sl input{flex:1;accent-color:var(--accent);height:4px}
.qs-val{width:34px;text-align:right;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.qs-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--faint)}

#notif-center{right:12px;bottom:calc(var(--tbh) + 12px);width:340px;max-height:calc(100vh - var(--tbh) - 24px);display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);animation:popIn .18s;transform-origin:bottom right}
.nc-head{display:flex;justify-content:space-between;align-items:center;padding:13px 14px 9px}
.nc-date{font-size:10.5px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.nc-title{font-size:13.5px;font-weight:700}
.nc-quick{display:flex;gap:6px;padding:0 14px 10px}
.nq{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:9px;background:var(--panel-3);font-size:9.5px;color:var(--muted);transition:all .15s}
.nq.on{background:var(--accent-soft);color:var(--accent)}
.nc-list{flex:1;overflow:auto;padding:0 8px 10px;min-height:60px}
.nc-i{display:flex;gap:10px;padding:9px 8px;border-radius:9px}
.nc-i:hover{background:var(--panel-3)}
.nc-ic{width:30px;height:30px;border-radius:9px;background:var(--panel-2);display:grid;place-items:center;color:var(--muted);flex:none;margin-top:1px}
.nc-t{font-size:12.5px;font-weight:600}
.nc-m{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.nc-d{font-size:10px;color:var(--faint);margin-top:3px}
.nc-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 0;color:var(--faint);font-size:12px}

#ctx{position:fixed;z-index:1150;min-width:192px;background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:5px;animation:popIn .13s}
.ctx-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;font-size:12.5px;color:var(--text);cursor:pointer;white-space:nowrap}
.ctx-i:hover,.ctx-i.sel{background:var(--accent-soft)}
.ctx-i .ci-ic{width:16px;color:var(--muted);display:grid;place-items:center;flex:none}
.ctx-i.danger{color:#ff9aa2}
.ctx-i.danger .ci-ic{color:#ff9aa2}
.ctx-i.danger:hover{background:rgba(255,90,100,.12)}
.ctx-i.dis{opacity:.38;pointer-events:none}
.ctx-sep{height:1px;background:var(--border-soft);margin:5px 8px}

#dialog{position:fixed;inset:0;z-index:1350;display:flex;align-items:center;justify-content:center;background:rgba(3,5,8,.42)}
.dlg-card{width:390px;max-width:92vw;background:var(--panel);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px;animation:popIn .16s}
.dlg-t{font-size:14px;font-weight:700;margin-bottom:7px}
.dlg-d{font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:13px;white-space:pre-line}
.dlg-in{width:100%;height:35px;padding:0 12px;background:var(--panel-3);border:1px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:13px;transition:border-color .15s}
.dlg-in:focus{border-color:var(--accent-line)}
.dlg-in.shake{animation:shake .3s}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px}
.dlg-body{margin-bottom:13px}

/* ============ TOASTS ============ */
#toasts{position:fixed;right:16px;bottom:calc(var(--tbh) + 16px);z-index:1200;display:flex;flex-direction:column;gap:9px;width:342px;pointer-events:none}
.toast{display:flex;gap:10px;padding:12px 12px 12px 13px;background:var(--panel);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;box-shadow:var(--shadow-soft);animation:toastIn .3s cubic-bezier(.2,.9,.3,1);pointer-events:auto}
@keyframes toastIn{from{opacity:0;transform:translateX(26px)}}
.toast.out{opacity:0;transform:translateX(26px);transition:opacity .25s,transform .25s}
.t-ic{color:var(--accent);display:grid;place-items:center;margin-top:1px}
.t-bd{flex:1;min-width:0}
.t-tl{font-size:12.5px;font-weight:700}
.t-ms{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:2px;word-break:break-word}
.t-act{margin-top:7px;padding:4px 11px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}
.t-act:hover{background:var(--accent);color:#06121a}
.t-x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--faint);flex:none}
.t-x:hover{background:var(--hover);color:var(--text)}

/* ============ PALETTE / ALT-TAB ============ */
#palette{position:fixed;inset:0;z-index:1300;background:rgba(3,5,8,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding-top:13vh;opacity:0;pointer-events:none;transition:opacity .15s}
#palette.on{opacity:1;pointer-events:auto}
.pal-card{width:620px;max-width:92vw;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);overflow:hidden;transform:translateY(8px) scale(.99);transition:transform .16s cubic-bezier(.2,.8,.3,1)}
#palette.on .pal-card{transform:none}
.pal-top{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--border-soft);color:var(--muted)}
.pal-top input{flex:1;font-size:14px}
.pal-list{max-height:330px;overflow:auto;padding:6px}
.pal-item{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:9px;color:var(--muted);cursor:pointer}
.pal-item .pi-ic{width:17px;display:grid;place-items:center;color:var(--faint);flex:none}
.pal-item .pi-l{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item .pi-c{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.pal-item.sel{background:var(--accent-soft);color:var(--text)}
.pal-item.sel .pi-ic{color:var(--accent)}
.pal-foot{display:flex;gap:16px;padding:8px 15px;border-top:1px solid var(--border-soft);font-size:10.5px;color:var(--faint)}
.pal-empty{padding:22px;text-align:center;font-size:12px;color:var(--faint)}

#alttab{position:fixed;inset:0;z-index:1250;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .12s}
#alttab.on{opacity:1;pointer-events:auto}
.at-bar{display:flex;gap:10px;padding:13px;background:var(--panel);border:1px solid var(--border);border-radius:14px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow);max-width:92vw;flex-wrap:wrap;justify-content:center}
.at-card{width:152px;max-height:120px;overflow:hidden;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;padding:10px;cursor:pointer;transition:transform .1s}
.at-card .at-ic{color:var(--muted)}
.at-card .at-name{font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-line),0 0 22px var(--accent-soft);transform:scale(1.04)}
.at-card.sel .at-ic,.at-card.sel .at-name{color:var(--text)}

/* ============ MATRIX / SLEEP / LOCK / BOOT ============ */
#matrix{position:fixed;inset:0;z-index:1400;opacity:0;pointer-events:none;transition:opacity .25s;background:#010302}
#matrix.on{opacity:1;pointer-events:auto}
#matrix-cv{width:100%;height:100%;display:block}
.mx-hint{position:absolute;bottom:18px;right:22px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:rgba(90,220,150,.4)}
#sleep{position:fixed;inset:0;background:#000;z-index:1500;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#sleep.on{opacity:1;pointer-events:auto}
.sl-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:slPulse 2.2s ease-in-out infinite}
@keyframes slPulse{50%{opacity:.15;transform:scale(.65)}}
.sl-lab{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:rgba(200,220,240,.32)}
#lock{position:fixed;inset:0;z-index:1600;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
#lock.on{opacity:1;pointer-events:auto}
#lock-bg{position:absolute;inset:0;filter:blur(14px) brightness(.42) saturate(1.2);transform:scale(1.05)}
.l-time{position:relative;z-index:1;font-size:84px;font-weight:200;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:#f0f6fc;opacity:0;transition:opacity .6s .15s;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.l-date{position:relative;z-index:1;font-size:14px;letter-spacing:.1em;color:rgba(225,238,250,.72);margin-top:8px;opacity:0;transition:opacity .6s .28s}
.l-hint{position:absolute;z-index:1;bottom:11vh;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(210,228,248,.42);animation:hintPulse 2.6s ease-in-out infinite}
#lock.on .l-time,#lock.on .l-date{opacity:1}
@keyframes hintPulse{50%{opacity:.45}}
#boot{position:fixed;inset:0;z-index:1700;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 100% at 50% 0%,#060a12,#020308 72%);opacity:0;transition:opacity .45s}
#boot.on{opacity:1}
.b-mark{width:46px;height:46px;color:var(--accent);filter:drop-shadow(0 0 20px var(--accent-soft));animation:bPulse 2s ease-in-out infinite}
@keyframes bPulse{50%{opacity:.55;transform:scale(.94)}}
.b-name{font-size:27px;font-weight:600;letter-spacing:.62em;margin-top:20px;padding-left:.62em;color:#eef4fa}
.b-sub{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--faint);margin-top:9px;padding-left:.34em}
.b-log{margin-top:28px;width:310px;max-width:84vw;font-family:var(--mono);font-size:11px;line-height:2;color:var(--faint);text-align:left;min-height:124px}
.b-line{display:flex;justify-content:space-between;gap:14px}
.b-line .ok{color:#63d8a8}
.b-bar{width:220px;height:2px;background:rgba(255,255,255,.08);border-radius:1px;margin-top:20px;overflow:hidden}
.b-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.75));transition:width .25s ease}
#dim{position:fixed;inset:0;z-index:1800;pointer-events:none;transition:background .4s}
#tint{position:fixed;inset:0;z-index:1800;pointer-events:none;transition:background .9s}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;background:var(--panel-3);border:1px solid var(--border-soft);color:var(--text);font-size:12.5px;transition:background .14s,border-color .14s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn.danger{color:#ff9aa2}
.btn.danger:hover{background:rgba(255,90,100,.12);border-color:rgba(255,90,100,.35)}
.btn.sm{padding:4px 10px;font-size:11.5px}
@keyframes shake{20%{transform:translateX(-4px)}45%{transform:translateX(4px)}70%{transform:translateX(-3px)}}

/* ============ APP: FILES ============ */
.files{display:flex;flex-direction:column;height:100%}
.f-bar{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.f-nav,.f-tool{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:12px;transition:background .13s,color .13s}
.f-nav:hover,.f-tool:hover{background:var(--hover);color:var(--text)}
.f-nav:disabled{opacity:.32;pointer-events:none}
.f-crumbs{display:flex;gap:1px;align-items:center;margin:0 8px;overflow:hidden;flex:1;min-width:60px}
.crumb{padding:4px 8px;border-radius:6px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.crumb:hover{background:var(--hover);color:var(--text)}
.crumb.cur{color:var(--text);font-weight:600}
.crumb-sep{color:var(--faint);font-size:11px;padding:0 1px}
.f-list{flex:1;overflow:auto;padding:4px 6px 6px}
.f-cols{display:grid;grid-template-columns:30px minmax(0,1fr) 130px 64px;gap:8px;align-items:center;padding:0 10px 5px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.frow{display:grid;grid-template-columns:30px minmax(0,1fr) 130px 64px;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;font-size:13px;transition:background .1s}
.frow:hover{background:var(--hover)}
.frow.sel{background:var(--accent-soft)}
.frow .f-ic{color:var(--muted);display:grid;place-items:center}
.frow.sel .f-ic{color:var(--accent)}
.f-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-meta,.f-size{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-status{display:flex;gap:16px;padding:7px 13px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--faint)}
.f-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:44px 0;color:var(--faint);font-size:12.5px}

/* ============ APP: NOTES ============ */
.notes{display:flex;height:100%;min-width:0}
.nl{width:222px;min-width:168px;flex:none;border-right:1px solid var(--border-soft);display:flex;flex-direction:column}
.nl-head{display:flex;gap:6px;padding:10px 10px 7px;align-items:center}
.nl-new{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft)}
.nl-new:hover{background:var(--accent);color:#06121a}
.nl-tit{font-size:12.5px;font-weight:700}
.nl-in{margin:0 10px 8px;height:30px;padding:0 11px;background:var(--panel-3);border:1px solid var(--border-soft);border-radius:8px;font-size:12.5px;transition:border-color .14s}
.nl-in:focus{border-color:var(--accent-line)}
.nl-items{flex:1;overflow:auto;padding:0 6px 8px}
.nl-item{padding:9px 11px;border-radius:8px;cursor:pointer;border-left:2px solid transparent;margin-bottom:1px}
.nl-item:hover{background:var(--hover)}
.nl-item.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.nl-t{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl-s{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.nl-d{font-size:10px;color:var(--faint);margin-top:3px}
.ned{flex:1;display:flex;flex-direction:column;min-width:0}
.ned-title{border:0;background:transparent;font-size:17px;font-weight:700;padding:14px 16px 5px}
.ned-body{flex:1;border:0;background:transparent;resize:none;padding:0 16px 16px;font-size:13.5px;line-height:1.62;overflow:auto}
.ned-status{display:flex;gap:14px;align-items:center;padding:7px 14px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--faint)}
.ned-dirty{color:var(--accent);font-weight:600}
.ned-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--faint);font-size:13px}
.ned-prev{flex:1;overflow:auto;padding:16px 22px 24px;font-size:13.5px;line-height:1.68}

/* ============ APP: EDITOR ============ */
.editor{display:flex;flex-direction:column;height:100%}
.ed-bar{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--border-soft)}
.ed-path{font-family:var(--mono);font-size:11px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.ed-prev{flex:1;overflow:auto;padding:16px 22px 24px;font-size:13.5px;line-height:1.68}
.ed-prev h2{font-size:19px;margin:6px 0 8px}
.ed-prev h3{font-size:15.5px;margin:14px 0 7px}
.ed-prev h4{font-size:14px;margin:12px 0 6px}
.ed-prev p{margin:7px 0;color:var(--text);line-height:1.65}
.ed-prev ul{margin:7px 0 7px 20px;line-height:1.7}
.ed-prev pre{background:rgba(0,0,0,.35);border:1px solid var(--border-soft);border-radius:9px;padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.6;overflow:auto;margin:10px 0}
.ed-prev code{font-family:var(--mono);font-size:.92em;background:var(--panel-3);border-radius:4px;padding:1px 5px}
.ed-prev pre code{background:none;padding:0}
html[data-theme="light"] .ed-prev pre{background:rgba(15,25,40,.07)}
.ed-area{flex:1;resize:none;border:0;background:transparent;padding:13px 17px;font-family:var(--mono);font-size:12.5px;line-height:1.62;overflow:auto}
.ed-status{display:flex;gap:16px;align-items:center;padding:7px 13px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--faint)}
.ed-dirty{color:var(--accent);font-weight:600}

/* ============ APP: TERMINAL ============ */
.term{display:flex;flex-direction:column;height:100%;background:rgba(3,6,10,.5);font-family:var(--mono);font-size:12.5px;line-height:1.55}
.t-out{flex:1;overflow:auto;padding:11px 15px}
.t-line{white-space:pre-wrap;word-break:break-word;color:rgba(210,224,238,.84)}
.t-line.cmd{color:var(--text)}
.t-line.err{color:#ff8d95}
.t-line.ok{color:#63d8a8}
.t-line.dim{color:var(--faint)}
.t-line.ac{color:var(--accent)}
.t-line.pre{white-space:pre;color:#b9d3e8}
.t-line b{color:#dfe9f4}
.t-in-row{display:flex;gap:9px;align-items:center;padding:7px 15px 12px}
.tp{color:var(--accent);white-space:nowrap}
.t-in{flex:1;background:transparent;outline:none;font:inherit;color:var(--text);caret-color:var(--accent)}

/* ============ APP: CALCULATOR ============ */
.calc{display:flex;flex-direction:column;height:100%;padding:13px;gap:9px;outline:none}
.c-hist{font-size:11px;color:var(--faint);text-align:right;min-height:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.c-disp{font-size:31px;font-weight:600;text-align:right;min-height:42px;overflow:hidden;white-space:nowrap;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.c-disp.err{color:#ff8d95;animation:shake .3s}
.c-expr{font-size:12.5px;color:var(--muted);text-align:right;min-height:17px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.c-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:7px}
.c-key{border-radius:9px;background:var(--panel-3);border:1px solid var(--border-soft);color:var(--text);font-size:14.5px;display:grid;place-items:center;transition:transform .06s,background .14s,border-color .14s;user-select:none;min-height:34px}
.c-key:hover{background:var(--hover)}
.c-key:active{transform:scale(.955)}
.c-key.op{color:var(--muted);font-size:17px}
.c-key.eq{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-size:19px;font-weight:700}
.c-key.eq:hover{background:var(--accent);color:#06121a}

/* ============ APP: MONITOR ============ */
.mon{display:flex;flex-direction:column;height:100%;gap:10px;padding:12px;overflow:auto}
.mon-head{display:flex;gap:8px;flex-wrap:wrap}
.mon-chip{display:flex;flex-direction:column;gap:3px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;padding:7px 13px;min-width:118px}
.mch-l{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.mch-v{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.mon-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mon-card{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px;padding:10px 13px}
.mc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.mc-name{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.mc-val{font-size:12.5px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.mc-cv{width:100%;height:54px;display:block}
.mon-procs{flex:1;min-height:120px;overflow:auto;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px}
.pr-row{display:grid;grid-template-columns:minmax(0,1.5fr) 52px 66px 66px 30px;gap:8px;padding:6px 13px;font-size:12px;align-items:center;border-top:1px solid var(--border-soft);font-variant-numeric:tabular-nums}
.pr-row:first-child{border-top:0}
.pr-row.head{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.pr-row:not(.head):hover{background:var(--hover)}
.pr-num{color:var(--muted)}
.pr-kill{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--faint)}
.pr-kill:hover{color:#ff8d95;background:rgba(255,90,100,.1)}
.pr-row.gone{opacity:0;transform:translateX(12px);transition:all .25s}

/* ============ APP: SETTINGS ============ */
.set{display:flex;height:100%;min-width:0}
.set-nav{width:172px;flex:none;border-right:1px solid var(--border-soft);padding:11px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.set-nav button{display:flex;gap:10px;align-items:center;padding:8px 11px;border-radius:8px;font-size:12.5px;color:var(--muted);text-align:left;transition:background .12s,color .12s}
.set-nav button:hover{background:var(--hover);color:var(--text)}
.set-nav button.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
.set-main{flex:1;overflow:auto;padding:16px 22px 26px;min-width:0}
.set-h{font-size:15.5px;font-weight:700}
.set-sub{font-size:12px;color:var(--muted);margin:4px 0 13px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:12px 0;border-bottom:1px solid var(--border-soft)}
.set-row:last-child{border-bottom:0}
.set-name{font-size:13px;font-weight:600}
.set-desc{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.seg{display:flex;background:var(--panel-3);border:1px solid var(--border-soft);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:6px;font-size:12px;color:var(--muted);transition:all .13s}
.seg button:hover{color:var(--text)}
.seg button.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tog{width:38px;height:22px;border-radius:11px;background:var(--panel-3);border:1px solid var(--border);position:relative;flex:none;transition:background .2s,border-color .2s}
.tog-k{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:all .2s}
.tog.on{background:var(--accent-soft);border-color:var(--accent-line)}
.tog.on .tog-k{left:18px;background:var(--accent)}
.swatches{display:flex;gap:9px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;transition:transform .12s}
.sw:hover{transform:scale(1.15)}
.sw.cur{border-color:var(--text);box-shadow:0 0 0 2px var(--panel)}
.set input[type=range]{accent-color:var(--accent);width:150px}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:10px}
.wall-card{cursor:pointer;border-radius:9px;overflow:hidden;border:2px solid transparent;background:var(--panel-2);transition:border-color .14s,transform .12s}
.wall-card:hover{transform:translateY(-2px)}
.wall-card.cur{border-color:var(--accent)}
.wall-thumb{height:62px;position:relative;overflow:hidden}
.wall-thumb canvas{width:100%;height:100%;display:block}
.wt-aurora{background:radial-gradient(circle at 28% 30%,rgba(15,93,110,.65),transparent 56%),radial-gradient(circle at 74% 68%,rgba(29,47,110,.6),transparent 56%),linear-gradient(180deg,#04070c,#0c1f2b)}
.wt-lunar{background:radial-gradient(circle at 50% 128%,#1a2c44 0 34%,rgba(26,44,68,0) 35%),linear-gradient(180deg,#030509,#0d1e30)}
.wt-mesh{background:repeating-linear-gradient(0deg,rgba(140,180,220,.07) 0 1px,transparent 1px 14px),repeating-linear-gradient(90deg,rgba(140,180,220,.06) 0 1px,transparent 1px 14px),linear-gradient(180deg,#04060a,#0a0f18)}
.wall-name{padding:5px 8px;font-size:11px;color:var(--muted)}
.sys-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ============ APP: KNOWLEDGE ============ */
.kb{display:flex;flex-direction:column;height:100%}
.kb-bar{display:flex;gap:6px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--border-soft)}
.kb-addr{flex:1;height:30px;padding:0 12px;background:var(--panel-3);border:1px solid var(--border-soft);border-radius:8px;font-size:12.5px;transition:border-color .14s}
.kb-addr:focus{border-color:var(--accent-line)}
.kb-body{flex:1;overflow:auto;padding:22px 27px 30px}
.kb-body h1{font-size:20px;font-weight:700;margin-bottom:5px}
.kb-body h2{font-size:15px;font-weight:700;margin:19px 0 8px}
.kb-body h3{font-size:13.5px;margin:14px 0 6px}
.kb-body p{font-size:13px;color:var(--muted);line-height:1.68;margin:6px 0;max-width:66ch}
.kb-body ul{margin:6px 0 6px 20px;font-size:13px;color:var(--muted);line-height:1.72;max-width:64ch}
.kb-body code{font-family:var(--mono);font-size:11.5px;background:var(--panel-3);padding:1px 5px;border-radius:4px;color:var(--text)}
.kb-body pre{background:rgba(0,0,0,.35);border:1px solid var(--border-soft);border-radius:9px;padding:13px;font-family:var(--mono);font-size:11.5px;line-height:1.65;overflow:auto;margin:9px 0;max-width:100%}
html[data-theme="light"] .kb-body pre{background:rgba(15,25,40,.07)}
.kb-body .kbd{font-family:var(--mono);font-size:10.5px;background:var(--panel-3);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:2px 7px;color:var(--text);white-space:nowrap}
.kb-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px;margin-top:16px}
.kb-card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border-soft);transition:border-color .15s,transform .12s}
.kb-card:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.kc-t{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.kc-t .ic{color:var(--accent)}
.kc-d{font-size:11.5px;color:var(--muted);line-height:1.5}

/* ============ APP: GALLERY ============ */
.gal{display:flex;flex-direction:column;height:100%;padding:12px;gap:10px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow:auto;align-content:start}
.gal-tile{cursor:pointer;border-radius:10px;overflow:hidden;border:2px solid transparent;background:var(--panel-2);transition:border-color .14s,transform .12s}
.gal-tile:hover{transform:translateY(-2px)}
.gal-tile.cur{border-color:var(--accent)}
.gal-tile canvas{width:100%;height:92px;object-fit:cover;display:block}
.gt-name{padding:6px 9px;font-size:11.5px;color:var(--muted)}
.gal-view{display:flex;flex-direction:column;gap:9px;height:100%}
.gv-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.gv-cv{max-width:100%;max-height:100%;border-radius:10px;border:1px solid var(--border);box-shadow:var(--shadow-soft)}
.gv-nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:46px;border-radius:9px;background:var(--panel);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);z-index:2}
.gv-nav:hover{color:var(--text);background:var(--panel-2)}
.gv-nav.l{left:10px}.gv-nav.r{right:10px}
.gv-bar{display:flex;align-items:center;gap:11px}
.gv-name{font-size:13.5px;font-weight:700}
.gv-sub{font-size:11px;color:var(--faint)}

/* ============ APP: TRASH ============ */
.trash{display:flex;flex-direction:column;height:100%}
.tr-bar{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border-soft);font-size:12px;color:var(--muted)}
.tr-bar .sp{flex:1}
.tr-list{flex:1;overflow:auto;padding:8px}
.tr-row{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px}
.tr-row:hover{background:var(--hover)}
.tr-ic{color:var(--faint)}
.tr-name{font-size:13px;font-weight:600}
.tr-from{font-size:11px;color:var(--faint);margin-top:1px}
.tr-acts{margin-left:auto;display:flex;gap:6px}
.tr-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;color:var(--faint);font-size:12.5px}

/* ============ APP: ABOUT ============ */
.about{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 26px 24px;gap:4px;height:100%;overflow:auto}
.ab-mark{width:54px;height:54px;color:var(--accent);filter:drop-shadow(0 0 20px var(--accent-soft))}
.ab-name{font-size:22px;font-weight:700;letter-spacing:.3em;padding-left:.3em;margin-top:12px}
.ab-ver{font-size:12px;color:var(--muted);margin-top:4px}
.ab-specs{width:100%;max-width:344px;margin-top:18px;border-top:1px solid var(--border-soft)}
.ab-row{display:flex;justify-content:space-between;gap:12px;padding:9px 3px;border-bottom:1px solid var(--border-soft);font-size:12.5px}
.ab-k{color:var(--faint)}
.ab-v{color:var(--text);font-weight:500;text-align:right}
.ab-note{font-size:11.5px;color:var(--faint);line-height:1.65;max-width:370px;margin-top:16px}
</style>
